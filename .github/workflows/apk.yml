# Android uygulaması (deneme APK'sı). GitHub → Actions → APK → Run workflow ile elle başlatılır.
# Bitince çalışmanın sayfasındaki "Artifacts" bölümünden canli-skor-apk indirilir (içinde app-debug.apk).
# Uygulama ayarları: uygulama/capacitor.config.json

name: APK

on: workflow_dispatch

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Site dosyaları uygulamaya
        run: |
          mkdir -p uygulama/www
          cp index.html canli-skor.webmanifest firebase-messaging-sw.js cs-*.png uygulama/www/

      - name: Android projesi
        working-directory: uygulama
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Simge ve açılış ekranı
        working-directory: uygulama/android/app/src/main/res
        run: |
          for d in mipmap-*dpi; do
            cp ../../../../../../cs-icon-maskable-512.png "$d/ic_launcher_foreground.png"
            cp ../../../../../../cs-icon-192.png "$d/ic_launcher.png"
            cp ../../../../../../cs-icon-192.png "$d/ic_launcher_round.png"
          done
          cp ../../../../../simge/ic_launcher.xml mipmap-anydpi-v26/ic_launcher.xml
          cp ../../../../../simge/ic_launcher.xml mipmap-anydpi-v26/ic_launcher_round.xml
          rm drawable*/splash.png
          cp ../../../../../simge/splash.xml drawable/splash.xml

      - name: APK derle
        working-directory: uygulama/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: canli-skor-apk
          path: uygulama/android/app/build/outputs/apk/debug/app-debug.apk
