    const england = FLAGS.en;
    const turkey = FLAGS.tr;
    const spain = FLAGS.es;
    const italy = FLAGS.it;
    const germany = FLAGS.de;
    const france = FLAGS.fr;
    const netherlands = h3('#ae1c28', '#fff', '#21468b');
    const belgium = v3('#000', '#fdda24', '#ef3340');
    const portugal = svg('<rect width="30" height="20" fill="#da291c"/><rect width="12" height="20" fill="#046a38"/><circle cx="12" cy="10" r="3.6" fill="#ffe900"/>');
    const denmark = svg('<rect width="30" height="20" fill="#c8102e"/><rect x="9" width="3.5" height="20" fill="#fff"/><rect y="8.25" width="30" height="3.5" fill="#fff"/>');
    const scotland = svg('<rect width="30" height="20" fill="#005eb8"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="3.2"/>');
    const usa = svg('<rect width="30" height="20" fill="#fff"/>' +
        [0, 2, 4, 6, 8, 10, 12].map(i => '<rect y="' + (i * 20 / 13) + '" width="30" height="' + (20 / 13) + '" fill="#b22234"/>').join('') +
        '<rect width="13" height="10.8" fill="#3c3b6e"/>');

        Array.from({ length: 12 }, (_, i) => {

})();

function AN_FLAG(league) {
    return AN_FLAGS[league] || '';
}

/* Seçili gün: 'YYYY-AA-GG' ya da 'ALL' (Tümü) */
let anDay = TODAY;

/* Bugün ve sonraki 3 gün (hepsi aynı anda görünür) */
function anDayKeys() {
    const keys = [];
    for (let d = 0; d <= 3; d++) {
        const day = new Date(TODAY + 'T12:00:00');
        day.setDate(day.getDate() + d);
        keys.push(dayKey(day));
    }
    return keys;
}

function renderAnDays() {

    const box = document.getElementById('anDayBox');
    box.textContent = '';

    const keys = anDayKeys();

    keys.forEach(key => {

        const date = new Date(key + 'T12:00:00');
        const button = document.createElement('button');

        /* Gün adı ve yanında o günkü analiz sayısı: "Bugün (72)" */
        button.textContent = (key === TODAY ? 'Bugün' : DAYS[date.getDay()]) +
            ' (' + AN_LIST.filter(m => m.date_iso === key).length + ')';

        button.classList.toggle('active', key === anDay);
        button.addEventListener('click', () => selectAnDay(key));
        box.appendChild(button);
    });

    /* Tümü de yanında bütün analizlerin sayısıyla: "Tümü (84)" */
    const all = document.getElementById('anAll');
    all.textContent = 'Tümü (' + AN_LIST.length + ')';
    all.classList.toggle('active', anDay === 'ALL');
}

function selectAnDay(key) {
    anDay = key;
    renderAnDays();
    renderAnalysis();
}

/* Tümü: açıkken tekrar basınca seçim iptal olur, Bugün'e dönülür */
document.getElementById('anAll').addEventListener('click', () => {
    selectAnDay(anDay === 'ALL' ? TODAY : 'ALL');
});

/* Ligler: analizdeki ligler, işaret kutulu (boşsa hepsi) */
const anLeagues = new Set();
const anLeagueMenu = document.getElementById('anLeagueMenu');
const anLeagueBtn = document.getElementById('anLeagueBtn');

[...new Set(AN_LIST.map(m => m.league))].sort((a, b) => a.localeCompare(b, 'tr')).forEach(name => {

    const label = document.createElement('label');
    const input = document.createElement('input');
    const text = document.createElement('span');
    const count = document.createElement('small');

    input.type = 'checkbox';
    text.textContent = name;
    count.textContent = AN_LIST.filter(m => m.league === name).length;

    input.addEventListener('change', () => {
        if (input.checked)
            anLeagues.add(name);
        else
            anLeagues.delete(name);

        anLeagueBtn.firstChild.textContent = anLeagues.size ? 'Ligler (' + anLeagues.size + ') ' : 'Ligler ';
        anLeagueBtn.classList.toggle('active', anLeagues.size > 0);
        renderAnalysis();
    });

    label.appendChild(input);
    label.appendChild(text);
    label.appendChild(count);
    anLeagueMenu.appendChild(label);
});

anLeagueBtn.addEventListener('click', () => {

    if (openLeagueMenu === anLeagueMenu) {
        closeLeagueMenu();
        return;
    }

    hideLeagueMenu();
    anLeagueMenu.classList.add('open');
    openLeagueMenu = anLeagueMenu;
    layerOpened('leagueMenu');
});

/* Analiz kartı: üstte lig ve tarih, ortada takımlar ve öne çıkan tercih,
   altta korner / kart / ofsayt; basınca açılır */
function anCard(m) {

    const card = document.createElement('div');
    card.className = 'an-card';
    card.setAttribute('role', 'button');

    const stars = '★'.repeat(m.stars) + '<i>' + '★'.repeat(5 - m.stars) + '</i>';

    card.innerHTML =
        '<div class="an-head"><span class="oc-league"></span><span class="an-when"></span></div>' +
        '<div class="an-body">' +
            '<div class="an-teams"><div class="an-team" data-side="home"></div><div class="an-team" data-side="away"></div></div>' +
            '<div class="an-pick"><small>Öne Çıkan Tercih</small><b></b><span class="an-stars">' + stars + '</span></div>' +
        '</div>' +
        '<div class="an-strip"><div class="an-chips">' +
            '<span class="an-chip"><span>🚩 Korner:</span> <em></em></span>' +
            '<span class="an-chip"><span class="an-yellow"></span> <span>Kart:</span> <em></em></span>' +
            '<span class="an-chip"><span>📐 Ofsayt:</span> <em></em></span>' +
        '</div><span class="an-hint">Detay ▾</span></div>' +
        '<div class="an-expand"><h4>📌 Maç Analizi & Taktik Nedenler:</h4>' +
            '<ul class="an-reasons"></ul><div class="an-subs"></div>' +
            '<button class="an-deep">📊 Detaylı Analiz</button></div>';

    /* Solda bayrak ve lig adı (silik), sağda tarih ve saat: Oranlar kartı gibi */
    const league = card.querySelector('.oc-league');
    league.innerHTML = AN_FLAG(m.league) + '<span></span>';
    league.querySelector('span').textContent = m.league;

    const when = new Date(m.ts * 1000);
    card.querySelector('.an-when').textContent = formatDate(when) + ' ' + formatTime(when);

    ['home', 'away'].forEach(side => {
        const el = card.querySelector('.an-team[data-side="' + side + '"]');
        el.appendChild(crest({ short: m[side + '_code'], bg: m[side + '_bg'], fg: m[side + '_fg'] }));
        const name = document.createElement('span');
        name.textContent = m[side];
        el.appendChild(name);
    });

    card.querySelector('.an-pick b').textContent = m.featured_pick;

    const chips = card.querySelectorAll('.an-chip em');
    chips[0].textContent = m.corner_chip;
    chips[1].textContent = m.card_chip;
    chips[2].textContent = m.offside_chip;

    /* Gerekçeler analiz dosyasından geliyor (kalın yazılar için <b> içerir) */
    card.querySelector('.an-reasons').innerHTML = m.card_reasons.map(r => '<li>' + r + '</li>').join('');

    const subs = card.querySelector('.an-subs');
    m.sub_boxes.forEach(box => {
        const el = document.createElement('div');
        el.className = 'an-sub';
        el.innerHTML = '<span></span><b></b>';
        el.querySelector('span').textContent = box.label;
        el.querySelector('b').textContent = box.val;
        subs.appendChild(el);
    });

    /* Aynı anda tek kart açık */
    /*
     * Açılan kart en üste, şeridin hemen altına gelir.
     * Kapanan kartın üst kenarı olduğu yerde kalır.
     */
    card.addEventListener('click', () => {

        /* Kapanma hareketi sürerken basılırsa bekle */
        if (card.classList.contains('closing'))
            return;

        const open = !card.classList.contains('open');
        const topBefore = card.getBoundingClientRect().top;

        document.querySelectorAll('.an-card.open').forEach(c => {
            if (c !== card)
                foldAnCard(c, false);
        });

        if (open) {
            foldAnCard(card, true);
            scrollAnCardTop(card);
        } else {
            foldAnCard(card, false, () => {
                homeMain.scrollTop += card.getBoundingClientRect().top - topBefore;
            });
        }
    });

    card.querySelector('.an-deep').addEventListener('click', event => {
        event.stopPropagation();
        openAnSheet(m.key);
    });

    return card;
}

/* Kart anında açılır (yukarı kayarken büyümesin diye), 0.15 saniyede küçülerek kapanır */
function foldAnCard(card, open, done) {

    const expand = card.querySelector('.an-expand');
    card.querySelector('.an-hint').textContent = open ? 'Kapat ▴' : 'Detay ▾';

    if (open) {
        card.classList.add('open');
        return;
    }

    card.classList.add('closing');

    const css = getComputedStyle(expand);
    const full = {
        height: expand.offsetHeight + 'px', marginTop: css.marginTop,
        paddingTop: css.paddingTop, borderTopWidth: css.borderTopWidth, overflow: 'hidden'
    };
    const none = { height: 0, marginTop: 0, paddingTop: 0, borderTopWidth: 0, overflow: 'hidden' };

    const anim = expand.animate([full, none], { duration: 150, easing: 'ease-out', fill: 'forwards' });

    anim.onfinish = () => {
        card.classList.remove('open', 'closing');
        anim.cancel();
        if (done)
            done();
    };
}

/*
 * Açılan kart yavaşça kayıp en üste, şeridin hemen altına gelir (0.6 sn).
 * Üstte kapanan kart varsa hedef her karede yeniden ölçülür.
 */
let anScrollRun = 0;

function scrollAnCardTop(card) {

    const run = ++anScrollRun;
    const start = homeMain.scrollTop;
    const begin = performance.now();

    (function step(now) {
        if (run !== anScrollRun)
            return;

        const t = Math.min(1, (now - begin) / 600);
        const ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const target = homeMain.scrollTop +
            card.getBoundingClientRect().top - homeMain.getBoundingClientRect().top;

        homeMain.scrollTop = start + (target - start) * ease;

        if (t < 1)
            requestAnimationFrame(step);
    })(begin);
}

        empty.textContent = query
            ? '"' + raw + '" için analiz bulunamadı.'
            : 'Bu gün için analiz yok.';

    }

    /* Her zaman yıldıza göre: çok yıldızlı üstte, aynı yıldızda saat sırası */
    list.sort((a, b) => b.stars - a.stars || a.ts - b.ts);

/* =================================================
   GERİ TUŞU
   -------------------------------------------------
   Açılan her katman (sayfa, menü...) geçmişe bir kayıt
   ekler; geri tuşu en son açılanı kapatır.
================================================= */

const openLayers = [];
let ignoredPops = 0;
let waitingLayers = [];

const LAYER_HIDERS = {
    empty: () => setTab('home'),
    leagueMenu: hideLeagueMenu,
    homeMode: () => setHomeModeView('live'),
    homeMenu: () => homeMenu.classList.remove('open'),
    detail: hideDetail,
    confirm: hideConfirm,
    calendar: hideCalendar
};

function layerOpened(name, url) {

    if (ignoredPops > 0) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        waitingLayers.push({ name: name, url: url });
        return;
    }

    try {

        if (openLayers.includes(name)) {
            if (url)
                history.replaceState({ depth: openLayers.length }, '', url);
            return;
        }

        openLayers.push(name);
        history.pushState({ depth: openLayers.length }, '', url || location.href);

    } catch (error) {}

    syncBall();
}

function layerClosed(name) {

    if (waitingLayers.some(item => item.name === name)) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        return;
    }

    const index = openLayers.indexOf(name);

    if (index < 0)
        return;

    openLayers.splice(index, 1);
    syncBall();

    ignoredPops++;
    history.back();
}

/*
 * Mavi top: açık bir şey varsa (maç sayfası, Kayıtlı Maçlarım, takvim,
 * menü...) ya da AI Kuponu / Analiz / Oranlar sekmesindeyse geri tuşu gibi
 * çalışır (sekmelerde önce Canlı Skor'a döner), oku aşağı döner.
 */
function somethingOpen() {
    return openLayers.length > 0;
}


window.addEventListener('popstate', event => {

    if (ignoredPops > 0) {

        ignoredPops--;

        if (ignoredPops === 0) {
            const waiting = waitingLayers;
            waitingLayers = [];
            waiting.forEach(item => layerOpened(item.name, item.url));
        }

        return;
    }

    const depth = (event.state && event.state.depth) || 0;

    if (depth > openLayers.length) {
        ignoredPops++;
        history.go(openLayers.length - depth);
        return;
    }

    while (openLayers.length > depth)
        LAYER_HIDERS[openLayers.pop()]();

    syncBall();
});


/* =================================================
   SEKMELER (ana sayfa / boş sayfa) VE MAVİ TOP
================================================= */

const acKapa = document.getElementById('acKapa');

const emptyLayer = document.getElementById('emptyLayer');
let settleTimer = null;

function setTab(name) {

    clearTimeout(settleTimer);

    settleTimer = setTimeout(() => {
        if (name !== 'empty') {
            emptyLayer.classList.remove('raised');
            if (pageBeforeCoupon) {
                setMyPageInstant(pageBeforeCoupon);
                pageBeforeCoupon = null;
            }
        }
    }, 340);

    document.body.dataset.tab = name;
    acKapa.setAttribute('aria-label', name === 'empty' ? 'Ana sayfaya dön' : 'Sayfayı aç');
}

function showTab(name) {

    setTab(name);

    if (name === 'empty')
        layerOpened('empty');
    else
        layerClosed('empty');
}

/*
 * Mavi top: açık bir şey varsa onu kapatır (geri). Yoksa ana sayfa aşağı
 * kaydırılmışsa önce yukarı çıkar; sayfa zaten yukarıdaysa Kayıtlı Maçlarım açılır.
 */
/*
 * Mavi topun durumu, geçmiş (history) beklenmeden o anki ekrandan okunur;
 * böylece sekme kayarken ya da sayfa yukarı kayarken de hemen çalışır.
 *   'close' : üstte açık bir şey var (maç sayfası, pencere, takvim...) → kapatır, ok aşağı
 *   'up'    : sayfa aşağıda → başa çıkar, ok yukarı
 *   'home'  : AI Kuponu / Analiz / Oranlar başında → Canlı Skor'a döner, ok sola
 *   'saved' : Canlı Skor başında → Kayıtlı Maçlarım'ı açar, ok yukarı
 */
let ballScrolling = false;   /* top az önce yukarı kaydırdı (kayma bitmese de başta sayılır) */

function ballAction() {

    if (confirmBox.classList.contains('open') ||
        calendarPop.classList.contains('open') ||
        openLeagueMenu ||
        homeMenu.classList.contains('open') ||
        detailSheet.classList.contains('open') ||
        document.body.dataset.tab === 'empty')
        return 'close';

    /*
     * Sekme değişince sayfa sekme düğmelerinin hizasına gelir; orası da
     * "sekmenin başı" sayılır, ilk basışta doğrudan Canlı Skor'a dönülür.
     */
    const top = homeMode !== 'live' ? Math.max(0, homeTrack.offsetTop - homeMain.offsetTop - 12) : 0;

    if (homeMain.scrollTop > top + 4 && !ballScrolling)
        return 'up';

    return homeMode !== 'live' ? 'home' : 'saved';
}

function syncBall() {
    /* Sayfa ilk kurulurken bazı öğeler henüz yoksa sessizce geç */
    try {
        const action = ballAction();
        document.body.classList.toggle('has-layer', action === 'close');
        document.body.classList.toggle('ball-left', action === 'home');
    } catch (error) {}
}

acKapa.addEventListener('click', () => {

    const action = ballAction();

    if (action === 'close') {

        /* En üstteki kapanır */
        if (confirmBox.classList.contains('open')) closeConfirm();
        else if (calendarPop.classList.contains('open')) closeCalendar();
        else if (openLeagueMenu) closeLeagueMenu();
        else if (homeMenu.classList.contains('open')) closeHomeMenu();
        else if (document.body.dataset.tab === 'empty' &&
                 (emptyLayer.classList.contains('raised') || !detailSheet.classList.contains('open')))
            showTab('home');
        else closeDetail();

    } else if (action === 'up') {

        ballScrolling = true;
        homeMain.scrollTo({ top: 0, behavior: 'smooth' });

    } else if (action === 'home') {

        ballScrolling = false;
        homeMain.scrollTop = 0;
        setHomeMode('live');

    } else {

        ballScrolling = false;
        setMyPageInstant('saved');
        showTab('empty');
    }

    syncBall();
});

/* Sarı top: Kuponlarım açılır */
/* Pencere kapalıyken sekme kaymadan, doğrudan seçilir */
function setMyPageInstant(name) {
    myMain.classList.add('swiping');
    setMyPage(name);
    myTrack.getBoundingClientRect();
    myMain.classList.remove('swiping');
}

/*
 * Sarı top Kuponlarım'ı açar / kapatır. Pencere kapanınca önceki sekmeye
 * dönülür; mavi top her zamanki gibi çalışır.
 */
let pageBeforeCoupon = null;

document.getElementById('couponBall').addEventListener('click', () => {

    const detailOpen = detailSheet.classList.contains('open');
    const layerOpen = document.body.dataset.tab === 'empty';

    /* Kayıtlı Maçlarım'dan açılan maç sayfasındayken: maç sayfası kapanır,
       alttaki pencere Kuponlarım'a geçer */
    if (layerOpen && detailOpen && !emptyLayer.classList.contains('raised')) {
        setMyPageInstant('coupons');
        closeDetail();
        return;
    }

    /* Açıkken tekrar basınca mavi top gibi kapanır, kalınan yere dönülür */
    if (layerOpen) {
        showTab('home');
        return;
    }

    emptyLayer.classList.toggle('raised', detailOpen);
    pageBeforeCoupon = myPage;
    setMyPageInstant('coupons');
    showTab('empty');
});

        page.classList.toggle('current', page.dataset.page === mode);
    });

    /* Kayarken iki sayfa da görünsün; bitince diğerleri gizlenir. */
    homeTrack.classList.add('both');
    homeTrack.style.setProperty('--page', index);

    clearTimeout(homeTrackTimer);
    homeTrackTimer = setTimeout(() => {
        if (!homeSwipe)
            homeTrack.classList.remove('both');
    }, 320);

    syncBall();
}

/*
 * "Canlı Skor" ana sayfadır. Başka bir sayfa açıkken geri
 * tuşu önce "Canlı Skor"a döner.
 */
function setHomeMode(mode) {

    setHomeModeView(mode);
    /* Sayfa çok aşağıdaysa sekme düğmelerinin hizasına gelir (üst resim kaydırılan alanın dışında) */
    homeMain.scrollTop = Math.min(homeMain.scrollTop, homeTrack.offsetTop - homeMain.offsetTop - 12);

    if (mode === 'live')
        layerClosed('homeMode');
    else
        layerOpened('homeMode');
}

homeModeBox.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => setHomeMode(button.dataset.mode));
});

/* Yana kaydırma (inşaat uygulamasındakiyle aynı his) */
const TAB_SWIPE_RATIO = 0.12;
const TAB_FLICK_RATIO = 0.04;

let homeSwipe = null;

function setHomeSwipeX(px) {
    homeTrack.style.setProperty('--swipe-x', px + 'px');
}

homeMain.addEventListener('touchstart', event => {

    /* Gün düğmeleri kendi içinde yana kayar; sayfa değişmez. */
    if (event.touches.length !== 1 || event.target.closest('#liveTools, .tool-row, #oddsSearchBox, #anDayRow, #anSearchBox')) {
        homeSwipe = null;
        return;
    }

    homeSwipe = {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    };

}, { passive: true });

homeMain.addEventListener('touchmove', event => {

    if (!homeSwipe)
        return;

    const dx = event.touches[0].clientX - homeSwipe.x;
    const dy = event.touches[0].clientY - homeSwipe.y;

    if (homeSwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        homeSwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (homeSwipe.horizontal) {
            homeMain.classList.add('swiping');
            homeTrack.classList.add('both');
        }
    }

    if (!homeSwipe.horizontal)
        return;

    homeSwipe.dx = dx;

    const index = HOME_ORDER.indexOf(homeMode);
    const atEdge = (index === 0 && dx > 0) || (index === HOME_ORDER.length - 1 && dx < 0);

    setHomeSwipeX(atEdge ? dx * 0.25 : dx);

    /*
     * Yana kaydırırken sayfa yukarı aşağı kaymasın. Yoksa parmak kalkınca
     * sayfa bir süre kendi kendine kayar; telefon o sırada yapılan ilk
     * dokunuşu (örneğin mavi topa) kaymayı durdurmaya harcar.
     */
    if (event.cancelable)
        event.preventDefault();

}, { passive: false });

function endHomeSwipe() {

    if (!homeSwipe)
        return;

    const swipe = homeSwipe;

    homeSwipe = null;
    homeMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = homeMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = HOME_ORDER[HOME_ORDER.indexOf(homeMode) + (swipe.dx < 0 ? 1 : -1)];

    setHomeSwipeX(0);

    if (enough && next)
        setHomeMode(next);
    else
        setHomeModeView(homeMode);
}

homeMain.addEventListener('touchend', endHomeSwipe, { passive: true });
homeMain.addEventListener('touchcancel', endHomeSwipe, { passive: true });

================================================= */

const homeMenu = document.getElementById('homeMenu');
const menuBtn = document.getElementById('menuBtn');

function closeHomeMenu() {
    homeMenu.classList.remove('open');
    layerClosed('homeMenu');
}

menuBtn.addEventListener('click', event => {

    event.stopPropagation();

    if (homeMenu.classList.contains('open')) {
        closeHomeMenu();
        return;
    }

});

    });
});

document.getElementById('menuClose').addEventListener('click', closeHomeMenu);

/* Menü açıkken başka bir yere dokunulursa sadece menü kapanır. */
let menuSwallow = false;

document.addEventListener('pointerdown', event => {

    menuSwallow =
        homeMenu.classList.contains('open') &&
        !event.target.closest('#homeMenu, #menuBtn');

    if (menuSwallow) {
        event.preventDefault();
        event.stopPropagation();
        closeHomeMenu();

}, true);

        return;

    menuSwallow = false;

/* =================================================
   MAÇ SAYFASI
================================================= */

const detailSheet = document.getElementById('detailSheet');
const detailTrack = document.getElementById('detailTrack');
const detailBody = document.getElementById('detailBody');
const detailPanel = document.getElementById('detailPanel');
const detailHead = document.getElementById('detailHead');
const scoreBoard = document.getElementById('scoreBoard');

const DETAIL_TABS = ['summary', 'stats', 'lineup', 'odds', 'comments'];
const LINK_PREFIX = '#mac=';

let detailId = null;
let detailTab = 'summary';

function sbTeam(el, team) {
    el.textContent = '';
    el.appendChild(crest(team));
    const name = document.createElement('span');
    name.textContent = team.name;
    el.appendChild(name);
}

function renderSummary(match) {

    const box = document.getElementById('summaryBox');
    box.textContent = '';

    if (!match.events) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'Maç ' + formatDate(match.date) + ' ' + formatTime(match.date) +
            ' saatinde başlayacak.';
        box.appendChild(p);
        return;
    }

    let halfShown = false;

    const events = match.events.slice();

    if (events.some(e => e.minute <= 45)) {
        const first = document.createElement('div');
        first.className = 'half-line';
        first.textContent = 'İLK YARI';
        box.appendChild(first);
    }

    if (!events.length) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'Henüz önemli bir olay yok.';
        box.appendChild(p);
    }

    events.forEach(event => {

        if (!halfShown && event.minute > 45) {
            halfShown = true;
            const line = document.createElement('div');
            line.className = 'half-line';
            line.textContent = 'İKİNCİ YARI';
            box.appendChild(line);
        }

        const row = document.createElement('div');
        row.className = 'event';

        const home = document.createElement('div');
        home.className = 'home';
        const minute = document.createElement('div');
        minute.className = 'minute';
        minute.textContent = event.minute + (event.extra ? '+' + event.extra : '') + "'";
        const away = document.createElement('div');

        const label = document.createElement('span');
        label.className = 'event-label';

        /* Oyuncu adı varsa ad, yoksa olayın adı yazar */
        if (event.type === 'goal') {
            label.textContent = '⚽ ' + (event.player || 'Gol') +
                (event.detail === 'p' ? ' (P)' : event.detail === 'kk' ? ' (KK)' : '');
        } else {
            const icon = document.createElement('span');
            icon.className = 'card-icon' + (event.type === 'red' ? ' red' : '');
            label.appendChild(icon);
            label.appendChild(document.createTextNode(
                event.player || (event.type === 'red' ? 'Kırmızı kart' : 'Sarı kart')
            ));
        }

        (event.side === 'home' ? home : away).appendChild(label);

        row.appendChild(home);
        row.appendChild(minute);
        row.appendChild(away);
        box.appendChild(row);
    });

    if (match.status === 'done' && match.score) {
        const end = document.createElement('div');
        end.className = 'half-line';
        end.textContent = 'MAÇ SONU · ' + match.score[0] + ' - ' + match.score[1];
        box.appendChild(end);
    }
}

function renderStats(match) {

    const box = document.getElementById('statsBox');
    box.textContent = '';

    if (!match.stats || !match.stats[0] || !match.stats[1]) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = leagueHasDetail(match.league.id)
            ? 'İstatistikler maç başlayınca görünecek.'
            : 'Bu lig için istatistik verisi yok.';
        box.appendChild(p);
        return;
    }

    /* Sıra: sunucu/VERITABANI.md → "İstatistik sırası" */
    const [h, a] = match.stats.map(list => list.map(value => value || 0));

    const cards = side => (match.events || []).filter(e => e.side === side && e.type !== 'goal').length;

    [
        ['Topla oynama', h[9] + '%', a[9] + '%', h[9], a[9]],
        ['Şut', h[2], a[2]],
        ['İsabetli şut', h[0], a[0]],
        ['Korner', h[7], a[7]],
        ['Faul', h[6], a[6]],
        ['Kart', cards('home'), cards('away')]
    ].forEach(([label, h, a, hv, av]) => {

        hv = hv === undefined ? h : hv;
        av = av === undefined ? a : av;

        const total = (hv + av) || 1;

        const line = document.createElement('div');
        line.className = 'stat-line';

        line.innerHTML =
            '<div class="stat-top"><span></span><span></span><span></span></div>' +
            '<div class="stat-bars"><div class="h"></div><div class="a"></div></div>';

        const spans = line.querySelectorAll('.stat-top span');
        spans[0].textContent = h;
        spans[1].textContent = label;
        spans[2].textContent = a;

        const bars = line.querySelectorAll('.stat-bars div');
        bars[0].style.flex = String(Math.max(hv, 0.001) / total);
        bars[1].style.flex = String(Math.max(av, 0.001) / total);

        box.appendChild(line);
    });

    /* Verinin son değiştiği saat (sunucunun yazdığı an) */
    if (match.updated) {
        const note = document.createElement('p');
        note.className = 'odds-note';
        note.textContent = 'Son güncelleme: ' + formatTime(match.updated);
        box.appendChild(note);
    }
}

/* KADRO: sunucu/VERITABANI.md → "Kadro" */
const POSITIONS = { G: 'KL', D: 'DF', M: 'OS', F: 'FV' };

function renderLineup(match) {

    const box = document.getElementById('lineupBox');
    box.textContent = '';

    if (!match.lineup || !match.lineup.some(Boolean)) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = leagueHasDetail(match.league.id)
            ? 'Kadrolar maçtan yaklaşık 1 saat önce açıklanır.'
            : 'Bu lig için kadro verisi yok.';
        box.appendChild(p);
        return;
    }

    const grid = document.createElement('div');
    grid.className = 'lineup';

    [match.home, match.away].forEach((team, side) => {

        const [formation, , players] = match.lineup[side] || [];

        const col = document.createElement('div');

        const head = document.createElement('div');
        head.className = 'lineup-head';
        head.appendChild(crest(team));
        const name = document.createElement('span');
        name.textContent = team.mid || team.name;
        head.appendChild(name);
        col.appendChild(head);

        const form = document.createElement('div');
        form.className = 'lineup-formation';
        form.textContent = formation || '–';
        col.appendChild(form);

        (players || []).forEach(([number, player, position]) => {
            const row = document.createElement('div');
            row.className = 'lineup-player';
            row.innerHTML = '<b></b><span></span><small></small>';
            row.querySelector('b').textContent = number === null ? '' : number;
            row.querySelector('span').textContent = player || '';
            row.querySelector('small').textContent = POSITIONS[position] || '';
            col.appendChild(row);
        });

        grid.appendChild(col);
    });

    box.appendChild(grid);
}

function renderDetailOdds(match) {

    const box = document.getElementById('oddsBox');
    box.textContent = '';

    if (!match.odds) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'Tahmini oranlar yakında eklenecek.';
        box.appendChild(p);
        return;
    }

    const block = (title, labels, keys) => {
        const wrap = document.createElement('div');
        wrap.className = 'odds-block';
        const t = document.createElement('p');
        t.className = 'odds-title';
        t.textContent = title;
        wrap.appendChild(t);
        wrap.appendChild(oddsRow(match, labels, keys, true));
        box.appendChild(wrap);
    };

    block('MAÇ SONUCU', ['1', 'X', '2'], ['home', 'draw', 'away']);
    block('2,5 GOL ALT / ÜST', ['Alt', 'Üst'], ['under', 'over']);
    block('9,5 KORNER ALT / ÜST', ['Alt', 'Üst'], ['cornerUnder', 'cornerOver']);
    block('4,5 KART ALT / ÜST', ['Alt', 'Üst'], ['cardUnder', 'cardOver']);

    const note = document.createElement('p');
    note.className = 'odds-note';
    note.textContent = 'Oranlar tahminidir.';
    box.appendChild(note);
}

/*
 * tab: açılışta seçili sekme (Oranlar'dan açılınca Oranlar)
 * Maçın verisi henüz gelmediyse (bağlantı ya da bildirimle açılış) sayfa boş açılır, veri gelince dolar.
 */
let detailWaiting = false;

function openDetail(id, tab = 'summary') {

    const match = MATCH_BY_ID.get(id);

    detailId = id;
    setDetailMode(false);

    if (match) {
        detailWaiting = false;
        fillDetail(match);
        watchDetail(match);
    } else {
        detailWaiting = true;
        emptyDetail();
    }

    /* Bölüm sabit yükseklikte, ilk sekmede başlar. */
    applyDetailLift();

    detailTrack.classList.add('dragging');
    setDetailTab(tab);
    detailTrack.getBoundingClientRect();
    detailTrack.classList.remove('dragging');

    detailSheet.classList.add('open');

    layerOpened('detail', LINK_PREFIX + encodeURIComponent(id));
}

/* Skor tablosu ve sekmeler (yeni veri gelince sekme ve kaydırma yerinde kalır) */
function fillDetail(match) {

    document.getElementById('sbLeague').textContent = matchWhen(match);

    sbTeam(document.getElementById('sbHome'), match.home);
    sbTeam(document.getElementById('sbAway'), match.away);

    document.getElementById('sbScoreText').textContent =
        match.score ? match.score[0] + ' - ' + match.score[1] : formatTime(match.date);

    const status = document.getElementById('sbStatus');
    status.textContent =
        match.status === 'live' ? ('CANLI · ' + minuteText(match)).replace(/ · $/, '') :
        match.status === 'done' ? 'MAÇ SONU' :
        OTHER_LABELS[match.code] ? 'OYNANMAYACAK' : 'OYNANACAK';
    status.className = match.status === 'live' ? 'live' : '';

    renderSummary(match);
    renderStats(match);
    renderLineup(match);
    renderDetailOdds(match);
}

/* Veri beklenirken: skor tablosu boş, Özet'te "Yükleniyor…" (bugünün listesinde yoksa "Maç bulunamadı.") */
function emptyDetail() {

    ['sbLeague', 'sbHome', 'sbAway', 'sbScoreText', 'sbStatus', 'summaryBox', 'statsBox', 'lineupBox', 'oddsBox']
        .forEach(id => { document.getElementById(id).textContent = ''; });
    document.getElementById('sbStatus').className = '';

    const today = days.get(TODAY);
    const p = document.createElement('p');
    p.className = 'tab-empty';
    p.textContent = today && today.loaded ? 'Maç bulunamadı.' : 'Yükleniyor…';
    document.getElementById('summaryBox').appendChild(p);
}

function refreshDetail() {

    if (!detailId || !detailSheet.classList.contains('open'))
        return;

    const match = MATCH_BY_ID.get(detailId);

    if (!match) {
        if (detailWaiting)
            emptyDetail();
        return;
    }

    if (detailWaiting) {
        detailWaiting = false;
        watchDetail(match);
    }

    fillDetail(match);
}

function hideDetail() {
    detailSheet.classList.remove('open');
    detailId = null;
    detailWaiting = false;
    unwatchDetail();
}

function closeDetail() {
    hideDetail();
    layerClosed('detail');
}

document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);

/* Sekmeler */
function setDetailTab(name, keepScroll) {

    detailTab = name;

    detailSheet.querySelectorAll('#detailTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.tab === name);
    });

    placeDetailTrack(0);

    const page = detailSheet.querySelector('.tab-page[data-page="' + name + '"]');

    if (page && !keepScroll)
        page.scrollTop = 0;
}

function placeDetailTrack(dragPx) {
    const index = DETAIL_TABS.indexOf(detailTab);
    detailTrack.style.transform =
        'translateX(calc(' + (-index * 20) + '% + ' + dragPx + 'px))';
}

detailSheet.querySelectorAll('#detailTabs button').forEach(button => {
    button.addEventListener('click', () => setDetailTab(button.dataset.tab));
});

/* Sekmeler arası parmakla kaydırma */
let tabSwipe = null;

detailBody.addEventListener('touchstart', event => {

    tabSwipe = event.touches.length === 1 ? {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    } : null;

}, { passive: true });

detailBody.addEventListener('touchmove', event => {

    if (!tabSwipe)
        return;

    const dx = event.touches[0].clientX - tabSwipe.x;
    const dy = event.touches[0].clientY - tabSwipe.y;

    if (tabSwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        tabSwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (tabSwipe.horizontal)
            detailTrack.classList.add('dragging');
    }

    if (!tabSwipe.horizontal)
        return;

    const index = DETAIL_TABS.indexOf(detailTab);
    const atEdge = (index === 0 && dx > 0) || (index === DETAIL_TABS.length - 1 && dx < 0);

    tabSwipe.dx = dx;
    placeDetailTrack(atEdge ? dx * 0.25 : dx);

}, { passive: true });

function endTabSwipe() {

    if (!tabSwipe)
        return;

    const swipe = tabSwipe;

    tabSwipe = null;
    detailTrack.classList.remove('dragging');

    if (!swipe.horizontal)
        return;

    const width = detailBody.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = DETAIL_TABS.indexOf(detailTab) + (swipe.dx < 0 ? 1 : -1);

    if (enough && next >= 0 && next < DETAIL_TABS.length)
        setDetailTab(DETAIL_TABS[next], true);
    else
        placeDetailTrack(0);
}

detailBody.addEventListener('touchend', endTabSwipe, { passive: true });
detailBody.addEventListener('touchcancel', endTabSwipe, { passive: true });

/*
 * Sekmelerin olduğu bölüm elle çekilmez; her açılışta skorun hemen
 * altındaki en yüksek noktanın biraz aşağısında sabit durur.
 */
let detailLift = 0;

function maxDetailLift() {
    const board = scoreBoard.getBoundingClientRect();
    const score = document.getElementById('sbScore').getBoundingClientRect();
    return Math.max(0, board.bottom - (score.bottom + 10));
}

function applyDetailLift() {
    detailLift = Math.round(maxDetailLift() * 0.85);
    detailPanel.style.setProperty('--lift', detailLift + 'px');
}

detailSheet.addEventListener('dragstart', event => event.preventDefault());

window.addEventListener('resize', () => {
    if (detailSheet.classList.contains('open'))
        applyDetailLift();
});

document.addEventListener('keydown', event => {
    if (detailId && event.key === 'Escape')
        closeDetail();
});

/* Paylaşılan bağlantıyla açılış: #mac=... */
(function openLinkedMatch() {

    if (!location.hash.startsWith(LINK_PREFIX))
        return;

    const id = decodeURIComponent(location.hash.slice(LINK_PREFIX.length));

    try {
        history.replaceState(null, '', location.href.split('#')[0]);
    } catch (error) {}

    /* Maç sayfası hemen açılır; veri gelince dolar */
    openDetail(id);
})();

/* Uygulama açıkken gösterilen bildirime basılınca maç açılır (firebase-messaging-sw.js gönderir) */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', event => {
        const id = event.data && event.data.mac ? String(event.data.mac) : null;
        if (id && !(detailId === id && detailSheet.classList.contains('open')))
            openDetail(id);
    });
}

/* Reklamı ana sayfanın üst resminin üzerine koy */
document.getElementById('homeBanner').appendChild(
    document.getElementById('adTemplate').content.cloneNode(true));

/* İçerik sayfasının (ve analiz içeriğinin) en üstündeki ince reklam */
document.getElementById('detailAd').appendChild(
    document.getElementById('adThinTemplate').content.cloneNode(true));

</script>
