<style>

* {
    box-sizing: border-box;

    /* Dokunulan yerde telefonun mavi vurgusu çıkmasın */
    -webkit-tap-highlight-color: transparent;
}

/*
 * İÇERİK GENİŞLİĞİ
 * Ana sayfadaki kartlar ve maç sayfası aynı genişliği kullanır.
 */
:root {
    --content-width: 640px;
    --side-gap: max(16px, calc((100% - var(--content-width)) / 2));
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* -----------------------------
   ANA SAYFA
----------------------------- */

#homePage {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;
}

#homeMain {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;

    /*
     * Kaydırma çubuğunun yeri hep ayrılır: içerik kısa ya da uzun
     * olsun genişlik değişmez, üstteki alan büyüyüp küçülmez.
     */
    scrollbar-gutter: stable;

    /* Yukarı aşağı kaydırma tarayıcıda, sağa sola kaydırma bizde. */
    touch-action: pan-y;

    /* Alttaki boşluk: son kart alttaki düğmenin arkasında kalmasın. */
    padding: 12px var(--side-gap) 180px;
}

/*
 * ÜSTTEKİ BAŞLIK ALANI
 * İnşaat uygulamasındaki resmin yerinde; resim yerine kodla
 * çizilmiş bir saha (hiçbir şey indirilmez).
 */
#homeBanner,
.banner {
    position: relative;
    aspect-ratio: 3.4 / 1;
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    color: white;
    background:
        radial-gradient(circle at 50% 50%, transparent 17%, rgba(255,255,255,.35) 17.4%, transparent 18%),
        linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,.35) 49.8%, rgba(255,255,255,.35) 50.2%, transparent 50.2%),
        repeating-linear-gradient(90deg, #2f7d43 0 10%, #2a7340 10% 20%);
}

/* Koyu perde: yazı okunsun */
#homeBanner::after,
.banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 30, 20, .05), rgba(10, 30, 20, .55));
}

.banner-text {
    position: absolute;
    left: 1em;
    bottom: .9em;
    z-index: 1;
}

.banner-title {
    font-size: 1.7em;
    font-weight: 800;
    letter-spacing: -.01em;
}

.banner-sub {
    margin-top: .15em;
    font-size: .9em;
    font-weight: 600;
    opacity: .9;
}

#homeTitleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

/*
 * ÜST DÜĞMELER: Canlı Skor / Forum / Analiz / Oranlar
 * Satırın genişliğine yayılırlar; yazı boyutu ekranla orantılı.
 */
#homeModeBox {
    display: flex;
    flex: 1;
    gap: .35em;
    min-width: 0;
    margin-right: .35em;
    font-size: min(16px, 3.4vw);
}

#homeModeBox button {
    flex: 1 1 auto;
    min-width: 0;
    padding: .55em .3em;
    border: 1px solid #d5d8de;
    border-radius: 10px;
    background: white;
    font-size: inherit;
    font-weight: 800;
    color: #444;
    white-space: nowrap;
}

#homeModeBox button.active {
    border-color: #1a73e8;
    background: #eef4ff;
    color: #1a73e8;
}

/*
 * GÜN SEÇİMİ (sadece Canlı Skor sayfasında)
 * Sekmelerin altında yana kaydırılan gün düğmeleri.
 */
#dayRow {
    display: flex;
    align-items: center;
    gap: .5em;
    margin: 0 0 8px;
}

#dayBox {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    gap: .4em;
    overflow-x: auto;
    scrollbar-width: none;
    font-size: 11px;
}

#dayBox::-webkit-scrollbar {
    display: none;
}

/* İki satır: üstte gün (Cmt), altta tarih (17.10) */
#dayBox button {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    min-width: 3.6em;
    padding: .3em .6em;
    border: 1px solid #d5d8de;
    border-radius: .9em;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

#dayBox button.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/* "Canlı" ya da arama açıkken gün seçimi kullanılmaz: soluk görünür */
#liveTools.no-day #dayBox {
    opacity: .45;
}

/* Gün düğmelerinin iki yanındaki oklar: önceki / sonraki gün */
.day-arrow {
    flex: none;
    width: 1em;
    height: 1.4em;
    padding: 0;
    background: none;
    color: #1d2340;
    font-size: 22px;
    line-height: 1;
}

.day-arrow:disabled {
    opacity: .25;
}

/* Sağdaki takvim düğmesi */
#calendarBtn {
    position: relative;
    flex: none;
    width: 2.6em;
    height: 2.6em;
    padding: 0;
    border: 1px solid #d5d8de;
    border-radius: 50%;
    background: white;
    color: #1d2340;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
}

#calendarBtn svg {
    width: 1.35em;
    height: 1.35em;
}

/*
 * TAKVİM (kendi çizdiğimiz; tarayıcının "Temizle / Bugün" düğmeleri yok)
 * Düğmenin altında, sola doğru açılır.
 */
#calendarWrap {
    position: relative;
    flex: none;
}

#calendarPop {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + .45em);
    z-index: 8;
    width: 17.5em;
    padding: .7em .6em .6em;
    background: white;
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(0,0,0,.22);
    font-size: 13px;
}

#calendarPop.open {
    display: block;
}

#calHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .5em;
}

#calHead span {
    font-weight: 800;
    color: #1d2340;
}

#calHead button {
    width: 2em;
    height: 2em;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #f1f3f7;
    font-size: 1.2em;
    font-weight: 700;
    line-height: 1;
    color: #1d2340;
}

#calWeek,
#calDays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

#calWeek span {
    padding: .2em 0 .4em;
    font-size: .8em;
    font-weight: 700;
    color: #9aa0ab;
}

#calDays button {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    font-size: inherit;
    font-weight: 600;
    color: #1d2340;
}

#calDays button.today {
    color: #1a73e8;
    font-weight: 800;
}

#calDays button.selected {
    background: #1d2340;
    color: white;
}

/* İkinci satır: Canlı | Ligler | Arama */
.tool-row {
    display: flex;
    align-items: center;
    gap: .3em;
    margin: 0 0 10px;

    /* Dar ekranda yazılar biraz küçülür, dört öğe tek satıra sığar */
    font-size: min(12.5px, 3.3vw);
}

.tb-live,
.tb-league,
.tb-time,
.tb-popular {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .4em;
    height: 2.5em;
    padding: 0 .75em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

/* Canlı düğmesindeki kırmızı nokta */
.tb-live::before {
    content: '';
    width: .5em;
    height: .5em;
    border-radius: 50%;
    background: #d93025;
}

.tb-time.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

.tb-live.active {
    border-color: #d93025;
    background: #d93025;
    color: white;
}

.tb-live.active::before {
    background: white;
    animation: blink 1.2s ease-in-out infinite;
}

.tb-league.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/* Canlı ve Ligler, Zaman düğmesinden kalan yeri alıp biraz geniştir */
.tb-live,
.tb-league {
    padding: 0 1.25em;
}

.tb-league .caret {
    font-size: .85em;
}

/* Zaman: uzun aşağı ok */
.tb-time .time-arrow {
    width: .5em;
    height: 1.05em;
    margin-left: .2em;
}

/* Ligler menüsü: işaret kutulu liste */
.league-filter {
    position: relative;
    flex: none;
}

.league-menu {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + .35em);
    z-index: 6;
    min-width: 13em;
    padding: .3em 0;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.22);
}

.league-menu.open {
    display: block;
}

.league-menu label {
    display: flex;
    align-items: center;
    gap: .6em;
    padding: .65em .9em;
    font-size: 14px;
    font-weight: 600;
    color: #1d2340;
    white-space: nowrap;
    cursor: pointer;
}

.league-menu label + label {
    border-top: 1px solid #f0f1f4;
}

.league-menu input {
    width: 1.1em;
    height: 1.1em;
    margin: 0;
    accent-color: #1d2340;
}

.league-menu small {
    margin-left: auto;
    font-weight: 600;
    color: #8a8f9c;
}

/* Forum ve Oranlar araması: araç satırının altında, tam genişlik */
#forumSearchBox,
#oddsSearchBox {
    margin: 0 0 10px;
}

/* Forum'da "Popüler" düğmesi (Zaman gibi) */
.tb-popular.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/*
 * Canlı Skor arama kutusu: satırın kalanını doldurur ama bir sınırı var
 * (geniş ekranda çok uzamasın); sağa yaslı durur.
 */
.search-box.tool-search {
    flex: 1 1 6em;
    max-width: 11em;
    margin-left: auto;
    gap: .25em;
    padding: 0 .55em;
}

/* Dar ekranda büyüteç gizlenir; "Arama yap" yazısı sığsın */
@media (max-width: 380px) {
    .search-box.tool-search svg {
        display: none;
    }

    .search-box.tool-search {
        padding: 0 .4em;
    }

    .tool-row {
        gap: .25em;
    }
}

/*
 * Canlı Skor satırındaki arama: büyüteç ve yazı kutunun ortasında.
 * Kutu yazı kadar geniştir; yazdıkça büyür (en fazla kutu kadar).
 */
.search-box.tool-search {
    justify-content: center;
}

/* Büyüteç yer kaplamış sayılmaz: "Arama yap" yazısı kutunun ortasına yakın durur */
.search-box.tool-search svg {
    margin-left: -1em;
}

.search-box.tool-search input {
    flex: 0 1 auto;
    width: auto;
    font-size: 1em;
    field-sizing: content;
}

.search-box {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: .35em;
    height: 2.5em;
    padding: 0 .7em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    color: #8a8f9c;
}

.search-box:focus-within {
    border-color: #1a73e8;
}

.search-box svg {
    flex: none;
    width: 1.2em;
    height: 1.2em;
}

.search-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: none;
    font-family: inherit;
    font-size: 13px;
    color: #1d2340;
}

/* Arama ve canlı listesinde satırın üstündeki tarih */
/* Satırın sağındaki zil */
.score-bell {
    /*
     * Dokunma alanı sola doğru geniştir (takım adının ucuna biner);
     * zil simgesi yine sağdaki yerinde ve aynı boyda durur.
     */
    position: relative;
    z-index: 1;
    width: 2.65em;
    height: 2.2em;
    margin: -.35em 0 -.35em -.25em;
    padding: 0 .32em 0 0;
    border-radius: 0;
    background: none;
    color: #9aa0ab;
    display: flex;
    align-items: center;
    justify-content: flex-end;
}

.score-bell svg {
    width: 1.25em;
    height: 1.25em;
}

/* Kayıtlı: sarı, içi dolu */
.score-bell.on {
    color: #f5b301;
}

.score-bell.on svg path:nth-child(2) {
    fill: currentColor;
}

.score-date {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: .2em;
    margin-bottom: -.3em;
    font-size: 11px;
    font-weight: 700;
    color: #8a8f9c;
    white-space: pre;
}

.score-date b {
    font-weight: 800;
    color: #1d2340;
}

/* Canlı maç olan günün düğmesinde küçük kırmızı nokta */
#dayBox button .day-date {
    font-weight: 600;
}


/*
 * CANLI SKOR LİSTESİ (tek satırlık maçlar, lig lig)
 */
.league-block {
    /* Gün ve araç satırlarından biraz daha geniş: iki yana taşar */
    margin: 0 max(-1.25vw, -.375em) .9em;
    background: white;
    border-radius: 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,.10);
    overflow: hidden;
}

.league-head {
    display: flex;
    align-items: center;
    gap: .5em;
    padding: .6em .9em;
    background: #1d2340;
    font-size: 13px;
    font-weight: 800;
    color: white;
}

.league-head span {
    font-weight: 600;
    color: #c3c8d6;
}

/* Ülke bayrağı (kodla çizilmiş) */
.flag {
    flex: none;
    width: 1.5em;
    height: 1em;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.25);
}

/* Tek satır: durum | ev sahibi | skor | deplasman */
.score-row {
    display: grid;
    /* durum | ev sahibi | skor | deplasman | zil
       İki uç sütun eşit: skor satırın tam ortasında durur */
    grid-template-columns: 2.4em 1fr auto 1fr 2.4em;
    align-items: center;

    /* Dar ekranda aralar biraz daralır, takım adları sığsın */
    gap: min(.45em, 1.6vw);
    cursor: pointer;
    width: 100%;
    padding: .45em min(.7em, 2.4vw);
    border-radius: 0;
    background: white;
    border-bottom: 1px solid #f1f2f5;
    text-align: left;
    font-size: 14px;
    font-weight: 400;
    color: #1d2340;
}

.score-row:last-child {
    border-bottom: 0;
}

.score-row:active {
    background: #f4f6fa;
}

.score-row:focus {
    outline: none;
}

/*
 * ZİL ANİMASYONU (0,7 saniye)
 * Zil sallanır ve aynı anda renk zilden sola doğru satırı süpürür.
 * Kaydedince yeşil, çıkarınca kırmızı.
 */
.score-row {
    position: relative;
    isolation: isolate;
}

/* 1: Zil sallanır (kaydedince), küçülüp büyür ve kırmızı yanar (çıkarınca) */
.score-row.a1-add .score-bell svg {
    transform-origin: 50% 15%;
    animation: bellRing .7s ease;
}

.score-row.a1-remove .score-bell svg {
    animation: bellDrop .7s ease;
}

@keyframes bellRing {
    0%   { transform: scale(1) rotate(0); color: #22c55e; }
    15%  { transform: scale(1.35) rotate(-20deg); }
    30%  { transform: scale(1.3) rotate(16deg); }
    45%  { transform: scale(1.2) rotate(-11deg); }
    60%  { transform: scale(1.1) rotate(7deg); }
    78%  { transform: scale(1.05) rotate(-3deg); }
    100% { transform: scale(1) rotate(0); }
}

@keyframes bellDrop {
    0%   { transform: scale(1); color: #ef4444; }
    30%  { transform: scale(.65); color: #ef4444; }
    60%  { transform: scale(1.15); color: #ef4444; }
    100% { transform: scale(1); }
}

/* 3: Renk zilden sola doğru satırı süpürür, sonra söner */
.score-row.a3-add::before,
.score-row.a3-remove::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    transform-origin: right center;
    pointer-events: none;
    animation: sweep .7s ease-out forwards;
}

.score-row.a3-add::before    { background: rgba(34, 197, 94, .35); }
.score-row.a3-remove::before { background: rgba(239, 68, 68, .32); }

@keyframes sweep {
    0%   { transform: scaleX(0); opacity: 1; }
    45%  { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
}

/* Kayıtlı Maçlarım: Lige göre | Zamana göre ... Temizle */
#savedClear {
    flex: none;
    margin-left: auto;
    height: 2.5em;
    padding: 0 1em;
    border: 1px solid #f3c4c0;
    border-radius: 999px;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #d93025;
}

#savedClear:disabled {
    border-color: #e5e7eb;
    color: #b8bcc6;
}

/* Uyarı penceresi: ekranın ortasında, arkası karartılmış */
#confirmBox {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: flex;

#confirmActions button {

}

.league-bell.on {

}

.league-bell.on svg path:nth-child(2) {

.score-status {
    font-size: 12px;
    font-weight: 800;
    color: #6b7080;
}

.score-status.live {

}

.score-team {

    gap: .4em;

.score-team.home {

/* Menü düğmesi: simge üstteki alanın sağ kenarıyla aynı hizada */
#menuBtn {
    flex: none;
    width: 32px;
    height: 40px;
    padding: 0;
    background: none;
    color: #333;

    text-align: right;
}

/* SAĞ ÜST MENÜ */
#homeMenu {
    position: absolute;
    right: var(--side-gap);
    z-index: 5;
    display: none;
    flex-direction: column;
    min-width: 210px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);

}

#homeMenu.open {

}

#homeMenu button {

    background: none;
    border-radius: 0;
    padding: 14px 16px;
    text-align: left;
    font-size: 15px;

    color: #222;
    border-bottom: 1px solid #eee;
}

#homeMenu button:last-child {

}

#homeMenu #menuClose {
    background: #d93025;
    color: white;
    font-weight: bold;
    text-align: center;
}

/*
 * ANA SAYFANIN DÖRT SAYFASI
 * Yan yana dururlar; şerit sağa sola kayarak seçili olanı gösterir.
 * Parmakla çekilirken yandaki sayfa da görünür.
 */
#homePager {
    overflow-x: clip;

    /*
     * Kırpma alanı iki yana biraz taşar (içerik aynı yerde kalır);
     * böylece Canlı Skor'daki geniş lig kutuları kesilmez.
     */
    margin: 0 max(-2.5vw, -.75em);
    padding: 0 min(2.5vw, .75em);
}

#homeTrack {
    --page-gap: 3em;

    display: flex;
    align-items: flex-start;
    gap: var(--page-gap);
    width: calc(400% + 3 * var(--page-gap));
    transform: translateX(calc(
        var(--page, 0) * (-100% / 4 - var(--page-gap) / 4) + var(--swipe-x, 0px)
    ));
    transition: transform .28s ease;
}

#homeMain.swiping #homeTrack {
    transition: none;
}

.home-page {
    flex: none;
    width: calc((100% - 3 * var(--page-gap)) / 4);
    min-width: 0;
}

/* Geçiş yokken görünmeyen sayfalar yer kaplamaz. */
#homeTrack:not(.both) .home-page:not(.current) {
    height: 0;
    overflow: hidden;
    visibility: hidden;
}

/* Hafta başlığı ("7. Hafta") */
.week-title {
    margin: 14px 4px 8px;
    font-size: 13px;
    font-weight: 800;
    color: #6b7080;
    letter-spacing: .02em;
}

.week-title:first-child {
    margin-top: 4px;
}

.home-empty {
    margin: 30px 10px;
    text-align: center;
    font-size: 15px;
    color: #777;
}

/* -----------------------------
   MAÇ KARTI
   Üstte hafta ve saat, ortada iki takım ve skor,
   altta ayraçla ayrılmış yorum / beğeni / beğenmeme.
----------------------------- */

.match-card {
    display: block;
    width: 100%;
    padding: .75em .9em .7em;
    margin-bottom: .75em;
    background: white;
    border-radius: 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,.10);
    text-align: left;
    font-size: 14px;
    font-weight: normal;
    color: #222;
}

.match-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .45em;
    font-size: .857em;
    font-weight: 600;
    color: #6b7080;
}

/* Maçın durumu: CANLI 63' / MS / saat */
.match-status {
    display: inline-flex;
    align-items: center;
    gap: .35em;
    font-weight: 800;
}

.match-status.live {
    color: #d93025;
}

.match-status.live::before {
    content: '';
    width: .55em;
    height: .55em;
    border-radius: 50%;
    background: #d93025;
    animation: blink 1.2s ease-in-out infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

.match-status.done {
    color: #444;
}

.match-status.upcoming {
    color: #1a73e8;
}

.team-row {
    display: flex;
    align-items: center;
    gap: .6em;
    padding: .2em 0;
}

.team-name {
    flex: 1;
    min-width: 0;
    font-size: 1.07em;
    font-weight: 700;
    color: #1d2340;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

/* Kaybeden takım biraz soluk */
.team-row.lost .team-name,
.team-row.lost .team-score {
    color: #8a8f9c;
    font-weight: 600;
}

.team-score {
    flex: none;
    min-width: 1.4em;
    text-align: right;
    font-size: 1.2em;
    font-weight: 800;
    color: #1d2340;
}

/*
 * Takım arması yerine: takım renklerinde yuvarlak ve kısa adı.
 * (Gerçek armalar kullanılmaz.)
 */
.crest {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.7em;
    height: 2.7em;
    border-radius: 50%;
    font-size: .56em;
    font-weight: 800;
    letter-spacing: -.02em;

    /* İnce çerçeve: beyaz formalı takımlar da beyaz kartta görünsün */
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
}

/* Alttaki satır: yorum, beğeni, beğenmeme (üstünde ince ayraç) */
.match-stats {
    display: flex;
    align-items: center;
    gap: 1.1em;
    margin-top: .5em;
    padding-top: calc(.5em + 1px);
    border-top: 1px solid #e6e8ee;
    font-size: .857em;
    font-weight: 600;
    color: #555a66;
    white-space: nowrap;
}

.stat {
    display: inline-flex;
    align-items: center;
    gap: .35em;
}

.stat svg {
    width: 1.15em;
    height: 1.15em;
}

.stat.comment {
    position: relative;
    padding-right: calc(1.5em + 1px);
    margin-right: calc(.4em + 1px);
}

.stat.comment svg {
    width: 1.25em;
    height: 1.25em;
}

/* Yorum ile beğeni arasındaki dik ayraç */
.stat.comment::after {
    content: '';
    position: absolute;
    right: 0;
    top: 15%;
    height: 70%;
    border-right: 1px solid #d9dce4;
}

.stat.like {
    margin-right: calc(.25em + 3px);
}

.stat.like svg,
.stat.dislike svg {
    width: 1.4em;
    height: 1.4em;
}

.stat.like svg    { color: #16a34a; }
.stat.dislike svg { color: #dc2626; }

/* Oranlar sayfasındaki 1 / X / 2 kutuları */
.odds-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .5em;
    margin-top: .55em;
}

.odd {
    padding: .45em 0;
    border-radius: 10px;
    background: #f1f3f7;
    text-align: center;
}

.odd span {
    display: block;
    font-size: .78em;
    font-weight: 600;
    color: #6b7080;
}

.odd b {
    font-size: 1.05em;
    color: #1d2340;
}

/* -----------------------------
   BOŞ SAYFA
   Mavi top ile alttan açılır (inşaat uygulamasındaki
   haritanın yeri; şimdilik boş).
----------------------------- */

#emptyLayer {
    position: fixed;
    inset: 0;
    z-index: 18;

    /*
     * Açılırken ve kapanırken resmin üstü şeffaftır; kayan pencere
     * resmin kendisiyle başlıyormuş gibi görünür. Resmin iki yanı ve
     * altı gridir. Pencere yerine oturunca (.settled) her yer gri olur.
     * --clear-top : resmin alt kenarına kadar olan yükseklik
     * --side      : resmin iki yanındaki boşluk
     */
    background:
        linear-gradient(#f4f5f7, #f4f5f7) 0 var(--clear-top, 0px) / 100% 100% no-repeat,
        linear-gradient(#f4f5f7, #f4f5f7) 0 0 / var(--side, 0px) var(--clear-top, 0px) no-repeat,
        linear-gradient(#f4f5f7, #f4f5f7) 100% 0 / var(--side, 0px) var(--clear-top, 0px) no-repeat;
    display: flex;
    flex-direction: column;

    transform: translateY(100%);
    visibility: hidden;
    transition: transform .32s ease, visibility 0s linear .32s;
}

#myMain {
    flex: 1;
    overflow-y: auto;
    scrollbar-gutter: stable;
    padding: 12px var(--side-gap) 180px;
}

/* Kayıtlı Maçlarım / Kuponlarım düğmeleri (ana sayfadaki sekmeler gibi) */
#myTabs {
    display: flex;
    gap: .35em;
    margin-bottom: 10px;
    font-size: min(16px, 3.4vw);
}

#myTabs button {
    flex: 1;
    padding: .55em .3em;
    border: 1px solid #d5d8de;
    border-radius: 10px;
    background: white;
    font-size: inherit;
    font-weight: 800;
    color: #444;
}

#myTabs button.active {
    border-color: #1a73e8;
    background: #eef4ff;
    color: #1a73e8;
}

/* Kayıtlı Maçlarım | Kuponlarım: yan yana iki sayfa, kayarak geçilir */
#myPager {
    overflow-x: clip;
    margin: 0 max(-2.5vw, -.75em);
    padding: 0 min(2.5vw, .75em);
}

#myTrack {
    --page-gap: 3em;

    display: flex;
    align-items: flex-start;
    gap: var(--page-gap);
    width: calc(200% + var(--page-gap));
    transform: translateX(calc(
        var(--page, 0) * (-50% - var(--page-gap) / 2) + var(--swipe-x, 0px)
    ));
    transition: transform .28s ease;
}

#myMain.swiping #myTrack {
    transition: none;
}

.my-page {
    flex: none;
    width: calc((100% - var(--page-gap)) / 2);
    min-width: 0;
}

#myTrack:not(.both) .my-page:not(.current) {
    height: 0;
    overflow: hidden;
    visibility: hidden;
}

#mySaved .league-block {
    margin-left: max(-2.5vw, -.75em);
    margin-right: max(-2.5vw, -.75em);
}

#emptyLayer.settled {
    background: #f4f5f7;
}

body[data-tab="empty"] #emptyLayer {
    transform: translateY(0);
    visibility: visible;
    transition: transform .32s ease, visibility 0s;
}

/*
 * Pencere açılır / kapanırken kayan pencerenin içindeki resim gizlenir;
 * yerine aynı resim ekranda, son duracağı yerde sabit durur.
 */
/* Maç sayfası açıkken sarı topla açılan Kuponlarım, maç sayfasının üstüne gelir */
#emptyLayer.raised {
    z-index: 31;
}

#emptyLayer.raised + #bannerGhost,
#bannerGhost.raised {
    z-index: 31;
}

#emptyLayer.ghosted .banner {
    visibility: hidden;
}

#bannerGhost {
    position: fixed;
    z-index: 18;
    margin: 0;
    pointer-events: none;
}

/* -----------------------------
   ALT DÜĞME (mavi top)
----------------------------- */

.alt-menu {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 19;
}

.ac-kapa {
    flex: none;
    width: 72px;
    height: 72px;
    padding: 0;
    border: 5px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #3d8dff 0%, #1f6ff2 100%);
    box-shadow: 0 10px 24px rgba(37, 117, 252, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, box-shadow .2s ease;
}

.ac-kapa:active { transform: scale(.94); }

.ac-kapa svg {
    width: 26px;
    height: 26px;
    transition: transform .3s ease;
}

/*
 * KUPON TOPU (koyu sarı)
 * Oranlardan seçim yapılınca mavi topun hizasında, sağda belirir.
 * Basınca Kuponlarım açılır; top yerinde kalır.
 * Kupon kaydedilince (seçimler temizlenince) kaybolur.
 */
#couponBall {
    position: fixed;
    right: var(--side-gap);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));

    /* Maç sayfasının da üstünde durur (oranlar orada da seçilebilir) */
    z-index: 32;
    width: 72px;
    height: 72px;
    padding: 0;
    border: 5px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #f7c428 0%, #e8aa10 100%);

    /* Renksiz hafif gölge: beyaz çember beyaz kartların üstünde de görünsün */
    box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;

    opacity: 0;
    visibility: hidden;
    transform: scale(.6);
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
}

#couponBall.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition: opacity .2s ease, transform .2s ease, visibility 0s;
}

#couponBall:active {
    transform: scale(.94);
}

#couponBall .cb-count {
    font-size: 12px;
    font-weight: 700;
}

#couponBall .cb-total {
    font-size: 14px;
    font-weight: 800;
}

/* Sabit tohumlu rastgele sayı üreticisi (her açılışta aynı veri) */
function seededRandom(seed) {
    return function () {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const rand = seededRandom(20262027);

function randInt(min, max) {
    return min + Math.floor(rand() * (max - min + 1));
}

/* Ortalaması lambda olan rastgele gol sayısı */
function poisson(lambda) {
    const limit = Math.exp(-lambda);
    let k = 0;
    let p = 1;

    do {
        k++;
        p *= rand();
    } while (p > limit);

    return k - 1;
}

/* Kazanma / beraberlik / kaybetme olasılığından basit oranlar */
function makeOdds(home, away) {

    const diff = (home.power + 4 - away.power) / 25;

    let pHome = 0.45 + diff * 0.5;
    let pAway = 0.30 - diff * 0.45;

    pHome = Math.min(0.85, Math.max(0.08, pHome));
    pAway = Math.min(0.80, Math.max(0.06, pAway));

    let pDraw = Math.max(0.12, 1 - pHome - pAway);

    const sum = pHome + pDraw + pAway;
    const margin = 1.07;

    const odd = p => Math.max(1.05, (1 / (p / sum * margin))).toFixed(2);

    const over = 0.5 + (home.power + away.power - 150) / 120;

    return {
        home: odd(pHome),
        draw: odd(pDraw),
        away: odd(pAway),
        over: odd(Math.min(0.8, Math.max(0.3, over))),
        under: odd(Math.min(0.7, Math.max(0.2, 1 - over)))
    };
}

/* Bir maçın olayları: goller (dakikalarıyla) ve sarı / kırmızı kartlar */
function makeEvents(homeGoals, awayGoals, maxMinute) {

    const events = [];

    const add = (side, type, count) => {
        for (let i = 0; i < count; i++)
            events.push({ side: side, type: type, minute: randInt(2, maxMinute) });
    };

    add('home', 'goal', homeGoals);
    add('away', 'goal', awayGoals);
    add('home', 'yellow', randInt(0, 3));
    add('away', 'yellow', randInt(0, 3));

    if (rand() < 0.08)
        add(rand() < 0.5 ? 'home' : 'away', 'red', 1);

    return events.sort((a, b) => a.minute - b.minute);
}

/* Maç istatistikleri (gollerle uyumlu) */
function makeStats(home, away, homeGoals, awayGoals, ratio) {

    const possession = Math.round(
        Math.min(72, Math.max(28, 50 + (home.power - away.power) * 0.8 + randInt(-6, 6)))
    );

    const side = (goals, strength) => {
        const shots = Math.round((randInt(6, 12) + strength / 12) * ratio);
        const onTarget = Math.max(goals, Math.round(shots * (0.3 + rand() * 0.2)));
        return {
            shots: Math.max(shots, onTarget),
            onTarget: onTarget,
            corners: Math.round(randInt(2, 8) * ratio),
            fouls: Math.round(randInt(7, 14) * ratio)
        };
    };

    return {
        possession: [possession, 100 - possession],
        home: side(homeGoals, home.power),
        away: side(awayGoals, away.power)
    };
}

/* Fikstür: "daire yöntemi" ile her hafta herkes bir maç yapar. */
function makeMatches(league) {

    const TEAMS = league.teams;
    const ids = TEAMS.map((team, index) => index);
    const matches = [];

    for (let week = 1; week <= LAST_WEEK; week++) {

        for (let i = 0; i < ids.length / 2; i++) {

            let a = ids[i];
            let b = ids[ids.length - 1 - i];

            /* Ev sahipliği haftadan haftaya değişsin */
            if ((week + i) % 2 === 0)
                [a, b] = [b, a];

            const home = TEAMS[a];
            const away = TEAMS[b];

            const [dayOffset, time] = league.kickoffs[i];
            const date = new Date(league.weekDates[week - 1] + 'T' + time + ':00+03:00');
            date.setDate(date.getDate() + dayOffset);

            const match = {
                id: league.id + '-' + week + '-' + (i + 1),
                league: league,
                week: week,
                date: date,
                home: home,
                away: away,
                odds: makeOdds(home, away),
                comments: randInt(1, 40),
                likes: randInt(1, 60),
                dislikes: randInt(0, 25)
            };

            const liveMinute = week === CURRENT_WEEK ? league.live[i] : undefined;
            const doneToday = week === CURRENT_WEEK && league.todayDone.includes(i);
            const laterToday = week === CURRENT_WEEK && league.todayLater.includes(i);

            /* Bugün biraz sonra başlayacak (gün bitmeden) */
            if (laterToday) {
                const start = new Date(Date.now() + 45 * 60000);
                start.setMinutes(Math.ceil(start.getMinutes() / 5) * 5, 0, 0);
                const endOfDay = new Date();
                endOfDay.setHours(23, 55, 0, 0);
                match.date = start > endOfDay ? endOfDay : start;
            }

            if (week <= PLAYED_WEEKS || liveMinute || doneToday) {

                const minute = liveMinute || 90;
                const ratio = minute / 90;

                const homeGoals = poisson((1.35 + (home.power - away.power) / 30) * ratio);
                const awayGoals = poisson((1.05 + (away.power - home.power) / 30) * ratio);

                match.status = liveMinute ? 'live' : 'done';

                /* Canlı maç "şu an" oynanıyor: başlama saati dakikası kadar önce */
                if (liveMinute) {
                    match.date = new Date(Date.now() - (liveMinute + 15) * 60000);
                    match.date.setSeconds(0, 0);
                }

                /* Bugün erken oynanmış: yaklaşık 3 saat önce başlamış */
                if (doneToday) {
                    match.date = new Date(Date.now() - 3 * 3600000);
                    match.date.setMinutes(Math.floor(match.date.getMinutes() / 15) * 15, 0, 0);

                    if (dayKey(match.date) !== dayKey(new Date())) {
                        match.date = new Date();
                        match.date.setHours(0, 30, 0, 0);
                    }
                }
                match.minute = minute;
                match.score = [homeGoals, awayGoals];
                match.events = makeEvents(homeGoals, awayGoals, minute);
                match.stats = makeStats(home, away, homeGoals, awayGoals, ratio);

            } else {

                match.status = 'upcoming';
            }

            matches.push(match);
        }

        /* İlk takım sabit kalır, diğerleri bir sıra döner. */
        ids.splice(1, 0, ids.pop());
    }

    return matches;
}

const MATCHES = LEAGUES.flatMap(makeMatches);

const SAVED_KEY = 'canliSkorKayitli';

function loadSaved() {
    try {
        return new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'));
    } catch (error) {
        return new Set();
    }
}

const savedIds = loadSaved();

function isSaved(id) {
    return savedIds.has(id);
}

function toggleSaved(id) {

    if (savedIds.has(id))
        savedIds.delete(id);
    else
        savedIds.add(id);

    try {
        localStorage.setItem(SAVED_KEY, JSON.stringify(Array.from(savedIds)));
    } catch (error) {}

    /* Aynı maçın bütün zilleri yerinde güncellenir (liste baştan çizilmez) */
    document.querySelectorAll('.score-bell[data-id="' + id + '"]').forEach(bell => {
        bell.classList.toggle('on', savedIds.has(id));
    });

    refreshLeagueBells();

    /* Kayıtlı Maçlarım sayfası açıksa satır hemen kalksın; değilse yenilensin */
    if (document.body.dataset.tab !== 'empty' || savedIds.has(id))
        renderSaved();
    else
        renderSavedLater();

    return savedIds.has(id);
}

const ANIM_CLASSES = ['a1-add', 'a1-remove', 'a3-add', 'a3-remove'];

/* Satır animasyonu: zil sallanır + renk süpürür (kaydedince yeşil, çıkarınca kırmızı) */
function flashRow(row, added) {
    const kind = added ? '-add' : '-remove';
    row.classList.remove(...ANIM_CLASSES);
    row.getBoundingClientRect();
    row.classList.add('a1' + kind, 'a3' + kind);
    setTimeout(() => row.classList.remove(...ANIM_CLASSES), 750);
}

/* Lig satırındaki zil: listedeki maçların hepsi kayıtlıysa sarı */
function refreshLeagueBells() {
    document.querySelectorAll('.league-bell').forEach(bell => {
        const ids = bell.dataset.ids.split(',');
        bell.classList.toggle('on', ids.every(id => savedIds.has(id)));
    });
}

function leagueBell(block, list) {

    const bell = document.createElement('button');
    bell.className = 'league-bell';
    bell.dataset.ids = list.map(m => m.id).join(',');
    bell.setAttribute('aria-label', 'Bu ligin maçlarını kaydet');
    bell.innerHTML = ICONS.bell;
    bell.classList.toggle('on', list.every(m => savedIds.has(m.id)));

    /* Hepsi kayıtlıysa hepsi çıkar; değilse eksikler eklenir */
    bell.addEventListener('click', event => {

        event.stopPropagation();

        const add = !list.every(m => savedIds.has(m.id));

        list.forEach(m => {
            if (savedIds.has(m.id) !== add)
                toggleSaved(m.id);
        });

        block.querySelectorAll('.score-row').forEach(row => flashRow(row, add));
    });

    return bell;
}

/* Kayıtlı sayfasında zil kapatılınca satır animasyondan sonra kalkar */
let savedTimer = null;

function renderSavedLater() {
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderSaved, 250);
}

function matchCard(match, options = {}) {

    const card = document.createElement('button');
    card.className = 'match-card';

    /* Üst satır: hafta ve tarih solda, durum sağda */
    const head = document.createElement('div');
    head.className = 'match-head';

    const when = document.createElement('span');
    when.textContent = match.league.name + ' · ' + match.week + '. Hafta · ' + formatDate(match.date);

    const status = document.createElement('span');
    status.className = 'match-status ' + match.status;
    status.textContent = statusText(match);

    head.appendChild(when);
    head.appendChild(status);
    card.appendChild(head);

    /* İki takım ve skorları */
    [['home', 0], ['away', 1]].forEach(([side, index]) => {

        const row = document.createElement('div');
        row.className = 'team-row';

        if (match.score && match.status === 'done' &&
            match.score[index] < match.score[1 - index]) {
            row.classList.add('lost');
        }

        const name = document.createElement('span');
        name.className = 'team-name';
        name.textContent = match[side].name;

        const score = document.createElement('span');
        score.className = 'team-score';
        score.textContent = match.score ? match.score[index] : '';

        row.appendChild(crest(match[side]));
        row.appendChild(name);
        row.appendChild(score);
        card.appendChild(row);
    });

    /* Oranlar sayfasında 1 / X / 2 */
    if (options.odds)
        card.appendChild(oddsRow(match, ['1', 'X', '2'], ['home', 'draw', 'away'], true));

    /* Alt satır: yorum | beğeni, beğenmeme (şimdilik sahte, çalışmaz).
       Oranlar sayfasında yoktur. */
    if (options.odds) {
        card.addEventListener('click', () => openDetail(match.id, 'comments'));
        return card;
    }

    const stats = document.createElement('div');
    stats.className = 'match-stats';

    [
        ['comment', match.comments + ' yorum'],
        ['like', match.likes],
        ['dislike', match.dislikes]
    ].forEach(([kind, value]) => {
        const stat = document.createElement('span');
        stat.className = 'stat ' + kind;
        stat.innerHTML = ICONS[kind];
        stat.appendChild(document.createTextNode(String(value)));
        stats.appendChild(stat);
    });

    card.appendChild(stats);

    card.addEventListener('click', () => openDetail(match.id, 'comments'));

    return card;
}

function oddsRow(match, labels, keys, pickable) {

    const row = document.createElement('div');
    row.className = 'odds-row';

    labels.forEach((label, i) => {
        const box = document.createElement('div');
        box.className = 'odd';
        box.innerHTML = '<span></span><b></b>';
        box.querySelector('span').textContent = label;
        box.querySelector('b').textContent = match.odds[keys[i]];

        /* Oranlar sekmesinde: basınca kupona eklenir / çıkarılır */
        if (pickable) {
            box.classList.add('pickable');
            box.dataset.match = match.id;
            box.dataset.key = keys[i];
            box.classList.toggle('picked', couponPicks.get(match.id) === keys[i]);
            box.addEventListener('click', event => {
                event.stopPropagation();
                togglePick(match.id, keys[i]);
            });
        }

        row.appendChild(box);
    });

    if (labels.length === 2)
        row.style.gridTemplateColumns = 'repeat(2, 1fr)';

    return row;

/* Günün anahtarı: "2026-10-17" (telefonun saatine göre) */
function dayKey(date) {
    return date.getFullYear() + '-' +
        String(date.getMonth() + 1).padStart(2, '0') + '-' +
        String(date.getDate()).padStart(2, '0');
}

const TODAY = dayKey(new Date());

/* Düğmedeki yazı: Dün / Bugün / Yarın ya da "Cmt 17 Eki" */
function dayLabel(key) {

    const date = new Date(key + 'T12:00:00');
    const diff = Math.round((date - new Date(TODAY + 'T12:00:00')) / 86400000);

    if (diff === 0) return 'Bugün';
    if (diff === -1) return 'Dün';
    if (diff === 1) return 'Yarın';

    return formatDate(date);
}

    const box = document.getElementById('dayBox');
    box.textContent = '';

    const keys = new Set(MATCHES.map(m => dayKey(m.date)));
    keys.add(TODAY);

    /* Takvimden maçsız bir gün seçildiyse o da listede olsun */
    keys.add(selectedDay);

    Array.from(keys).sort().forEach(key => {

        const button = document.createElement('button');
        /* Üstte gün adı, altta gün.ay */
        const date = new Date(key + 'T12:00:00');

        const name = document.createElement('span');
        name.className = 'day-name';
        name.textContent = key === TODAY ? 'Bugün' : DAYS[date.getDay()];

        const dm = document.createElement('span');
        dm.className = 'day-date';
        dm.textContent = String(date.getDate()).padStart(2, '0') + '.' +
            String(date.getMonth() + 1).padStart(2, '0');

        button.appendChild(name);
        /* Bugünün düğmesinde yalnızca "Bugün" yazar, tarih yok */
        if (key !== TODAY) button.appendChild(dm);
        button.dataset.day = key;
        button.classList.toggle('active', key === selectedDay);

        button.addEventListener('click', () => selectDay(key));

        box.appendChild(button);
    });

    /* Oklar: ilk ve son günde pasif */
    const list = Array.from(keys).sort();
    const index = list.indexOf(selectedDay);

    document.getElementById('dayPrev').disabled = index <= 0;
    document.getElementById('dayNext').disabled = index >= list.length - 1;

    dayKeys = list;

    /* Seçili gün görünür olsun (ortada). */
    const active = box.querySelector('button.active');

    if (active)
        box.scrollLeft = active.offsetLeft - (box.clientWidth - active.offsetWidth) / 2;
}

/*
 * Bir gün seçilir: "Canlı" ve arama kapanır, liste o güne döner.
 * (Gün düğmeleri ve takvim kullanır.)
 */
function selectDay(key) {

    selectedDay = key;
    searchInput.value = '';

    /* Bugünden başka bir güne geçince "Canlı" kapanır */
    if (key !== TODAY)
        liveState.liveOnly = false;

    renderDays();
    renderLive();
}

/* Oklar: listede bir önceki / sonraki güne geçer */
['dayPrev', 'dayNext'].forEach((id, i) => {
    document.getElementById(id).addEventListener('click', () => {

        const next = dayKeys[dayKeys.indexOf(selectedDay) + (i === 0 ? -1 : 1)];

        if (next)
            selectDay(next);
    });
});

/* Tek satırlık maç: durum | ev sahibi | skor | deplasman */
function scoreRow(match, showDate, showLeague) {

    /* Satırın içinde zil düğmesi olduğu için satır <button> değil */
    const row = document.createElement('div');
    row.className = 'score-row';
    row.setAttribute('role', 'button');
    row.tabIndex = 0;

    /* Arama sonuçlarında maçın tarihi de yazar */
    if (showDate || showLeague) {
        const date = document.createElement('span');
        date.className = 'score-date';

        /* Zamana göre: lig adı koyu */
        if (showLeague) {
            date.innerHTML = '<b></b>';
            date.querySelector('b').textContent = match.league.name;
        }

        if (showDate) {
            date.appendChild(document.createTextNode(
                (showLeague ? ' · ' : '') + dayLabel(dayKey(match.date)) + ' · ' + match.week + '. Hafta'
            ));
        }

        row.appendChild(date);
    }

    const status = document.createElement('span');
    status.className = 'score-status' + (match.status === 'live' ? ' live' : '');
    status.textContent =
        match.status === 'live' ? match.minute + "'" :
        match.status === 'done' ? 'MS' : formatTime(match.date);

    const team = (side, index) => {

        const el = document.createElement('span');
        el.className = 'score-team ' + side;

        /* Önde / kazanan takım kalın; diğerleri ve oynanmamış maç normal */
        if (match.score && match.score[index] > match.score[1 - index])
            el.classList.add('won');

        /*
         * Tek satıra sığsın diye arma yok, sadece ad. Uzun adlar
         * şimdilik kısaltılır (mid); gerçek veride düzenlenecek.
         */
        const name = document.createElement('span');
        name.textContent = match[side].mid || match[side].name;
        el.appendChild(name);

        return el;
    };

    const mid = document.createElement('span');
    mid.className = 'score-mid' + (match.status === 'live' ? ' live' : '');
    mid.textContent = match.score ? match.score[0] + ' - ' + match.score[1] : '-';

    row.appendChild(status);
    row.appendChild(team('home', 0));
    row.appendChild(mid);
    row.appendChild(team('away', 1));

    /* Zil: maçı kaydeder / kayıttan çıkarır (sarı = kayıtlı) */
    const bell = document.createElement('button');
    bell.className = 'score-bell';
    bell.dataset.id = match.id;
    bell.setAttribute('aria-label', 'Maçı kaydet');
    bell.innerHTML = ICONS.bell;
    bell.classList.toggle('on', isSaved(match.id));

    bell.addEventListener('click', event => {

        event.stopPropagation();

        flashRow(row, toggleSaved(match.id));
    });

    row.appendChild(bell);

    row.addEventListener('click', () => openDetail(match.id));

    return row;
}

/*
 * ARAÇ SATIRI (Canlı Skor, Forum ve Oranlar'da aynı)
 * Her sayfanın kendi durumu vardır:
 *   popular  : (sadece Forum) en çok yorum alanlar
 *   liveOnly : "Canlı" açık; o an oynanan maçlar
 *   timeOrder: "Zaman" açık; ligler ayrılmadan saat sırasıyla
 *   leagues  : Ligler menüsünde işaretli ligler (boşsa hepsi)
 *   input    : arama kutusu (varsa); takım adına göre
 */
const TIME_ICON = '<svg class="time-arrow" viewBox="0 0 10 16" aria-hidden="true"><path d="M5 1.5v12M1.5 10l3.5 4 3.5-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>';

/* Açık olan Ligler menüsü (aynı anda tek menü açık olur) */
let openLeagueMenu = null;

function buildTools(row, state, options) {

    const tools = { state: state };

    const pill = (className, html, onClick) => {
        const button = document.createElement('button');
        button.className = className;
        button.innerHTML = html;
        button.addEventListener('click', onClick);
        row.appendChild(button);
        return button;
    };

    const changed = () => {
        tools.refresh();
        options.render();
    };

    if (options.popular) {
        tools.popularBtn = pill('tb-popular', 'Popüler', () => {
            state.popular = !state.popular;
            if (state.popular)
                state.timeOrder = false;
            changed();
        });
    }

    tools.liveBtn = pill('tb-live', 'Canlı', () => {
        state.liveOnly = !state.liveOnly;
        if (state.liveOnly && tools.input && options.liveClearsSearch)
            tools.input.value = '';
        changed();
    });

    /* Ligler: işaret kutulu menü */
    const filter = document.createElement('div');
    filter.className = 'league-filter';

    const leagueBtn = document.createElement('button');
    leagueBtn.className = 'tb-league';
    leagueBtn.innerHTML = 'Ligler <span class="caret">▾</span>';

    const menu = document.createElement('div');
    menu.className = 'league-menu';

    LEAGUES.forEach(league => {

        const label = document.createElement('label');
        const input = document.createElement('input');
        const name = document.createElement('span');
        const country = document.createElement('small');

        input.type = 'checkbox';
        name.textContent = league.name;
        country.textContent = league.country;

        input.addEventListener('change', () => {
            if (input.checked)
                state.leagues.add(league.id);
            else
                state.leagues.delete(league.id);
            changed();
        });

        label.appendChild(input);
        label.appendChild(name);
        label.appendChild(country);
        menu.appendChild(label);
    });

    leagueBtn.addEventListener('click', () => {

        if (openLeagueMenu === menu) {
            closeLeagueMenu();
            return;
        }

        hideLeagueMenu();
        menu.classList.add('open');
        openLeagueMenu = menu;

        /* Ekranın sağından taşarsa sola kayar */
        menu.style.left = '0';
        const over = menu.getBoundingClientRect().right -
            (document.documentElement.clientWidth - 8);
        if (over > 0)
            menu.style.left = -over + 'px';
        layerOpened('leagueMenu');
    });

    filter.appendChild(leagueBtn);
    filter.appendChild(menu);
    row.appendChild(filter);
    tools.leagueBtn = leagueBtn;

    tools.timeBtn = pill('tb-time', 'Zaman ' + TIME_ICON, () => {
        state.timeOrder = !state.timeOrder;
        if (state.timeOrder)
            state.popular = false;
        changed();
    });

    /* Arama kutusu (Forum'da ayrı satırda durur) */
    tools.input = options.input || null;

    if (options.search) {

        const box = document.createElement('label');
        box.className = 'search-box tool-search';
        box.innerHTML = SEARCH_ICON +
            '<input type="search" placeholder="Arama yap" size="9" autocomplete="off">';
        row.appendChild(box);
        tools.input = box.querySelector('input');
    }

    if (tools.input) {
        tools.input.addEventListener('input', () => {
            if (tools.input.value.trim() && options.liveClearsSearch)
                state.liveOnly = false;
            changed();
        });
    }

    tools.refresh = () => {
        if (tools.popularBtn)
            tools.popularBtn.classList.toggle('active', !!state.popular);
        tools.liveBtn.classList.toggle('active', state.liveOnly);
        tools.timeBtn.classList.toggle('active', state.timeOrder);
        leagueBtn.firstChild.textContent =
            state.leagues.size ? 'Ligler (' + state.leagues.size + ') ' : 'Ligler ';
        leagueBtn.classList.toggle('active', state.leagues.size > 0);
    };

    tools.refresh();

    return tools;
}

/* Arama ve Ligler süzgeci (Forum ve Oranlar için ortak) */
function filterMatches(list, tools) {

    const state = tools.state;
    const query = tools.input ? lower(tools.input.value.trim()) : '';

    return list.filter(m =>
        (!state.leagues.size || state.leagues.has(m.league.id)) &&
        (!state.liveOnly || m.status === 'live') &&
        (!query || lower(m.home.name).includes(query) || lower(m.away.name).includes(query))
    );
}

function hideLeagueMenu() {
    if (openLeagueMenu)
        openLeagueMenu.classList.remove('open');
    openLeagueMenu = null;
}

function closeLeagueMenu() {
    hideLeagueMenu();
    layerClosed('leagueMenu');
}

/* Canlı Skor'un durumu */
const liveState = { liveOnly: false, timeOrder: false, leagues: new Set() };
const liveTools = document.getElementById('liveTools');

const liveToolbar = buildTools(document.getElementById('toolRow'), liveState, {
    search: true,
    liveClearsSearch: true,
    render: () => renderLive()
});

const searchInput = liveToolbar.input;

/* Türkçe harflere duyarlı küçük harf */
function lower(text) {
    return text.toLocaleLowerCase('tr');
}

/* Canlı Skor: lig lig, tek satır */
function renderLive() {

    const box = document.getElementById('liveList');
    box.textContent = '';

    const query = lower(searchInput.value.trim());
    const searching = query.length > 0;

    const liveOnly = liveState.liveOnly;
    const timeOrder = liveState.timeOrder;
    const leagueSelected = liveState.leagues;

    /* Aramada gün satırı soluklaşır; "Canlı" açıkken soluklaşmaz */
    liveTools.classList.toggle('no-day', searching);
    liveToolbar.refresh();

    let any = false;

    /* Zamana göre: ligler ayrılmaz, tek kutuda saat sırasıyla */
    const groups = timeOrder ? [null] : LEAGUES;

    groups.forEach(league => {

        if (league && leagueSelected.size && !leagueSelected.has(league.id))
            return;

        let list = MATCHES.filter(m => timeOrder || m.league === league);

        if (liveOnly)
            list = list.filter(m => m.status === 'live');

        if (searching) {
            list = list.filter(m =>
                lower(m.home.name).includes(query) || lower(m.away.name).includes(query)
            );
        }

        if (timeOrder && leagueSelected.size)
            list = list.filter(m => leagueSelected.has(m.league.id));

        if (!liveOnly && !searching)
            list = list.filter(m => dayKey(m.date) === selectedDay);

        /* Aramada en yeni maç üstte, diğerlerinde saat sırasıyla */
        list.sort((a, b) => searching ? b.date - a.date : a.date - b.date);

        if (!list.length)
            return;

        any = true;

        const block = document.createElement('div');
        block.className = 'league-block';

        /* Zamana göre: başlık yok, her satırın üstünde ligi yazar */
        if (!league) {
            list.forEach(m => block.appendChild(scoreRow(m, searching, true)));
            box.appendChild(block);
            return;
        }

        const head = document.createElement('div');
        head.className = 'league-head';
        head.innerHTML = league.flag + '<span></span>';
        head.querySelector('span').textContent = league.country + ' · ';
        head.appendChild(document.createTextNode(league.name));

        head.appendChild(leagueBell(block, list));

        block.appendChild(head);
        list.forEach(m => block.appendChild(scoreRow(m, searching)));
        box.appendChild(block);
    });

    if (!any) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            searching ? '"' + searchInput.value.trim() + '" için maç bulunamadı.' :
            liveOnly ? 'Şu an oynanan maç yok.' : 'Bu gün maç yok.';
        box.appendChild(empty);
    }
}

function renderCalendar() {

    box.textContent = '';

    document.getElementById('calTitle').textContent =

    const days = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0).getDate();

    for (let d = 1; d <= days; d++) {

        const key = dayKey(new Date(calMonth.getFullYear(), calMonth.getMonth(), d, 12));
        const button = document.createElement('button');
        button.textContent = d;
        button.classList.toggle('today', key === TODAY);
        button.classList.toggle('selected', key === selectedDay);

        button.addEventListener('click', () => {
            closeCalendar();
            selectDay(key);

function renderSaved() {

    const box = document.getElementById('mySaved');

    const all = MATCHES.filter(m => savedIds.has(m.id));

            .forEach(m => block.appendChild(scoreRow(m, true, true)));

        const head = document.createElement('div');

        block.appendChild(head);

    if (!any) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            'Kayıtlı maçın yok. Canlı Skor\'da bir maçın yanındaki zile basınca burada görünür.';
        box.appendChild(empty);
    }
}

const MY_ORDER = ['saved', 'coupons'];
const myMain = document.getElementById('myMain');
const myTrack = document.getElementById('myTrack');

let myPage = 'saved';
let myTrackTimer = null;
let mySwipe = null;

function setMyPage(name) {

    myPage = name;

    document.querySelectorAll('#myTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.my === name);
    });

    myTrack.querySelectorAll('.my-page').forEach(page => {
        page.classList.toggle('current', page.dataset.my === name);
    });

    myTrack.classList.add('both');
    myTrack.style.setProperty('--page', MY_ORDER.indexOf(name));

    clearTimeout(myTrackTimer);
    myTrackTimer = setTimeout(() => {
        if (!mySwipe)
            myTrack.classList.remove('both');
    }, 320);
}

document.querySelectorAll('#myTabs button').forEach(button => {
    button.addEventListener('click', () => setMyPage(button.dataset.my));
});

/* Parmakla yana kaydırma (ana sayfadakiyle aynı his) */
myMain.addEventListener('touchstart', event => {

    mySwipe = event.touches.length === 1 ? {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    } : null;

}, { passive: true });

myMain.addEventListener('touchmove', event => {

    if (!mySwipe)
        return;

    const dx = event.touches[0].clientX - mySwipe.x;
    const dy = event.touches[0].clientY - mySwipe.y;

    if (mySwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        mySwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (mySwipe.horizontal) {
            myMain.classList.add('swiping');
            myTrack.classList.add('both');
        }
    }

    if (!mySwipe.horizontal)
        return;

    mySwipe.dx = dx;

    const index = MY_ORDER.indexOf(myPage);
    const atEdge = (index === 0 && dx > 0) || (index === MY_ORDER.length - 1 && dx < 0);

    myTrack.style.setProperty('--swipe-x', (atEdge ? dx * 0.25 : dx) + 'px');

}, { passive: true });

function endMySwipe() {

    if (!mySwipe)
        return;

    const swipe = mySwipe;

    mySwipe = null;
    myMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = myMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = MY_ORDER[MY_ORDER.indexOf(myPage) + (swipe.dx < 0 ? 1 : -1)];

    myTrack.style.setProperty('--swipe-x', '0px');
    setMyPage(enough && next ? next : myPage);
}

myMain.addEventListener('touchend', endMySwipe, { passive: true });
myMain.addEventListener('touchcancel', endMySwipe, { passive: true });

/*
 * FORUM
 * Maçlar ayrıntılı kartlarla (yorum, beğeni...). Üstteki araç satırı:
 *   Popüler : en çok yorum alan maçlar
 *   Zaman   : en yeni üstte (önce canlı, sonra oynanacak, sonra oynanmış)
 *   ikisi de kapalı: lig lig, hafta hafta (önce canlı maçlar)
 *   Canlı ve Ligler süzer, arama takım adına göre bulur.
 */
const forumState = { popular: true, liveOnly: false, timeOrder: false, leagues: new Set() };
const forumSearchInput = document.getElementById('forumSearchInput');

const forumToolbar = buildTools(document.getElementById('forumTools'), forumState, {
    popular: true,
    input: forumSearchInput,
    render: () => renderForum()
});

function renderForum() {

    const box = document.getElementById('forumList');
    box.textContent = '';

    const all = filterMatches(MATCHES, forumToolbar);

    if (!all.length) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            forumSearchInput.value.trim() ? '"' + forumSearchInput.value.trim() + '" için maç bulunamadı.' :
            forumState.liveOnly ? 'Şu an oynanan maç yok.' : 'Maç yok.';
        box.appendChild(empty);
        return;
    }

    if (forumState.popular) {

        all
            .slice()
            .sort((a, b) => b.comments - a.comments)
            .slice(0, 20)
            .forEach(m => box.appendChild(matchCard(m)));

        return;
    }

    if (forumState.timeOrder) {

        const order = { live: 0, upcoming: 1, done: 2 };

        all
            .slice()
            .sort((a, b) =>
                order[a.status] - order[b.status] ||
                (a.status === 'upcoming' ? a.date - b.date : b.date - a.date)
            )
            .forEach(m => box.appendChild(matchCard(m)));

        return;
    }

    const live = all.filter(m => m.status === 'live');

    live.forEach(m => box.appendChild(matchCard(m)));

    LEAGUES.forEach(league => {

        for (let week = LAST_WEEK; week >= 1; week--) {

            const list = all.filter(m =>
                m.league === league && m.week === week && m.status !== 'live'
            );

            if (!list.length)
                continue;

            box.appendChild(weekTitle(
                league.name.toLocaleUpperCase('tr') + ' · ' + week + '. HAFTA' +
                (week >= CURRENT_WEEK ? ' · OYNANACAK' : '')
            ));

            list.forEach(m => box.appendChild(matchCard(m)));
        }
    });
}

/*
 * KUPON
 * Her maçtan bir seçim (1 / X / 2). Aynı maçta başka orana basınca
 * seçim değişir, seçili olana tekrar basınca çıkar.
 * Yeni kupon ve kaydedilen kuponlar telefonun hafızasında tutulur.
 */
const COUPON_KEY = 'canliSkorKupon';
const COUPONS_KEY = 'canliSkorKuponlar';
const PICK_NAMES = { home: 'MS 1', draw: 'MS X', away: 'MS 2', under: '2,5 Alt', over: '2,5 Üst' };

function readJSON(key, fallback) {
    try {
        return JSON.parse(localStorage.getItem(key)) || fallback;
    } catch (error) {
        return fallback;
    }
}

function writeJSON(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {}
}

/* Yeni kupon: maç id → seçim */
const couponPicks = new Map(
    readJSON(COUPON_KEY, []).filter(([id]) => MATCH_BY_ID.has(id))
);

/* Kaydedilen kuponlar: en yenisi başta */
let savedCoupons = readJSON(COUPONS_KEY, []);

function pickOdd(id, key) {
    return parseFloat(MATCH_BY_ID.get(id).odds[key]);
}

function picksTotal(picks) {
    return picks.reduce((total, [id, key]) => total * pickOdd(id, key), 1).toFixed(2);
}

function togglePick(id, key) {

    if (couponPicks.get(id) === key)
        couponPicks.delete(id);
    else
        couponPicks.set(id, key);

    couponChanged();
}

function couponChanged() {

    writeJSON(COUPON_KEY, Array.from(couponPicks));

    document.querySelectorAll('.odd.pickable').forEach(box => {
        box.classList.toggle('picked', couponPicks.get(box.dataset.match) === box.dataset.key);
    });

    renderCouponBall();
    renderCoupons();
}

function renderCouponBall() {

    const ball = document.getElementById('couponBall');
    const picks = Array.from(couponPicks);

    ball.classList.toggle('show', picks.length > 0);

    if (!picks.length)
        return;

    ball.querySelector('.cb-count').textContent = picks.length + ' maç';
    ball.querySelector('.cb-total').textContent = picksTotal(picks);
}

/* Kupondaki bir satır: maç, seçim, oran (yeni kuponda çıkarma düğmesi) */
function couponPickRow([id, key], removable) {

    const match = MATCH_BY_ID.get(id);

    const row = document.createElement('div');
    row.className = 'coupon-pick' + (removable ? ' removable' : '');

    const info = document.createElement('div');
    info.innerHTML = '<small></small><span class="cp-teams"></span>';
    info.querySelector('small').textContent =
        match.league.name + ' · ' + formatDate(match.date) + ' ' + formatTime(match.date);
    info.querySelector('.cp-teams').textContent = match.home.name + ' - ' + match.away.name;

    const choice = document.createElement('span');
    choice.className = 'cp-choice';
    choice.textContent = PICK_NAMES[key];

    const odd = document.createElement('span');
    odd.className = 'cp-odd';
    odd.textContent = match.odds[key];

    row.appendChild(info);
    row.appendChild(choice);
    row.appendChild(odd);

    if (removable) {
        const remove = document.createElement('button');
        remove.className = 'cp-remove';
        remove.setAttribute('aria-label', 'Kupondan çıkar');
        remove.textContent = '✕';
        remove.addEventListener('click', () => {
            couponPicks.delete(id);
            couponChanged();
        });
        row.appendChild(remove);
    }

    return row;
}

function couponTotalRow(picks) {
    const total = document.createElement('div');
    total.className = 'coupon-total';
    total.innerHTML = '<span>Toplam oran</span><span></span>';
    total.lastChild.textContent = picksTotal(picks);
    return total;
}

function saveCoupon() {

    const picks = Array.from(couponPicks);

    if (!picks.length)
        return;

    savedCoupons.unshift({ id: Date.now(), date: Date.now(), picks: picks });
    writeJSON(COUPONS_KEY, savedCoupons);

    couponPicks.clear();
    couponChanged();
}

function renderCoupons() {

    const box = document.getElementById('myCoupons');
    box.textContent = '';

    const picks = Array.from(couponPicks);

    /* Yeni kupon (henüz kaydedilmemiş) */
    if (picks.length) {

        const card = document.createElement('div');
        card.className = 'coupon-card new';

        const head = document.createElement('div');
        head.className = 'coupon-head';
        head.innerHTML = '<span>Yeni kupon</span><span></span>';
        head.lastChild.textContent = picks.length + ' maç';
        card.appendChild(head);

        picks.forEach(pick => card.appendChild(couponPickRow(pick, true)));
        card.appendChild(couponTotalRow(picks));

        /* Temizle | Kuponu kaydet */
        const actions = document.createElement('div');
        actions.className = 'coupon-actions';

        const clear = document.createElement('button');
        clear.className = 'coupon-clear';
        clear.textContent = 'Temizle';
        clear.addEventListener('click', () => {
            couponPicks.clear();
            couponChanged();
        });

        const save = document.createElement('button');
        save.className = 'coupon-save';
        save.textContent = 'Kuponu kaydet';
        save.addEventListener('click', saveCoupon);

        actions.appendChild(clear);
        actions.appendChild(save);
        card.appendChild(actions);

        box.appendChild(card);
    }

    /* Kaydedilen kuponlar */
    const list = savedCoupons
        .map(c => ({ ...c, picks: c.picks.filter(([id]) => MATCH_BY_ID.has(id)) }))
        .filter(c => c.picks.length);

    if (list.length) {

        const title = document.createElement('div');
        title.className = 'coupon-section';
        title.textContent = 'KAYDEDİLEN KUPONLAR';
        box.appendChild(title);

        list.forEach(coupon => {

            const card = document.createElement('div');
            card.className = 'coupon-card';

            const head = document.createElement('div');
            head.className = 'coupon-head';
            head.innerHTML = '<span></span><button class="coupon-delete">Sil</button>';
            head.firstChild.textContent = formatDate(new Date(coupon.date)) + ' · ' + coupon.picks.length + ' maç';
            head.lastChild.addEventListener('click', () => {
                savedCoupons = savedCoupons.filter(c => c.id !== coupon.id);
                writeJSON(COUPONS_KEY, savedCoupons);
                renderCoupons();
            });
            card.appendChild(head);

            coupon.picks.forEach(pick => card.appendChild(couponPickRow(pick, false)));
            card.appendChild(couponTotalRow(coupon.picks));

            box.appendChild(card);
        });
    }

    if (!picks.length && !list.length) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = 'Kuponun yok. Oranlar\'da bir orana basınca kupon oluşur.';
        box.appendChild(empty);
    }
}

/*
 * Oranlar: bu hafta ve önümüzdeki haftaların maçları, 1 / X / 2 ile.
 * Araç satırı Forum'daki gibi: Popüler, Canlı, Ligler, Zaman; arama altta.
 *   Popüler : en çok yorum alan maçlar
 *   Zaman   : ligler ayrılmadan saat sırasıyla
 *   ikisi de kapalı: lig lig, hafta hafta
 */
const ODDS_FIRST_WEEK = CURRENT_WEEK;
const oddsState = { popular: true, liveOnly: false, timeOrder: false, leagues: new Set() };
const oddsSearchInput = document.getElementById('oddsSearchInput');

const oddsToolbar = buildTools(document.getElementById('oddsTools'), oddsState, {

/* =================================================
   GERİ TUŞU
   -------------------------------------------------
   Açılan her katman (sayfa, menü...) geçmişe bir kayıt
   ekler; geri tuşu en son açılanı kapatır.
================================================= */

const openLayers = [];
let ignoredPops = 0;
let waitingLayers = [];

const LAYER_HIDERS = {
    empty: () => setTab('home'),
    leagueMenu: hideLeagueMenu,
    homeMode: () => setHomeModeView('live'),
    homeMenu: () => homeMenu.classList.remove('open'),
    detail: hideDetail,
    confirm: hideConfirm,
    calendar: hideCalendar
};

function layerOpened(name, url) {

    if (ignoredPops > 0) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        waitingLayers.push({ name: name, url: url });
        return;
    }

    try {

        if (openLayers.includes(name)) {
            if (url)
                history.replaceState({ depth: openLayers.length }, '', url);
            return;
        }

        openLayers.push(name);
        history.pushState({ depth: openLayers.length }, '', url || location.href);

    } catch (error) {}
}

function layerClosed(name) {

    if (waitingLayers.some(item => item.name === name)) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        return;
    }

    const index = openLayers.indexOf(name);

    if (index < 0)
        return;

    openLayers.splice(index, 1);

    ignoredPops++;
    history.back();
}

window.addEventListener('popstate', event => {

    if (ignoredPops > 0) {

        ignoredPops--;

        if (ignoredPops === 0) {
            const waiting = waitingLayers;
            waitingLayers = [];
            waiting.forEach(item => layerOpened(item.name, item.url));
        }

        return;
    }

    const depth = (event.state && event.state.depth) || 0;

    if (depth > openLayers.length) {
        ignoredPops++;
        history.go(openLayers.length - depth);
        return;
    }

    while (openLayers.length > depth)
        LAYER_HIDERS[openLayers.pop()]();
});


/* =================================================
   SEKMELER (ana sayfa / boş sayfa) VE MAVİ TOP
================================================= */

const acKapa = document.getElementById('acKapa');

const emptyLayer = document.getElementById('emptyLayer');
let settleTimer = null;

/* Penceredeki resmin alt kenarı, pencerenin üstünden kaç piksel aşağıda? */
function markClearTop() {
    const banner = emptyLayer.querySelector('.banner');
    const main = document.getElementById('myMain');
    const bottom = banner.offsetTop + banner.offsetHeight - main.scrollTop;
    emptyLayer.style.setProperty('--clear-top', Math.max(0, bottom) + 'px');
    emptyLayer.style.setProperty('--side', banner.getBoundingClientRect().left -
        emptyLayer.getBoundingClientRect().left + 'px');
}

/*
 * Pencere kayarken resim onunla gelmez: aynısı ekranda, son yerinde
 * sabit durur (#bannerGhost). Kayma bitince gerçek resim geri gelir.
 */
let bannerGhost = null;

function showBannerGhost() {

    hideBannerGhost();

    const banner = emptyLayer.querySelector('.banner');
    const main = document.getElementById('myMain');
    const layerTop = emptyLayer.getBoundingClientRect().top;
    const top = banner.getBoundingClientRect().top - layerTop;

    /* Resim kaydırılıp görünmez olduysa gerek yok */
    if (top + banner.offsetHeight <= main.offsetTop)
        return;

    bannerGhost = banner.cloneNode(true);
    bannerGhost.id = 'bannerGhost';
    bannerGhost.style.top = top + 'px';
    bannerGhost.style.left = banner.getBoundingClientRect().left + 'px';
    bannerGhost.style.width = banner.offsetWidth + 'px';
    bannerGhost.classList.toggle('raised', emptyLayer.classList.contains('raised'));
    document.body.appendChild(bannerGhost);

    emptyLayer.classList.add('ghosted');
}

function hideBannerGhost() {
    if (bannerGhost)
        bannerGhost.remove();
    bannerGhost = null;
    emptyLayer.classList.remove('ghosted');
}

function setTab(name) {

    /* Kayma başlamadan şeffaf üst ayarlanır; yerine oturunca gri olur. */
    clearTimeout(settleTimer);
    markClearTop();
    emptyLayer.classList.remove('settled');

    const wasOpen = document.body.dataset.tab === 'empty';

    if (wasOpen !== (name === 'empty'))
        showBannerGhost();

    settleTimer = setTimeout(() => {
        hideBannerGhost();
        if (name === 'empty')
            emptyLayer.classList.add('settled');
        else {
            emptyLayer.classList.remove('raised');
            if (pageBeforeCoupon) {
                setMyPageInstant(pageBeforeCoupon);
                pageBeforeCoupon = null;
            }
        }
    }, 340);

    document.body.dataset.tab = name;
    acKapa.setAttribute('aria-label', name === 'empty' ? 'Ana sayfaya dön' : 'Sayfayı aç');
}

function showTab(name) {

    setTab(name);

    if (name === 'empty')
        layerOpened('empty');
    else
        layerClosed('empty');
}

acKapa.addEventListener('click', () => {
    showTab(document.body.dataset.tab === 'empty' ? 'home' : 'empty');
});

/* Sarı top: Kuponlarım açılır */
/* Pencere kapalıyken sekme kaymadan, doğrudan seçilir */
function setMyPageInstant(name) {
    myMain.classList.add('swiping');
    setMyPage(name);
    myTrack.getBoundingClientRect();
    myMain.classList.remove('swiping');
}

/*
 * Sarı top Kuponlarım'ı açar / kapatır. Pencere kapanınca önceki sekmeye
 * dönülür; mavi top her zamanki gibi çalışır.
 */
let pageBeforeCoupon = null;

document.getElementById('couponBall').addEventListener('click', () => {

    const detailOpen = detailSheet.classList.contains('open');
    const layerOpen = document.body.dataset.tab === 'empty';

    /* Kayıtlı Maçlarım'dan açılan maç sayfasındayken: maç sayfası kapanır,
       alttaki pencere Kuponlarım'a geçer */
    if (layerOpen && detailOpen && !emptyLayer.classList.contains('raised')) {
        setMyPageInstant('coupons');
        closeDetail();
        return;
    }

    /* Açıkken tekrar basınca mavi top gibi kapanır, kalınan yere dönülür */
    if (layerOpen) {
        showTab('home');
        return;
    }

    emptyLayer.classList.toggle('raised', detailOpen);
    pageBeforeCoupon = myPage;
    setMyPageInstant('coupons');
    showTab('empty');
});

   ANA SAYFANIN DÖRT SAYFASI
================================================= */

const HOME_ORDER = ['live', 'forum', 'analysis', 'odds'];

const homeMain = document.getElementById('homeMain');
const homeTrack = document.getElementById('homeTrack');
const homeModeBox = document.getElementById('homeModeBox');

let homeMode = 'live';
let homeTrackTimer = null;

/* Görünümü değiştirir (geri tuşuyla dönerken de kullanılır). */
function setHomeModeView(mode) {

    const index = HOME_ORDER.indexOf(mode);

    homeMode = mode;

    homeModeBox.querySelectorAll('button').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
    });

    homeTrack.querySelectorAll('.home-page').forEach(page => {
        page.classList.toggle('current', page.dataset.page === mode);
    });

    /* Kayarken iki sayfa da görünsün; bitince diğerleri gizlenir. */
    homeTrack.classList.add('both');
    homeTrack.style.setProperty('--page', index);

    clearTimeout(homeTrackTimer);
    homeTrackTimer = setTimeout(() => {
        if (!homeSwipe)
            homeTrack.classList.remove('both');
    }, 320);
}

/*
 * "Canlı Skor" ana sayfadır. Başka bir sayfa açıkken geri
 * tuşu önce "Canlı Skor"a döner.
 */
function setHomeMode(mode) {

    setHomeModeView(mode);
    homeMain.scrollTop = Math.min(homeMain.scrollTop, homeTrack.offsetTop - 12);

    if (mode === 'live')
        layerClosed('homeMode');
    else
        layerOpened('homeMode');
}

homeModeBox.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => setHomeMode(button.dataset.mode));
});

/* Yana kaydırma (inşaat uygulamasındakiyle aynı his) */
const TAB_SWIPE_RATIO = 0.12;
const TAB_FLICK_RATIO = 0.04;

let homeSwipe = null;

function setHomeSwipeX(px) {
    homeTrack.style.setProperty('--swipe-x', px + 'px');
}

homeMain.addEventListener('touchstart', event => {

    /* Gün düğmeleri kendi içinde yana kayar; sayfa değişmez. */
    if (event.touches.length !== 1 || event.target.closest('#liveTools, .tool-row, #forumSearchBox, #oddsSearchBox')) {
        homeSwipe = null;
        return;
    }

    homeSwipe = {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    };

}, { passive: true });

homeMain.addEventListener('touchmove', event => {

    if (!homeSwipe)
        return;

    const dx = event.touches[0].clientX - homeSwipe.x;
    const dy = event.touches[0].clientY - homeSwipe.y;

    if (homeSwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        homeSwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (homeSwipe.horizontal) {
            homeMain.classList.add('swiping');
            homeTrack.classList.add('both');
        }
    }

    if (!homeSwipe.horizontal)
        return;

    homeSwipe.dx = dx;

    const index = HOME_ORDER.indexOf(homeMode);
    const atEdge = (index === 0 && dx > 0) || (index === HOME_ORDER.length - 1 && dx < 0);

    setHomeSwipeX(atEdge ? dx * 0.25 : dx);

}, { passive: true });

function endHomeSwipe() {

    if (!homeSwipe)
        return;

    const swipe = homeSwipe;

    homeSwipe = null;
    homeMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = homeMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = HOME_ORDER[HOME_ORDER.indexOf(homeMode) + (swipe.dx < 0 ? 1 : -1)];

    setHomeSwipeX(0);

    if (enough && next)
        setHomeMode(next);
    else
        setHomeModeView(homeMode);
}

homeMain.addEventListener('touchend', endHomeSwipe, { passive: true });
homeMain.addEventListener('touchcancel', endHomeSwipe, { passive: true });

    homeMenu.classList.add('open');

});

    });
});

document.getElementById('menuClose').addEventListener('click', closeHomeMenu);

/* Menü açıkken başka bir yere dokunulursa sadece menü kapanır. */

document.addEventListener('pointerdown', event => {

    menuSwallow =
        homeMenu.classList.contains('open') &&
        !event.target.closest('#homeMenu, #menuBtn');

    if (menuSwallow) {
        event.preventDefault();
        event.stopPropagation();
        closeHomeMenu();
    }

}, true);

document.addEventListener('click', event => {

    if (!menuSwallow)
        return;

    menuSwallow = false;
    event.preventDefault();
    event.stopPropagation();

}, true);

homeMain.addEventListener('scroll', () => {

});
