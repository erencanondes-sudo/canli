<style>

* {
    box-sizing: border-box;

    /* Dokunulan yerde telefonun mavi vurgusu çıkmasın */
    -webkit-tap-highlight-color: transparent;
}

/*
 * İÇERİK GENİŞLİĞİ
 * Ana sayfadaki kartlar ve maç sayfası aynı genişliği kullanır.
 */
:root {
    --content-width: 640px;
    --side-gap: max(16px, calc((100% - var(--content-width)) / 2));
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* -----------------------------
   ANA SAYFA
----------------------------- */

#homePage {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;
}

#homeMain {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;

    /*
     * Kaydırma çubuğunun yeri hep ayrılır: içerik kısa ya da uzun
     * olsun genişlik değişmez, üstteki alan büyüyüp küçülmez.
     */
    scrollbar-gutter: stable;

    /* Yukarı aşağı kaydırma tarayıcıda, sağa sola kaydırma bizde. */
    touch-action: pan-y;

    /* Alttaki boşluk: son kart alttaki düğmenin arkasında kalmasın. */
    padding: 12px var(--side-gap) 180px;
}

/*
 * ÜSTTEKİ BAŞLIK ALANI
 * İnşaat uygulamasındaki resmin yerinde; resim yerine kodla
 * çizilmiş bir saha (hiçbir şey indirilmez).
 */
#homeBanner {
    position: relative;
    aspect-ratio: 3.4 / 1;
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    color: white;
    background:
        radial-gradient(circle at 50% 50%, transparent 17%, rgba(255,255,255,.35) 17.4%, transparent 18%),
        linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,.35) 49.8%, rgba(255,255,255,.35) 50.2%, transparent 50.2%),
        repeating-linear-gradient(90deg, #2f7d43 0 10%, #2a7340 10% 20%);
}

/*
 * Ana sayfanın üstündeki resim (reklam alanı): ekranın en üstünde,
 * tam genişlikte, 100px boyunda. Kaydırılan alanın dışında olduğu için
 * hep yerinde durur; içerik altında kayar. Kayıtlı Maçlarım açılınca da
 * yerinde kalır (o sayfa bunun 16px altından başlar).
 */
#homeBanner {
    flex: none;
    height: 100px;
    aspect-ratio: auto;
    margin: 0;
    border-radius: 0;
}

/* Koyu perde: yazı okunsun */
#homeBanner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 30, 20, .05), rgba(10, 30, 20, .55));
}

.banner-text {
    position: absolute;
    left: 1em;
    bottom: .9em;
    z-index: 1;
}

.banner-title {
    font-size: 1.7em;
    font-weight: 800;
    letter-spacing: -.01em;
}

.banner-sub {
    margin-top: .15em;
    font-size: .9em;
    font-weight: 600;
    opacity: .9;
}

/*
 * Reklamın altındaki 16px boş şerit (tıklanamaz). Kayan içerik bunun
 * altında kesilir; hiçbir düğme reklama 16px'ten fazla yaklaşamaz.
 */
#homeAdGap {
    flex: none;
    height: 16px;
    pointer-events: none;
}

/* Sekmelerle reklam arası yalnızca şerit kadar: sabit 16px */
#homeMain {
    padding-top: 0;
}

#homeTitleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

/*
 * ÜST DÜĞMELER: Canlı Skor / AI Kuponu / Analiz / Oranlar
 * Satırın genişliğine yayılırlar; yazı boyutu ekranla orantılı.
 */
#homeModeBox {
    display: flex;
    flex: 1;
    gap: .35em;
    min-width: 0;

    /* Menü düğmesine göre ortalanmaz: reklamla arası her ekranda sabit 16px */
    align-self: flex-start;
    margin-right: .35em;
    font-size: min(16px, 3.4vw);
}

#homeModeBox button {
    flex: 1 1 auto;
    min-width: 0;
    padding: .55em .3em;
    border: 1px solid #d5d8de;
    border-radius: 10px;
    background: white;
    font-size: inherit;
    font-weight: 800;
    color: #444;
    white-space: nowrap;
}

#homeModeBox button.active {
    border-color: #1a73e8;
    background: #eef4ff;
    color: #1a73e8;
}

/*
 * GÜN SEÇİMİ (sadece Canlı Skor sayfasında)
 * Sekmelerin altında yana kaydırılan gün düğmeleri.
 */
#dayRow {
    display: flex;
    align-items: center;
    gap: .35em;
    margin: 0 0 8px;
}

/* Spor seçimi: seçili top koyu çerçeveli, diğeri biraz açık */
#sportBox {
    flex: none;
    display: flex;
    gap: .3em;
    font-size: 13px;
}

.sport-btn {
    width: 2.6em;
    height: 2.6em;
    padding: 0;
    font-size: inherit;
    border: 1px solid #d5d8de;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;

    /* Seçili olmayan top da canlı görünür, sadece biraz açık */
    opacity: .75;
}

.sport-btn.active {
    /* Kalın çerçeve içe doğru; düğmenin boyu aynı kalır */
    border: .25em solid #1d2340;
    opacity: 1;
    filter: none;
}

.sport-btn svg {
    width: 1.55em;
    height: 1.55em;
}

/*
 * Gün kutusu: her zaman 4 gün sığar (dün, bugün, yarın, öbür gün).
 * Düğme genişliği ve yazı boyu kutunun genişliğine göre ayarlanır (cqw).
 */
#dayBox {
    --day-gap: 1.8%;

    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    gap: var(--day-gap);
    overflow-x: auto;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
    container-type: inline-size;
    font-size: 11px;
}

#dayBox::-webkit-scrollbar {
    display: none;
}

/* İki satır: üstte gün (Cmt), altta tarih (17.10) */
#dayBox button {
    flex: 0 0 calc((100% - 3 * var(--day-gap)) / 4);
    min-width: 0;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    padding: .3em .1em;
    border: 1px solid #d5d8de;
    border-radius: .9em;
    background: white;

    /* Yazı kutuya göre küçülür (dar telefonda da 4 gün sığsın) */
    font-size: clamp(7px, 6.4cqw, 11px);
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

#dayBox button.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/* "Canlı" ya da arama açıkken gün seçimi kullanılmaz: soluk görünür */
#liveTools.no-day #dayBox {
    opacity: .45;
}

/* Gün düğmelerinin iki yanındaki oklar: önceki / sonraki gün */
.day-arrow {
    flex: none;

    /* Dar: okun tarih tarafında boşluk kalmaz */
    width: .6em;
    height: 1.4em;
    padding: 0;
    background: none;
    color: #1d2340;
    font-size: 22px;
    line-height: 1;
}

#dayPrev {
    text-align: left;
}

#dayNext {
    text-align: right;
}

.day-arrow:disabled {
    opacity: .25;
}

/* Sağdaki takvim düğmesi */
#calendarBtn {
    position: relative;
    flex: none;
    width: 2.6em;
    height: 2.6em;
    padding: 0;
    border: 1px solid #d5d8de;
    border-radius: 50%;
    background: white;
    color: #1d2340;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
}

#calendarBtn svg {
    width: 1.35em;
    height: 1.35em;
}

/*
 * TAKVİM (kendi çizdiğimiz; tarayıcının "Temizle / Bugün" düğmeleri yok)
 * Düğmenin altında, sola doğru açılır.
 */
#calendarWrap {
    position: relative;
    flex: none;
}

#calendarPop {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + .45em);
    z-index: 8;
    width: 17.5em;
    padding: .7em .6em .6em;
    background: white;
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(0,0,0,.22);
    font-size: 13px;
}

#calendarPop.open {
    display: block;
}

#calHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .5em;
}

#calHead span {
    font-weight: 800;
    color: #1d2340;
}

#calHead button {
    width: 2em;
    height: 2em;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #f1f3f7;
    font-size: 1.2em;
    font-weight: 700;
    line-height: 1;
    color: #1d2340;
}

#calWeek,
#calDays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
}

#calWeek span {
    padding: .2em 0 .4em;
    font-size: .8em;
    font-weight: 700;
    color: #9aa0ab;
}

#calDays button {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    font-size: inherit;
    font-weight: 600;
    color: #1d2340;
}

#calDays button.today {
    color: #1a73e8;
    font-weight: 800;
}

#calDays button.selected {
    background: #1d2340;
    color: white;
}

/* İkinci satır: Canlı | Ligler | Arama */
.tool-row {
    display: flex;
    align-items: center;
    gap: .3em;
    margin: 0 0 10px;

    /* Dar ekranda yazılar biraz küçülür, dört öğe tek satıra sığar */
    font-size: min(12.5px, 3.3vw);
}

.tb-live,
.tb-league,
.tb-time,
.tb-popular {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .4em;
    height: 2.5em;
    padding: 0 .75em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

/* Canlı düğmesindeki kırmızı nokta */
.tb-live::before {
    content: '';
    width: .5em;

    position: relative;

/*
 * CANLI SKOR LİSTESİ (tek satırlık maçlar, lig lig)
 */
.league-block {

    margin: 0 max(-1.25vw, -.375em) .9em;

/* Tek satır: durum | ev sahibi | skor | deplasman */
.score-row {
    display: grid;
    /* durum | ev sahibi | skor | deplasman | zil
       İki uç sütun eşit: skor satırın tam ortasında durur */
    grid-template-columns: 2.4em 1fr auto 1fr 2.4em;
    align-items: center;

    /* Dar ekranda aralar biraz daralır, takım adları sığsın */
    gap: min(.45em, 1.6vw);
    cursor: pointer;
    width: 100%;
    padding: .45em min(.7em, 2.4vw);
    border-radius: 0;
    background: white;
    border-bottom: 1px solid #f1f2f5;
    text-align: left;
    font-size: 14px;
    font-weight: 400;
    color: #1d2340;
}

.score-row:last-child {
    border-bottom: 0;
}

/* Hızlı kaynakta uyarı: satır hafif kırmızı */
.score-row.warn {
    background: #fdecec;
}

.score-row:active {
    background: #f4f6fa;
}

.score-row:focus {
    outline: none;
}

/*
 * ZİL ANİMASYONU (0,7 saniye)
 * Zil sallanır ve aynı anda renk zilden sola doğru satırı süpürür.
 * Kaydedince yeşil, çıkarınca kırmızı.
 */
.score-row {
    position: relative;
    isolation: isolate;
}

/* 1: Zil sallanır (kaydedince), küçülüp büyür ve kırmızı yanar (çıkarınca) */
.score-row.a1-add .score-bell svg {
    transform-origin: 50% 15%;
    animation: bellRing .7s ease;
}

.score-row.a1-remove .score-bell svg {
    animation: bellDrop .7s ease;
}

@keyframes bellRing {
    0%   { transform: scale(1) rotate(0); color: #22c55e; }
    15%  { transform: scale(1.35) rotate(-20deg); }
    30%  { transform: scale(1.3) rotate(16deg); }
    45%  { transform: scale(1.2) rotate(-11deg); }
    60%  { transform: scale(1.1) rotate(7deg); }
    78%  { transform: scale(1.05) rotate(-3deg); }
    100% { transform: scale(1) rotate(0); }
}

@keyframes bellDrop {
    0%   { transform: scale(1); color: #ef4444; }
    30%  { transform: scale(.65); color: #ef4444; }
    60%  { transform: scale(1.15); color: #ef4444; }
    100% { transform: scale(1); }
}

/* 3: Renk zilden sola doğru satırı süpürür, sonra söner */
.score-row.a3-add::before,
.score-row.a3-remove::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    transform-origin: right center;
    pointer-events: none;
    animation: sweep .7s ease-out forwards;
}

.score-row.a3-add::before    { background: rgba(34, 197, 94, .35); }
.score-row.a3-remove::before { background: rgba(239, 68, 68, .32); }

@keyframes sweep {
    0%   { transform: scaleX(0); opacity: 1; }
    45%  { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
}

/*
 * ANA SAYFANIN DÖRT SAYFASI
 * Yan yana dururlar; şerit sağa sola kayarak seçili olanı gösterir.
 * Parmakla çekilirken yandaki sayfa da görünür.
 */
#homePager {
    overflow-x: clip;

    /*
     * Kırpma alanı iki yana biraz taşar (içerik aynı yerde kalır);
     * böylece Canlı Skor'daki geniş lig kutuları kesilmez.
     */
    margin: 0 max(-2.5vw, -.75em);
    padding: 0 min(2.5vw, .75em);
}

#homeTrack {
    --page-gap: 3em;

    display: flex;
    align-items: flex-start;
    gap: var(--page-gap);
    width: calc(400% + 3 * var(--page-gap));
    transform: translateX(calc(
        var(--page, 0) * (-100% / 4 - var(--page-gap) / 4) + var(--swipe-x, 0px)
    ));
    transition: transform .28s ease;
}

#homeMain.swiping #homeTrack {
    transition: none;
}

.home-page {
    flex: none;
    width: calc((100% - 3 * var(--page-gap)) / 4);
    min-width: 0;
}

/* Geçiş yokken görünmeyen sayfalar yer kaplamaz. */
#homeTrack:not(.both) .home-page:not(.current) {
    height: 0;
    overflow: hidden;
    visibility: hidden;
}

/* -----------------------------
   MAÇ KARTI
   Üstte hafta ve saat, ortada iki takım ve skor,
   altta ayraçla ayrılmış yorum / beğeni / beğenmeme.
----------------------------- */

.match-card {
    display: block;
    width: 100%;
    padding: .75em .9em .7em;
    margin-bottom: .75em;
    background: white;
    border-radius: 16px;
    box-shadow: 0 1px 6px rgba(0,0,0,.10);
    text-align: left;
    font-size: 14px;
    font-weight: normal;
    color: #222;
}

.match-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: .45em;
    font-size: .857em;
    font-weight: 600;
    color: #6b7080;
}

/* Maçın durumu: CANLI 63' / MS / saat */
.match-status {
    display: inline-flex;
    align-items: center;
    gap: .35em;
    font-weight: 800;
}

.match-status.live {
    color: #d93025;
}

.match-status.live::before {
    content: '';

    height: .55em;
    border-radius: 50%;
    background: #d93025;
    animation: blink 1.2s ease-in-out infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

    color: #444;
}

/* Oynanacak maçın saati: lig adı gibi silik */
.match-status.upcoming {
    color: #6b7080;
    font-weight: 600;
}

/*
 * Takım arması yerine: takım renklerinde yuvarlak ve kısa adı.
 * (Gerçek armalar kullanılmaz.)
 */
.crest {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.7em;
    height: 2.7em;
    border-radius: 50%;
    font-size: .56em;
    font-weight: 800;
    letter-spacing: -.02em;

    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);

    gap: .5em;
    margin-top: .55em;

.oc-markets {

/* -----------------------------
   BOŞ SAYFA
   Mavi top ile alttan açılır (inşaat uygulamasındaki
   haritanın yeri; şimdilik boş).
----------------------------- */

/* Tam sayfa değil: üstteki reklam (100px) yerinde kalır, 16px boşluk bırakılır */
#emptyLayer {
    position: fixed;
    top: calc(100px + 16px);
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 18;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;

    transform: translateY(100%);
    visibility: hidden;
    transition: transform .32s ease, visibility 0s linear .32s;
}

#myMain {
    flex: 1;
    overflow-y: auto;
    scrollbar-gutter: stable;
    padding: 0 var(--side-gap) 180px;
}

/* Kayıtlı Maçlarım / Kuponlarım düğmeleri (ana sayfadaki sekmeler gibi) */
#myTabs {
    display: flex;
    gap: .35em;
    margin-bottom: 10px;
    font-size: min(16px, 3.4vw);
}

#myTabs button {
    flex: 1;
    padding: .55em .3em;
    border: 1px solid #d5d8de;
    border-radius: 10px;
    background: white;
    font-size: inherit;
    font-weight: 800;
    color: #444;
}

#myTabs button.active {
    border-color: #1a73e8;
    background: #eef4ff;
    color: #1a73e8;
}

/* Kayıtlı Maçlarım | Kuponlarım: yan yana iki sayfa, kayarak geçilir */
#myPager {
    overflow-x: clip;
    margin: 0 max(-2.5vw, -.75em);
    padding: 0 min(2.5vw, .75em);
}

#myTrack {
    --page-gap: 3em;

    display: flex;
    align-items: flex-start;
    gap: var(--page-gap);
    width: calc(200% + var(--page-gap));
    transform: translateX(calc(
        var(--page, 0) * (-50% - var(--page-gap) / 2) + var(--swipe-x, 0px)
    ));
    transition: transform .28s ease;
}

#myMain.swiping #myTrack {
    transition: none;
}

.my-page {
    flex: none;
    width: calc((100% - var(--page-gap)) / 2);
    min-width: 0;
}

#myTrack:not(.both) .my-page:not(.current) {
    height: 0;
    overflow: hidden;
    visibility: hidden;
}

#mySaved .league-block {
    margin-left: max(-2.5vw, -.75em);
    margin-right: max(-2.5vw, -.75em);
}

body[data-tab="empty"] #emptyLayer {
    transform: translateY(0);
    visibility: visible;
    transition: transform .32s ease, visibility 0s;
}

/* Maç sayfası açıkken sarı topla açılan Kuponlarım, maç sayfasının üstüne gelir */
#emptyLayer.raised {
    z-index: 31;

    /* Maç sayfasındaki ince reklam (50px) yerinde kalır, 16px boşluk bırakılır */
    top: calc(50px + 16px);
}

/* -----------------------------
   ALT DÜĞME (mavi top)
----------------------------- */

.alt-menu {
    position: fixed;
    left: 50%;

    /* Biraz aşağıda: topun ortası alttan 44px yukarıda */
    bottom: calc(2px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);

    /* Maç sayfası ve açılan her şeyin üstünde görünür */
    z-index: 33;
}

/*
 * Mavi top: görünen top 62px, dokunma alanı ise çevresiyle birlikte 84px
 * (top küçüldü, basılabilen yer eskisinden büyük).
 */
.ac-kapa {
    position: relative;
    flex: none;
    width: 84px;
    height: 84px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease;
}

.ac-kapa::before {
    content: '';
    position: absolute;
    inset: 11px;
    border: 4px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #3d8dff 0%, #1f6ff2 100%);
    box-shadow: 0 9px 20px rgba(37, 117, 252, .45);
}

.ac-kapa:active { transform: scale(.94); }

.ac-kapa svg {
    position: relative;
    top: 1px;
    width: 23px;
    height: 23px;
    transition: transform .3s ease;
}

body[data-tab="empty"] .ac-kapa svg,
body.has-layer .ac-kapa svg {
    transform: rotate(180deg);
}

/* AI Kuponu / Analiz / Oranlar başındayken: ok sola (Canlı Skor'a döner) */
body.ball-left .ac-kapa svg {
    transform: rotate(-90deg);
}

/*
 * KUPON TOPU (koyu sarı)
 * Oranlardan seçim yapılınca mavi topun hizasında, sağda belirir.
 * Basınca Kuponlarım açılır; top yerinde kalır.
 * Kupon kaydedilince (seçimler temizlenince) kaybolur.
 */
#couponBall {
    position: fixed;
    right: var(--side-gap);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));

    /* Maç sayfasının da üstünde durur (oranlar orada da seçilebilir) */
    z-index: 32;
    width: 72px;
    height: 72px;
    padding: 0;
    border: 5px solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #f7c428 0%, #e8aa10 100%);

    /* Renksiz hafif gölge: beyaz çember beyaz kartların üstünde de görünsün */
    box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;

    opacity: 0;
    visibility: hidden;
    transform: scale(.6);
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
}

#couponBall.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition: opacity .2s ease, transform .2s ease, visibility 0s;
}

#couponBall:active {
    transform: scale(.94);
}

#couponBall .cb-count {
    font-size: 12px;
    font-weight: 700;
}

#couponBall .cb-total {
    font-size: 14px;
    font-weight: 800;
}

/* Oranlar sekmesinde seçilen oran: koyu sarı */
.odd.pickable {
    cursor: pointer;
}

.odd.picked {
    background: #ebb21c;
}

.odd.picked span,
.odd.picked b {
    color: white;
}

/* -----------------------------

/* =====================================================
   GOL BİLDİRİMİ (uygulama içi): en üstte, tam genişlik, 100px
===================================================== */
#goalToast {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .2em;
    padding: 0 4%;
    background: #1a73e8;
    color: white;
    box-shadow: 0 .2em .8em rgba(0, 0, 0, .25);
    transform: translateY(-110%);
    transition: transform .3s ease;
    pointer-events: none;
}

#goalToast.show {
    transform: translateY(0);
}

.gt-title {
    font-size: 1.15em;
    font-weight: 800;
    letter-spacing: .02em;
}

.gt-match {
    font-size: 1em;
    font-weight: 600;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.gt-match b {
    font-weight: 800;
}

/* Gol bekleniyor: beklenen takımın yanında büyüyüp küçülen, ışık saçan kırmızı nokta */
.score-team .warn-dot {
    flex: none;
    width: .5em;
    height: .5em;
    border-radius: 50%;
    background: #e53935;
    animation: warnPulse 1.2s ease-in-out infinite;
}

@keyframes warnPulse {
    0%, 100% { transform: scale(.8); box-shadow: 0 0 0 0 rgba(229, 57, 53, .55); }
    50%      { transform: scale(1.15); box-shadow: 0 0 .45em .2em rgba(229, 57, 53, .35); }
}

/* Gol atan takımın yanındaki top (10 saniye). Eğik yazılmasın (emoji yamuk görünüyordu) */
.score-team .goal-ball {
    flex: none;
    font-style: normal;
    font-size: .9em;
}

/* =====================================================
   REKLAM (üst resmin üzerinde, tam genişlik, 100px boy)
   İki reklam, video gibi sahne sahne oynar; her biri 15 saniye.
   Hepsi 30 saniyelik tek döngü: ilk yarı 1. reklam, ikinci yarı 2. reklam.
===================================================== */
.ad-strip {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    justify-content: center;
    overflow: hidden;
    background: black;
}

/* ŞİMDİLİK GİZLİ: reklamlar görünmez, siyah şerit kalır. Açmak için bu kuralı sil. */
.ad-strip .ad-box {
    display: none;
}

.ad-box {
    position: relative;
    flex: none;
    width: 320px;
    height: 100px;
    overflow: hidden;
    font-size: 16px;
    color: white;
}

.ad {
    --off: 0s;
    position: absolute;
    inset: 0;
    animation: adShow 30s linear var(--off) infinite both;
}

.ad-1 { background: linear-gradient(120deg, #172554, #1a73e8); }
.ad-2 { --off: -15s; background: linear-gradient(120deg, #1c1917, #b45309); }

.ad-scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 1em;
    opacity: 0;
}

.ad-s1 { animation: adS1 30s ease var(--off) infinite both; }
.ad-s2 { animation: adS2 30s ease var(--off) infinite both; }
.ad-s3 { animation: adS3 30s ease var(--off) infinite both; }

.ad-row {
    display: flex;
    align-items: center;
    gap: .5em;
}

.ad-tag {
    padding: .1em .45em;
    border-radius: .35em;
    background: #facc15;
    font-size: .62em;
    font-weight: 800;
    color: #1d2340;
}

.ad-big {
    font-size: 1.55em;
    font-weight: 800;
    line-height: 1.1;
}

.ad-mid {
    font-size: 1.05em;
    font-weight: 800;
}

.ad-small {
    margin-top: .25em;
    font-size: .72em;
    font-weight: 600;
    opacity: .85;
}

.ad-spin {
    display: inline-block;
    font-size: 1.4em;
    animation: adSpin 1.6s linear infinite;
}

/* Sırayla beliren küçük kutular / yıldızlar */
.ad-pop {
    --d: 0s;
    display: inline-block;
    animation: adPop 30s ease calc(var(--off) + var(--d)) infinite both;
}

.ad-chip {
    padding: .3em .5em;
    border-radius: .45em;
    background: rgba(255,255,255,.16);
    font-size: .7em;
    font-weight: 800;
    white-space: nowrap;
}

.ad-chip b { margin-left: .3em; color: #facc15; }

.ad-btn {
    align-self: flex-start;
    margin-top: .35em;
    padding: .3em .8em;
    border-radius: 1em;
    background: white;
    font-size: .75em;
    font-weight: 800;
    color: #1a56db;
    animation: adPulse 1s ease-in-out infinite;
}

.ad-2 .ad-btn { color: #b45309; }

.ad-stars {
    margin-top: .15em;
    font-size: 1.1em;
    letter-spacing: .1em;
    color: #facc15;
}

.ad-stars .off { color: rgba(255,255,255,.3); }

.ad-bars {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: .2em .5em;
    margin-top: .3em;
    font-size: .68em;
    font-weight: 700;
}

.ad-bar {
    height: .5em;
    border-radius: .3em;
    background: #facc15;
    transform-origin: left;
    animation: adBar 30s ease var(--off) infinite both;
}

/*
 * İçerik sayfasının en üstündeki ince reklam: ekran genişliğinde, 50px boyunda
 * siyah zemin; sabit 320x50 reklam onun üstüne biner (köşeler düz).
 * Skor alanının yeşil zemini bu şeridin arkasından en üste kadar çıkar.
 */
#detailAd {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 4;
    height: 50px;
}

.ad-thin {
    height: 50px;
    font-size: 14px;
}

.ad-thin .ad-scene {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: .5em;
    padding: 0 .9em;
}

.ad-3 { background: linear-gradient(120deg, #7f1d1d, #dc2626); }
.ad-4 { --off: -15s; background: linear-gradient(120deg, #2e1065, #7c3aed); }

.ad-thin .ad-btn {
    align-self: center;
    margin: 0 0 0 auto;
}

.ad-3 .ad-btn { color: #b91c1c; }
.ad-4 .ad-btn { color: #6d28d9; }

.ad-ring {
    display: inline-block;
    font-size: 1.2em;
    animation: adRing 1.2s ease-in-out infinite;
}

.ad-live {
    display: inline-flex;
    align-items: center;
    gap: .3em;
    font-size: .72em;
    font-weight: 800;
}

.ad-live::before {
    content: '';
    width: .55em;
    height: .55em;
    border-radius: 50%;
    background: white;
    animation: adPulse 1s ease-in-out infinite;
}

@keyframes adShow {
    0%      { opacity: 0; visibility: visible; }
    1%      { opacity: 1; }
    49%     { opacity: 1; visibility: visible; }
    50%, 100% { opacity: 0; visibility: hidden; }
}

@keyframes adS1 {
    0%      { opacity: 0; transform: translateX(-1.5em); }
    2.5%    { opacity: 1; transform: none; }
    15.5%   { opacity: 1; transform: none; }
    16.67%, 100% { opacity: 0; transform: translateX(1.5em); }
}

@keyframes adS2 {
    0%, 16.67% { opacity: 0; transform: translateY(.8em); }
    18.5%   { opacity: 1; transform: none; }
    32%     { opacity: 1; transform: none; }
    33.33%, 100% { opacity: 0; transform: translateX(1.5em); }
}

@keyframes adS3 {
    0%, 33.33% { opacity: 0; transform: scale(.92); }
    35%     { opacity: 1; transform: none; }
    50%, 100% { opacity: 1; transform: none; }
}

@keyframes adPop {
    0%      { opacity: 0; transform: scale(.4); }
    1.5%    { opacity: 1; transform: scale(1.12); }
    2.5%, 100% { opacity: 1; transform: scale(1); }
}

@keyframes adBar {
    0%, 17.5% { transform: scaleX(0); }
    23%, 100% { transform: scaleX(1); }
}

@keyframes adSpin {
    to { transform: rotate(360deg); }
}

@keyframes adRing {
    0%, 60%, 100% { transform: rotate(0); }
    70% { transform: rotate(-18deg); }
    80% { transform: rotate(18deg); }
    90% { transform: rotate(-10deg); }
}

@keyframes adPulse {
    50% { transform: scale(1.06); }
}

</style>
</head>

/*

 */
const TEAM_STYLES = [
    ['galatasaray', 'GS', '#a90432', '#fdb912'],
    ['fenerbahçe', 'FB', '#002d72', '#ffed00'],
    ['beşiktaş', 'BJK', '#111111', '#ffffff'],

    ['alanyaspor', 'ALA', '#f28c00', '#00843d'],

    ['amed', 'AMD', '#007a3d', '#e30613'],
    ['çorum', 'ÇOR', '#c8102e', '#111111']
];

const teamNames = new Map();     /* takım no → ad */
const leagueNames = new Map();   /* lig no → { ad, detay } */
const teamCache = new Map();

/* Adın sonundaki kulüp kısaltmaları atılır: "Gençlerbirliği S.K." → "Gençlerbirliği" */
function shortName(name) {
    return name.replace(/\s+(S\.?K\.?|F\.?K\.?|A\.?Ş\.?|SK|FK|JK|BK)$/i, '').trim();
}

/* Adından sabit bir renk: aynı takım hep aynı renkte */
function nameColor(name) {
    let hash = 0;
    for (const ch of name) hash = (hash * 31 + ch.codePointAt(0)) >>> 0;
    const hue = hash % 360;
    const light = 30 + (hash >> 9) % 25;
    return { bg: 'hsl(' + hue + ', 55%, ' + light + '%)', fg: '#ffffff' };
}

function teamInfo(id) {

    const name = teamNames.get(id) || 'Takım ' + id;
    const key = id + '|' + name;

    if (!teamCache.has(key)) {
        const plain = lower(name);
        const style = TEAM_STYLES.find(([word]) => plain.includes(word));
        const mid = shortName(name);
        const color = style ? { bg: style[2], fg: style[3] } : nameColor(name);

        teamCache.set(key, {
            name: name,
            mid: mid !== name ? mid : undefined,
            short: style ? style[1] : mid.replace(/[^\p{L}]/gu, '').slice(0, 3).toLocaleUpperCase('tr'),
            bg: color.bg,
            fg: color.fg
        });
    }
    return teamCache.get(key);
}

const LIVE_CODES = new Set(['1H', 'HT', '2H', 'ET', 'BT', 'P', 'SUSP', 'INT', 'LIVE', 'CANLI']);
const DONE_CODES = new Set(['FT', 'AET', 'PEN']);

/* Oynanmayacak maçların kısa yazısı (saat yerine) */
const OTHER_LABELS = { PST: 'ERT', CANC: 'İPT', ABD: 'YRD', AWD: 'HÜK', WO: 'HÜK' };

/* Olaylardan yalnızca goller ve kartlar (kaçan penaltı gol değildir) */
function rowEvents(list) {
    return list
        .filter(e => (e[3] === 'g' && e[4] !== 'kp') || e[3] === 'k')
        .map(([minute, extra, side, type, detail, player]) => ({
            side: side === 1 ? 'away' : 'home',
            type: type === 'g' ? 'goal' : detail === 's' ? 'yellow' : 'red',
            detail: detail,
            minute: minute,
            extra: extra,
            player: player
        }));
}

/*
 * Satır biçimi: sunucu/VERITABANI.md → "Canlı skor satırı"
 * "lig,hafta,ev,dep,saat,durum,ev gol,dep gol". Saat Türkiye saatidir (UTC+3).
 * Olaylar günün Özet dokümanından gelir.
 */
function rowToMatch(day, no, text, events) {

    const [league, week, home, away, time, state, hg, ag] = text.split(',');

    /* Durum: boş = başlamadı, sayı = oynanıyor (dakika), diğerleri API kodu */
    const playing = /^(\d+)(?:\+(\d+))?$/.exec(state || '');
    const code = !state ? 'NS' : playing ? 'CANLI' : state;

    const status = LIVE_CODES.has(code) ? 'live' : DONE_CODES.has(code) ? 'done' : 'upcoming';

    return {
        id: no,
        league: leagueInfo(Number(league)),
        week: week || '',
        date: new Date(day + 'T' + time.slice(0, 2) + ':' + time.slice(2, 4) + ':00+03:00'),
        home: teamInfo(Number(home)),
        away: teamInfo(Number(away)),
        code: code,
        status: status,
        minute: playing ? Number(playing[1]) : null,
        extra: playing && playing[2] ? Number(playing[2]) : null,
        score: hg === undefined || hg === '' ? null : [Number(hg), Number(ag)],
        events: status === 'upcoming' ? null : rowEvents(events || [])
    };
}

/* "9. Hafta", "3. Tur" ya da kupa turu (sunucunun kısa kodu) */
const ROUND_NAMES = {
    F: 'Final', YF: 'Yarı final', CF: 'Çeyrek final',
    S16: 'Son 16', S32: 'Son 32', S64: 'Son 64',
    G: 'Grup aşaması', PO: 'Play-off'
};

function roundText(match) {
    const week = match.week;
    if (!week) return '';
    if (/^\d+$/.test(week)) return week + '. Hafta';
    if (/^\d+T$/.test(week)) return week.slice(0, -1) + '. Tur';
    return ROUND_NAMES[week] || week;
}

/* Lig · hafta · tarih (hafta yoksa yazılmaz) */
function matchWhen(match) {
    return [match.league.name, roundText(match), formatDate(match.date)].filter(Boolean).join(' · ');
}

/* Canlı maçın dakikası: "63'", "45+2'", devre arasında "İY" */
function minuteText(match) {
    if (match.code === 'HT') return 'İY';
    if (!match.minute) return '';
    return match.minute + (match.extra ? '+' + match.extra : '') + "'";
}

/* Uygulamanın kullandığı maç listesi (gelen dokümanlardan kurulur) */
const MATCHES = [];
const MATCH_BY_ID = new Map();

const dayRows = new Map();       /* gün → Map(maç no → satır) */
const dayEvents = new Map();     /* gün → { maç no: olaylar } (Özet dokümanı) */
const matchDetails = new Map();  /* maç no → { stats, lineup } */

function rebuildMatches() {

    MATCHES.length = 0;
    MATCH_BY_ID.clear();

    dayRows.forEach((rows, day) => {
        const events = dayEvents.get(day) || {};
        rows.forEach((text, no) => {
            const match = rowToMatch(day, no, text, events[no]);
            const detail = matchDetails.get(match.id);
            if (detail) Object.assign(match, detail);
            if (match.status === 'live')
                applyFast(match);
            MATCHES.push(match);
            MATCH_BY_ID.set(match.id, match);
        });
    });
}

/* Lig kadro / istatistik veriyor mu? (bilinmiyorsa evet) */
function leagueHasDetail(id) {

/* =================================================
   BİLDİRİM (zil açılan maçlar)
   -------------------------------------------------
   İlk zil açılışında tarayıcı izin ister. İzin verilirse
   görünmez giriş (anonim) yapılır, cihaz kimliği alınır ve
   kayıtlı maçlar zil/{gizli kimlik} dokümanına yazılır.
   Sunucu bunu görüp cihazı maçların bildirimlerine abone eder.
================================================= */

let fbApp = null;
let bildirimHazir = null;
let zilTimer = null;
let izinSoruluyor = false;

const ZIL_SON_KEY = 'canliSkorZilSon';

function bildirimVar() {
    return !!BILDIRIM_ANAHTARI && !!db && 'Notification' in window &&
        'serviceWorker' in navigator && location.protocol === 'https:';
}

/* Zil açıldı / kapandı (kullanıcının dokunuşu içinde çağrılır: izin penceresi ancak böyle açılır) */
function zilDegisti(acildi) {

    if (!bildirimVar())
        return;

    if (Notification.permission === 'granted') {
        zilYazSonra();
        return;
    }

    if (acildi && Notification.permission === 'default' && !izinSoruluyor) {
        izinSoruluyor = true;
        Notification.requestPermission().then(izin => {
            izinSoruluyor = false;
            if (izin === 'granted')
                zilYazSonra();
        });
    }
}

/* Lig zilinde birçok maç birden değişir: 1 sn bekleyip tek seferde yazılır */
function zilYazSonra() {
    clearTimeout(zilTimer);
    zilTimer = setTimeout(zilYaz, 1000);
}

function bildirimHazirla() {

    if (!bildirimHazir) {
        bildirimHazir = (async () => {
            const base = 'https://www.gstatic.com/firebasejs/' + FIREBASE_SURUM + '/';
            const [authLib, msgLib] = await Promise.all([
                import(base + 'firebase-auth.js'),
                import(base + 'firebase-messaging.js')
            ]);

            const auth = authLib.getAuth(fbApp);
            await auth.authStateReady();
            const user = auth.currentUser || (await authLib.signInAnonymously(auth)).user;

            const worker = await navigator.serviceWorker.register('firebase-messaging-sw.js');
            const messaging = msgLib.getMessaging(fbApp);
            const token = await msgLib.getToken(messaging, {
                vapidKey: BILDIRIM_ANAHTARI,
                serviceWorkerRegistration: worker
            });

            /* Uygulama açıkken gelen bildirim de telefonun bildirimi olarak gösterilir */
            msgLib.onMessage(messaging, payload => {
                const note = payload.notification || {};
                const link = (payload.fcmOptions || {}).link || '';
                worker.showNotification(note.title || '', {
                    body: note.body || '',
                    icon: note.icon,
                    data: { link: link }
                });
            });

            return { uid: user.uid, token: token };
        })();
    }

    return bildirimHazir;
}

async function zilYaz() {
    try {
        const { uid, token } = await bildirimHazirla();
        const list = Array.from(savedIds).filter(id => /^\d+$/.test(id)).slice(-100);
        const key = token + '|' + list.join(',');

        /* Değişen bir şey yoksa yazılmaz */
        if (readJSON(ZIL_SON_KEY, '') === key)
            return;

        await fs.setDoc(fs.doc(db, 'zil', uid), {
            token: token,
            maclar: list,
            guncellendi: fs.serverTimestamp()
        });

        writeJSON(ZIL_SON_KEY, key);
    } catch (error) {
        bildirimHazir = null;
    }
}

/*
 * HIZLI KAYNAK (başka bir bilgisayardaki skor sunucusu)
 *   hizli/{no}   : onaylı skor "2-1"
 *   hizli_u/{no} : uyarı ("2-2" gol bekleniyor, "k" genel uyarı)
 * İki kaynaktan (API, hızlı) en son değişen skor gösterilir; ilk açılışta farklıysa hızlı.
 * Uyarı geldikten sonra skor değişirse uyarı gizlenir.
 */
const PLAYING_CODES = new Set(['CANLI', '1H', '2H', 'ET']);

const fastScores = new Map();   /* maç no → "2-1" */
const fastWarns = new Map();    /* maç no → "2-2" | "k" */
const scoreSources = new Map(); /* maç no → { api, apiAt, fast, fastAt } (değişme anları) */
const warnScores = new Map();   /* maç no → uyarı geldiğinde gösterilen skor */
const shownScores = new Map();  /* maç no → son gösterilen skor */
const quietUntil = new Map();   /* maç no → skor değiştikten sonra "k" uyarısının gösterilmeyeceği an (1 dk) */
const QUIET_TIME = 60000;
let fastUnsubs = [];

function sourceOf(id) {
    if (!scoreSources.has(id))
        scoreSources.set(id, { api: null, apiAt: 0, fast: null, fastAt: 0 });
    return scoreSources.get(id);
}

/* Canlı maçın skoru ve uyarısı hızlı kaynakla birleştirilir */
function applyFast(match) {

    const source = sourceOf(match.id);
    const api = match.score ? match.score.join('-') : null;

    if (source.api !== api) {
        source.apiAt = source.api === null ? 0 : Date.now();
        source.api = api;
    }

    const fast = fastScores.get(match.id);

    if (fast && source.fastAt >= source.apiAt)
        match.score = fast.split('-').map(Number);

    const shown = match.score ? match.score.join('-') : '';

    /* Skor değişince (gol ya da iptal) o maçta 1 dk "k" uyarısı gösterilmez; gol bekleniyor ("2-2") gösterilir */
    if (shownScores.has(match.id) && shownScores.get(match.id) !== shown) {
        quietUntil.set(match.id, Date.now() + QUIET_TIME);
        setTimeout(refreshViews, QUIET_TIME + 100);
    }
    shownScores.set(match.id, shown);

    const warn = fastWarns.get(match.id);

    if (warn === 'k' && (quietUntil.get(match.id) || 0) > Date.now())
        return;

    /* Uyarı yalnızca top oyundayken (devre arası, penaltılar, duran maçta yok) */
    if (warn && PLAYING_CODES.has(match.code)) {
        if (!warnScores.has(match.id))
            warnScores.set(match.id, shown);
        match.warn = warnScores.get(match.id) === shown;

        /* Gol bekleniyor ("2-2"): beklenen skoru önde olan takımın yanında kırmızı nokta */
        const expected = warn.split('-').map(Number);
        const now = shown ? shown.split('-').map(Number) : [0, 0];
        if (match.warn && expected.length === 2)
            match.warnSide = expected[0] > now[0] ? 'home' : expected[1] > now[1] ? 'away' : null;
    }
}

/* Dalın yalnızca değişen kayıtları işlenir. İlk gelen kayıtlar "yeni" sayılmaz (initial: true) */
function takeFast(target, onChange) {
    let initial = true;
    return snap => {
        const next = snap.val() || {};
        const changed = id => onChange(id, target.has(id) ? target.get(id) : null, initial);
        Array.from(target.keys()).forEach(id => {
            if (!(id in next)) {
                target.delete(id);
                changed(id);
            }
        });
        Object.entries(next).forEach(([id, value]) => {
            if (target.get(id) !== value) {
                target.set(id, value);
                changed(id);
            }
        });
        initial = false;
        refreshViews();
    };
}

function watchFast() {

    if (fastUnsubs.length || !rd)
        return;

    fastUnsubs = [
        /* İlk gelen skorlar "değişmiş" sayılmaz; sonradan gelenler o an değişmiştir */
        rt.onValue(rt.ref(rd, 'hizli'), takeFast(fastScores, (id, value, initial) => {
            const source = sourceOf(id);
            source.fastAt = initial ? 0 : Date.now();
            source.fast = value;
        }), () => {}),
        rt.onValue(rt.ref(rd, 'hizli_u'), takeFast(fastWarns, id => {
            warnScores.delete(id);
        }), () => {})
    ];
}

function unwatchFast() {
    fastUnsubs.forEach(off => off());
    fastUnsubs = [];
    fastScores.clear();
    fastWarns.clear();
    scoreSources.clear();
    warnScores.clear();
    shownScores.clear();
    quietUntil.clear();
}

/*
 * GOL: canlı maçın skoru bir öncekinden büyükse gol olmuştur.
 * İlk açılışta ve uygulama öne geldiğinde skorlar yalnızca not edilir.
 */
const lastScores = new Map();   /* maç no → [ev, dep] */
const goalUntil = new Map();    /* "maç no-home/away" → topun kalkacağı an */
const goalQueue = [];

function findGoals() {

    const seen = new Set();
    let scored = false;

    MATCHES.forEach(match => {

        if (match.status !== 'live')
            return;

        const id = match.id;
        const score = match.score || [0, 0];
        const before = lastScores.get(id);

        if (before) {
            ['home', 'away'].forEach((side, i) => {
                if (score[i] > before[i]) {
                    goalUntil.set(id + '-' + side, Date.now() + 10000);
                    scored = true;
                    /* Şerit ve ses yalnızca kayıtlı (zili açık) maçlarda */
                    if (isSaved(id))
                        goalQueue.push({ match: match, side: side });
                }
            });
        }

        lastScores.set(id, score);
        seen.add(id);
    });

    /* Biten maçlar listeden çıkar */
    lastScores.forEach((score, id) => {
        if (!seen.has(id)) lastScores.delete(id);
    });

    if (goalQueue.length)
        showNextGoal();

    /* Top 10 sn sonra kalksın */
    if (scored)
        setTimeout(refreshViews, 10100);
}

function hasBall(id, side) {
    return (goalUntil.get(id + '-' + side) || 0) > Date.now();
}

/*
 * Bildirim: birden fazla gol varsa her biri 2 saniye görünür, sonra
 * hemen diğeri gelir; son bildirim 4 saniye kalır. Her golde ses çalar.
 */
let toastBusy = false;

function showNextGoal() {

    if (toastBusy || !goalQueue.length)
        return;

    toastBusy = true;
    showGoal(goalQueue.shift());
}

function showGoal({ match, side }) {

    const toast = document.getElementById('goalToast');
    const box = toast.querySelector('.gt-match');

    box.textContent = '';
    if (minuteText(match))
        box.appendChild(document.createTextNode(minuteText(match) + ' · '));

    [['home', match.home.mid || match.home.name], ['away', match.away.mid || match.away.name]].forEach(([s, name], i) => {
        const el = document.createElement(s === side ? 'b' : 'span');
        el.textContent = name;
        if (i === 1)
            box.appendChild(document.createTextNode(' ' + match.score[0] + ' - ' + match.score[1] + ' '));
        box.appendChild(el);
    });

    toast.classList.add('show');
    goalSound();

    /* 2 sn sonra sırada gol varsa ona geç; yoksa 2 sn daha (toplam 4 sn) kal */
    setTimeout(() => {

        if (goalQueue.length) {
            showGoal(goalQueue.shift());
            return;
        }

        setTimeout(() => {
            if (goalQueue.length) {
                showGoal(goalQueue.shift());
                return;
            }
            toast.classList.remove('show');
            toastBusy = false;
        }, 2000);

    }, 2000);
}

/*
 * GOL SESİ: kodla üretilen kısa üç notalık ses (dosya indirilmez).
 * Tarayıcılar ses için önce bir dokunuş ister; ilk dokunuşta ses açılır.
 */
let audioCtx = null;

document.addEventListener('pointerdown', () => {
    try {
        if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended')
            audioCtx.resume();
    } catch (error) {}
}, { passive: true });

function goalSound() {

    if (!audioCtx || audioCtx.state !== 'running')
        return;

    const start = audioCtx.currentTime;

    [660, 880, 1320].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = start + i * 0.13;
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + (i === 2 ? 0.45 : 0.12));
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.5);
    });
}

/*
 * GÜNLER
 * Bugün ve dün canlı dinlenir (dün: gece yarısını geçen maçlar, maç sonu düzeltmeleri);
 * diğer günler bir kez okunur. Liste RTDB'den, olaylar (Özet) Firestore'dan.
 * Yarın ve sonrası için Özet okunmaz (maç oynanmadı).
 */
const days = new Map();   /* gün → { live, loaded, off: [kapatma fonksiyonları] } */

function isLiveDay(day) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    return day === TODAY || day === dayKey(yesterday);
}

function openDay(day) {

    if (!rd || days.has(day))
        return;

    const state = { live: isLiveDay(day), loaded: false, off: [] };
    days.set(day, state);

    const listRef = rt.ref(rd, 'gun/' + day);
    const summaryRef = fs.doc(db, 'ozet', day);
    const needSummary = day <= TODAY;

    const takeRows = snap => {
        dayRows.set(day, new Map(Object.entries(snap.val() || {})));
        state.loaded = true;
        refreshViews();
    };

    const failed = () => {
        state.loaded = true;
        refreshViews();
    };

    const takeEvents = snap => {
        const data = snap.exists() ? snap.data() : null;
        dayEvents.set(day, data && data.m ? JSON.parse(data.m) : {});
        refreshViews();
    };

    if (state.live) {
        state.off.push(rt.onValue(listRef, takeRows, failed));
        if (needSummary)
            state.off.push(fs.onSnapshot(summaryRef, takeEvents, () => {}));
    } else {
        rt.get(listRef).then(takeRows, failed);
        if (needSummary)
            fs.getDoc(summaryRef).then(takeEvents, () => {});
    }
}

/* Dinlenen günü bırakır (bir kez okunan günler hafızada kalır) */
function closeDay(day) {
    const state = days.get(day);
    if (!state || !state.live)
        return;
    state.off.forEach(off => off());
    days.delete(day);
}

/* Seçili gün değişince: önceki seçili gün bugün değilse bırakılır */
function watchDay(day) {

    if (!rd)
        return;

    if (watchedDay && watchedDay !== day && watchedDay !== TODAY)
        closeDay(watchedDay);

    watchedDay = day;
    openDay(day);
}

/* Seçili gün yükleniyor mu? */
function dayLoading() {
    const state = days.get(selectedDay);
    return !dataError && (!state || !state.loaded);
}

/* Maç sayfası açıkken istatistik ve kadro */
function watchDetail(match) {

    unwatchDetail();

    if (!db || !leagueHasDetail(match.league.id))
        return;

    const id = match.id;

    detailUnsub = fs.onSnapshot(fs.doc(db, 'maclar', id), snap => {

        });

}

function unwatchDetail() {

/* Uygulama arka plana geçince dinleme durur, öne gelince sürer */
document.addEventListener('visibilitychange', () => {

/* =================================================
   KAYITLI MAÇLAR
   -------------------------------------------------
   Veritabanı olmadığı için şimdilik telefonun kendi
   hafızasında (localStorage) tutulur; uygulama kapanıp
   açılınca da kalır. Üye girişi gelince hesaba taşınacak.
================================================= */

const SAVED_KEY = 'canliSkorKayitli';

function loadSaved() {
    try {
        return new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'));
    } catch (error) {
        return new Set();
    }
}

const savedIds = loadSaved();

function isSaved(id) {
    return savedIds.has(id);
}

function toggleSaved(id) {

    if (savedIds.has(id))
        savedIds.delete(id);
    else
        savedIds.add(id);

    try {
        localStorage.setItem(SAVED_KEY, JSON.stringify(Array.from(savedIds)));
    } catch (error) {}

    zilDegisti(savedIds.has(id));

    /* Aynı maçın bütün zilleri yerinde güncellenir (liste baştan çizilmez) */
    document.querySelectorAll('.score-bell[data-id="' + id + '"]').forEach(bell => {
        bell.classList.toggle('on', savedIds.has(id));
    });

    refreshLeagueBells();

    /* Kayıtlı Maçlarım sayfası açıksa satır hemen kalksın; değilse yenilensin */
    if (document.body.dataset.tab !== 'empty' || savedIds.has(id))
        renderSaved();
    else
        renderSavedLater();

    return savedIds.has(id);
}

const ANIM_CLASSES = ['a1-add', 'a1-remove', 'a3-add', 'a3-remove'];

/* Satır animasyonu: zil sallanır + renk süpürür (kaydedince yeşil, çıkarınca kırmızı) */
function flashRow(row, added) {
    const kind = added ? '-add' : '-remove';
    row.classList.remove(...ANIM_CLASSES);
    row.getBoundingClientRect();
    row.classList.add('a1' + kind, 'a3' + kind);
    setTimeout(() => row.classList.remove(...ANIM_CLASSES), 750);
}

/* Lig satırındaki zil: listedeki maçların hepsi kayıtlıysa sarı */
function refreshLeagueBells() {
    document.querySelectorAll('.league-bell').forEach(bell => {
        const ids = bell.dataset.ids.split(',');
        bell.classList.toggle('on', ids.every(id => savedIds.has(id)));
    });
}

function leagueBell(block, list) {

    const bell = document.createElement('button');
    bell.className = 'league-bell';
    bell.dataset.ids = list.map(m => m.id).join(',');
    bell.setAttribute('aria-label', 'Bu ligin maçlarını kaydet');
    bell.innerHTML = ICONS.bell;
    bell.classList.toggle('on', list.every(m => savedIds.has(m.id)));

    /* Hepsi kayıtlıysa hepsi çıkar; değilse eksikler eklenir */
    bell.addEventListener('click', event => {

        event.stopPropagation();

        const add = !list.every(m => savedIds.has(m.id));

        list.forEach(m => {
            if (savedIds.has(m.id) !== add)
                toggleSaved(m.id);
        });

        block.querySelectorAll('.score-row').forEach(row => flashRow(row, add));
    });

    return bell;
}

/* Kayıtlı sayfasında zil kapatılınca satır animasyondan sonra kalkar */
let savedTimer = null;

function renderSavedLater() {
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderSaved, 250);
}

/* Günün anahtarı: "2026-10-17" (telefonun saatine göre) */
function dayKey(date) {
    return date.getFullYear() + '-' +
        String(date.getMonth() + 1).padStart(2, '0') + '-' +
        String(date.getDate()).padStart(2, '0');
}

const TODAY = dayKey(new Date());

/* Düğmedeki yazı: Dün / Bugün / Yarın ya da "Cmt 17 Eki" */
function dayLabel(key) {

    const date = new Date(key + 'T12:00:00');
    const diff = Math.round((date - new Date(TODAY + 'T12:00:00')) / 86400000);

    if (diff === 0) return 'Bugün';
    if (diff === -1) return 'Dün';
    if (diff === 1) return 'Yarın';

    return formatDate(date);
}

let selectedDay = TODAY;

/* Düğmelerdeki günler, sırayla (oklar için) */
let dayKeys = [];

/* Gün düğmeleri: bugünün iki yanında 8 gün (takvimden seçilen gün de eklenir) */
function renderDays() {

    const box = document.getElementById('dayBox');
    box.textContent = '';

    /* Bugünün solunda ve sağında 8'er gün */
    const keys = new Set();
    for (let d = -8; d <= 8; d++) {
        const day = new Date(TODAY + 'T12:00:00');
        day.setDate(day.getDate() + d);
        keys.add(dayKey(day));
    }

    /* Takvimden maçsız bir gün seçildiyse o da listede olsun */
    keys.add(selectedDay);

    Array.from(keys).sort().forEach(key => {

        const button = document.createElement('button');
        /* Üstte gün adı, altta gün.ay */
        const date = new Date(key + 'T12:00:00');

        const name = document.createElement('span');
        name.className = 'day-name';
        name.textContent = key === TODAY ? 'Bugün' : DAYS[date.getDay()];

        const dm = document.createElement('span');
        dm.className = 'day-date';
        dm.textContent = String(date.getDate()).padStart(2, '0') + '.' +
            String(date.getMonth() + 1).padStart(2, '0');

        button.appendChild(name);
        /* Bugünün düğmesinde yalnızca "Bugün" yazar, tarih yok */
        if (key !== TODAY) button.appendChild(dm);
        button.dataset.day = key;
        button.classList.toggle('active', key === selectedDay);

        button.addEventListener('click', () => selectDay(key));

        box.appendChild(button);
    });

    /* Oklar: ilk ve son günde pasif */
    const list = Array.from(keys).sort();
    const index = list.indexOf(selectedDay);

    document.getElementById('dayPrev').disabled = index <= 0;
    document.getElementById('dayNext').disabled = index >= list.length - 1;

    dayKeys = list;

    /* Seçili gün soldan ikinci sırada: önceki gün, seçili gün, sonraki iki gün */
    const active = box.querySelector('button.active');

    if (active) {
        const step = active.offsetWidth + parseFloat(getComputedStyle(box).columnGap || 0);
        box.scrollLeft = active.offsetLeft - step;
    }
}

/*
 * Bir gün seçilir: "Canlı" ve arama kapanır, liste o güne döner.
 * (Gün düğmeleri ve takvim kullanır.)
 */
function selectDay(key) {

    selectedDay = key;
    searchInput.value = '';

    /* Bugünden başka bir güne geçince "Canlı" kapanır */
    if (key !== TODAY)
        liveState.liveOnly = false;

    watchDay(key);
    renderDays();
    renderLive();
}

/* Oklar: listede bir önceki / sonraki güne geçer */
['dayPrev', 'dayNext'].forEach((id, i) => {
    document.getElementById(id).addEventListener('click', () => {

        const next = dayKeys[dayKeys.indexOf(selectedDay) + (i === 0 ? -1 : 1)];

        if (next)
            selectDay(next);
    });
});

/* Tek satırlık maç: durum | ev sahibi | skor | deplasman */
function scoreRow(match, showDate, showLeague) {

    /* Satırın içinde zil düğmesi olduğu için satır <button> değil */
    const row = document.createElement('div');
    row.className = 'score-row' + (match.warn ? ' warn' : '');
    row.setAttribute('role', 'button');
    row.tabIndex = 0;

    /* Arama sonuçlarında maçın tarihi de yazar */
    if (showDate || showLeague) {
        const date = document.createElement('span');
        date.className = 'score-date';

        /* Zamana göre: lig adı koyu */
        if (showLeague) {
            date.innerHTML = '<b></b>';
            date.querySelector('b').textContent = match.league.name;
        }

        if (showDate) {
            date.appendChild(document.createTextNode(
                (showLeague ? ' · ' : '') + [dayLabel(dayKey(match.date)), roundText(match)].filter(Boolean).join(' · ')
            ));
        }

        row.appendChild(date);
    }

    const status = document.createElement('span');
    status.className = 'score-status' + (match.status === 'live' ? ' live' : '');
    status.textContent =
        match.status === 'live' ? minuteText(match) || 'CANLI' :
        match.status === 'done' ? 'MS' : OTHER_LABELS[match.code] || formatTime(match.date);

    const team = (side, index) => {

        const el = document.createElement('span');
        el.className = 'score-team ' + side;

        /* Önde / kazanan takım kalın; diğerleri ve oynanmamış maç normal */
        if (match.score && match.score[index] > match.score[1 - index])
            el.classList.add('won');

        /*
         * Tek satıra sığsın diye arma yok, sadece ad. Uzun adlar
         * şimdilik kısaltılır (mid); gerçek veride düzenlenecek.
         */
        const name = document.createElement('span');
        name.textContent = match[side].mid || match[side].name;
        el.appendChild(name);

        /* Gol bekleniyor: beklenen takımın dış tarafında yanıp sönen kırmızı nokta */
        if (match.warnSide === side) {
            const dot = document.createElement('i');
            dot.className = 'warn-dot';
            if (side === 'home')
                el.insertBefore(dot, name);
            else
                el.appendChild(dot);
        }

        /* Gol atan takımın yanında top (10 saniye): soldaki takımda solda, sağdakinde sağda */
        if (match.status === 'live' && hasBall(match.id, side)) {
            const ball = document.createElement('i');
            ball.className = 'goal-ball';
            ball.textContent = '⚽';
            if (side === 'home')
                el.insertBefore(ball, name);
            else
                el.appendChild(ball);
        }

        return el;
    };

    const mid = document.createElement('span');
    mid.className = 'score-mid' + (match.status === 'live' ? ' live' : '');
    mid.textContent = match.score ? match.score[0] + ' - ' + match.score[1] : '-';

    row.appendChild(status);
    row.appendChild(team('home', 0));
    row.appendChild(mid);
    row.appendChild(team('away', 1));

    /* Zil: maçı kaydeder / kayıttan çıkarır (sarı = kayıtlı) */
    const bell = document.createElement('button');
    bell.className = 'score-bell';
    bell.dataset.id = match.id;
    bell.setAttribute('aria-label', 'Maçı kaydet');
    bell.innerHTML = ICONS.bell;
    bell.classList.toggle('on', isSaved(match.id));

    bell.addEventListener('click', event => {

        event.stopPropagation();

        flashRow(row, toggleSaved(match.id));
    });

    row.appendChild(bell);

    row.addEventListener('click', () => openDetail(match.id));

    return row;
}

/*
 * ARAÇ SATIRI (Canlı Skor ve Oranlar'da aynı)
 * Her sayfanın kendi durumu vardır:
 *   popular  : (sadece Oranlar) en çok yorum alanlar
 *   liveOnly : "Canlı" açık; o an oynanan maçlar
 *   timeOrder: "Zaman" açık; ligler ayrılmadan saat sırasıyla
 *   leagues  : Ligler menüsünde işaretli ligler (boşsa hepsi)
 *   input    : arama kutusu (varsa); takım adına göre
 */
const TIME_ICON = '<svg class="time-arrow" viewBox="0 0 10 16" aria-hidden="true"><path d="M5 1.5v12M1.5 10l3.5 4 3.5-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>';

/* Açık olan Ligler menüsü (aynı anda tek menü açık olur) */
let openLeagueMenu = null;

function buildTools(row, state, options) {

    const tools = { state: state };

    const pill = (className, html, onClick) => {
        const button = document.createElement('button');
        button.className = className;
        button.innerHTML = html;
        button.addEventListener('click', onClick);
        row.appendChild(button);
        return button;
    };

    const changed = () => {
        tools.refresh();
        options.render();
    };

    if (options.popular) {
        tools.popularBtn = pill('tb-popular', 'Popüler', () => {
            state.popular = !state.popular;
            if (state.popular)
                state.timeOrder = false;
            changed();
        });
    }

    tools.liveBtn = pill('tb-live', 'Canlı', () => {
        state.liveOnly = !state.liveOnly;
        if (state.liveOnly && tools.input && options.liveClearsSearch)
            tools.input.value = '';
        changed();
    });

    /* Ligler: işaret kutulu menü */
    const filter = document.createElement('div');
    filter.className = 'league-filter';

    const leagueBtn = document.createElement('button');
    leagueBtn.className = 'tb-league';
    leagueBtn.innerHTML = 'Ligler <span class="caret">▾</span>';

    const menu = document.createElement('div');
    menu.className = 'league-menu';

    LEAGUES.forEach(league => {

        const label = document.createElement('label');
        const input = document.createElement('input');
        const name = document.createElement('span');
        const country = document.createElement('small');

        input.type = 'checkbox';
        name.textContent = league.name;
        country.textContent = league.country;

        input.addEventListener('change', () => {
            if (input.checked)
                state.leagues.add(league.id);
            else
                state.leagues.delete(league.id);
            changed();
        });

        label.appendChild(input);
        label.appendChild(name);
        label.appendChild(country);
        menu.appendChild(label);
    });

    leagueBtn.addEventListener('click', () => {

        if (openLeagueMenu === menu) {
            closeLeagueMenu();
            return;
        }

        hideLeagueMenu();
        menu.classList.add('open');
        openLeagueMenu = menu;

        /* Ekranın sağından taşarsa sola kayar */
        menu.style.left = '0';
        const over = menu.getBoundingClientRect().right -
            (document.documentElement.clientWidth - 8);
        if (over > 0)
            menu.style.left = -over + 'px';
        layerOpened('leagueMenu');
    });

    filter.appendChild(leagueBtn);
    filter.appendChild(menu);
    row.appendChild(filter);
    tools.leagueBtn = leagueBtn;

    tools.timeBtn = pill('tb-time', 'Zaman ' + TIME_ICON, () => {
        state.timeOrder = !state.timeOrder;
        if (state.timeOrder)
            state.popular = false;
        changed();
    });

    /* Arama kutusu (Oranlar'da ayrı satırda durur) */
    tools.input = options.input || null;

    if (options.search) {

        const box = document.createElement('label');
        box.className = 'search-box tool-search';
        box.innerHTML = SEARCH_ICON +
            '<input type="search" placeholder="Arama yap" size="9" autocomplete="off">';
        row.appendChild(box);
        tools.input = box.querySelector('input');
    }

    if (tools.input) {
        tools.input.addEventListener('input', () => {
            if (tools.input.value.trim() && options.liveClearsSearch)
                state.liveOnly = false;
            changed();
        });
    }

    tools.refresh = () => {
        if (tools.popularBtn)
            tools.popularBtn.classList.toggle('active', !!state.popular);
        tools.liveBtn.classList.toggle('active', state.liveOnly);
        tools.timeBtn.classList.toggle('active', state.timeOrder);
        leagueBtn.firstChild.textContent =
            state.leagues.size ? 'Ligler (' + state.leagues.size + ') ' : 'Ligler ';
        leagueBtn.classList.toggle('active', state.leagues.size > 0);
    };

    tools.refresh();

    return tools;
}

/* Arama ve Ligler süzgeci (Oranlar için) */
function filterMatches(list, tools) {

    const state = tools.state;
    const query = tools.input ? lower(tools.input.value.trim()) : '';

    return list.filter(m =>
        (!state.leagues.size || state.leagues.has(m.league.id)) &&
        (!state.liveOnly || m.status === 'live') &&
        (!query || lower(m.home.name).includes(query) || lower(m.away.name).includes(query))
    );
}

function hideLeagueMenu() {
    if (openLeagueMenu)
        openLeagueMenu.classList.remove('open');
    openLeagueMenu = null;
}

function closeLeagueMenu() {
    hideLeagueMenu();
    layerClosed('leagueMenu');
}

const liveState = { liveOnly: false, timeOrder: false, leagues: new Set() };
const liveTools = document.getElementById('liveTools');

const liveToolbar = buildTools(document.getElementById('toolRow'), liveState, {
    search: true,
    liveClearsSearch: true,
    render: () => renderLive()
});

const searchInput = liveToolbar.input;

/* Türkçe harflere duyarlı küçük harf */
function lower(text) {
    return text.toLocaleLowerCase('tr');
}

/* Canlı Skor: lig lig, tek satır */
/* Seçili spor: 'football' ya da 'basketball' (basketbol şimdilik boş) */
let sport = 'football';

document.querySelectorAll('.sport-btn').forEach(button => {
    button.addEventListener('click', () => {
        sport = button.dataset.sport;
        document.querySelectorAll('.sport-btn').forEach(b => {
            b.classList.toggle('active', b === button);
        });
        renderLive();
    });
});

function renderLive() {

    const box = document.getElementById('liveList');
    box.textContent = '';

    if (sport === 'basketball') {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = 'Basketbol maçları yakında burada olacak.';
        box.appendChild(empty);
        return;
    }

    const query = lower(searchInput.value.trim());
    const searching = query.length > 0;

    const liveOnly = liveState.liveOnly;
    const timeOrder = liveState.timeOrder;
    const leagueSelected = liveState.leagues;

    /* Aramada gün satırı soluklaşır; "Canlı" açıkken soluklaşmaz */
    liveTools.classList.toggle('no-day', searching);
    liveToolbar.refresh();

    let any = false;

    /* Zamana göre: ligler ayrılmaz, tek kutuda saat sırasıyla */
    const groups = timeOrder ? [null] : LEAGUES;

    groups.forEach(league => {

        if (league && leagueSelected.size && !leagueSelected.has(league.id))
            return;

        let list = MATCHES.filter(m => timeOrder || m.league === league);

        if (liveOnly)
            list = list.filter(m => m.status === 'live');

        if (searching) {
            list = list.filter(m =>
                lower(m.home.name).includes(query) || lower(m.away.name).includes(query)
            );
        }

        if (timeOrder && leagueSelected.size)
            list = list.filter(m => leagueSelected.has(m.league.id));

        if (!liveOnly && !searching)
            list = list.filter(m => dayKey(m.date) === selectedDay);

        /* Aramada en yeni maç üstte, diğerlerinde saat sırasıyla */
        list.sort((a, b) => searching ? b.date - a.date : a.date - b.date);

        if (!list.length)
            return;

        any = true;

        const block = document.createElement('div');
        block.className = 'league-block';

        /* Zamana göre: başlık yok, her satırın üstünde ligi yazar */
        if (!league) {
            list.forEach(m => block.appendChild(scoreRow(m, searching, true)));
            box.appendChild(block);
            return;
        }

        const head = document.createElement('div');
        head.className = 'league-head';
        head.innerHTML = league.flag + '<span></span>';
        head.querySelector('span').textContent = league.country + ' · ';
        head.appendChild(document.createTextNode(league.name));

        head.appendChild(leagueBell(block, list));

        block.appendChild(head);
        list.forEach(m => block.appendChild(scoreRow(m, searching)));
        box.appendChild(block);
    });

    const waiting = !liveOnly && !searching && dayLoading();

    if (!any) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            dataError ? 'Bağlantı kurulamadı. İnternetini kontrol edip sayfayı yenile.' :
            waiting ? 'Maçlar yükleniyor…' :
            searching ? '"' + searchInput.value.trim() + '" için maç bulunamadı.' :
            liveOnly ? 'Şu an oynanan maç yok.' : 'Bu gün maç yok.';
        box.appendChild(empty);
    }
}

const MY_ORDER = ['saved', 'coupons'];
const myMain = document.getElementById('myMain');
const myTrack = document.getElementById('myTrack');

let myPage = 'saved';
let myTrackTimer = null;
let mySwipe = null;

function setMyPage(name) {

    myPage = name;

    document.querySelectorAll('#myTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.my === name);
    });

    myTrack.querySelectorAll('.my-page').forEach(page => {
        page.classList.toggle('current', page.dataset.my === name);
    });

    myTrack.classList.add('both');
    myTrack.style.setProperty('--page', MY_ORDER.indexOf(name));

    clearTimeout(myTrackTimer);
    myTrackTimer = setTimeout(() => {
        if (!mySwipe)
            myTrack.classList.remove('both');
    }, 320);
}

document.querySelectorAll('#myTabs button').forEach(button => {
    button.addEventListener('click', () => setMyPage(button.dataset.my));
});

/* Parmakla yana kaydırma (ana sayfadakiyle aynı his) */
myMain.addEventListener('touchstart', event => {

    mySwipe = event.touches.length === 1 ? {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    } : null;

}, { passive: true });

myMain.addEventListener('touchmove', event => {

    if (!mySwipe)
        return;

    const dx = event.touches[0].clientX - mySwipe.x;
    const dy = event.touches[0].clientY - mySwipe.y;

    if (mySwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        mySwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (mySwipe.horizontal) {
            myMain.classList.add('swiping');
            myTrack.classList.add('both');
        }
    }

    if (!mySwipe.horizontal)
        return;

    mySwipe.dx = dx;

    const index = MY_ORDER.indexOf(myPage);
    const atEdge = (index === 0 && dx > 0) || (index === MY_ORDER.length - 1 && dx < 0);

    myTrack.style.setProperty('--swipe-x', (atEdge ? dx * 0.25 : dx) + 'px');

}, { passive: true });

function endMySwipe() {

    if (!mySwipe)
        return;

    const swipe = mySwipe;

    mySwipe = null;
    myMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = myMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = MY_ORDER[MY_ORDER.indexOf(myPage) + (swipe.dx < 0 ? 1 : -1)];

    myTrack.style.setProperty('--swipe-x', '0px');
    setMyPage(enough && next ? next : myPage);
}

myMain.addEventListener('touchend', endMySwipe, { passive: true });
myMain.addEventListener('touchcancel', endMySwipe, { passive: true });

/*
 * KUPON
 * Her maçtan bir seçim (1 / X / 2). Aynı maçta başka orana basınca
 * seçim değişir, seçili olana tekrar basınca çıkar.
 * Yeni kupon ve kaydedilen kuponlar telefonun hafızasında tutulur.
 */
const COUPON_KEY = 'canliSkorKupon';
const COUPONS_KEY = 'canliSkorKuponlar';
const PICK_NAMES = {
    home: 'MS 1', draw: 'MS X', away: 'MS 2',
    under: 'Gol 2,5 Alt', over: 'Gol 2,5 Üst',
    cornerUnder: 'Korner 9,5 Alt', cornerOver: 'Korner 9,5 Üst',
    cardUnder: 'Kart 4,5 Alt', cardOver: 'Kart 4,5 Üst'
};

function readJSON(key, fallback) {
    try {
        return JSON.parse(localStorage.getItem(key)) || fallback;
    } catch (error) {
        return fallback;
    }
}

function writeJSON(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {}
}

/* Yeni kupon: maç id → seçim */
const couponPicks = new Map(readJSON(COUPON_KEY, []));

/* Kaydedilen kuponlar: en yenisi başta */
let savedCoupons = readJSON(COUPONS_KEY, []);

function pickOdd(id, key) {
    return parseFloat(MATCH_BY_ID.get(id).odds[key]);
}

/* Maçı ve oranı gelmiş seçimler (veri gelene kadar diğerleri gösterilmez) */
function validPicks(picks) {
    return picks.filter(([id, key]) => {
        const match = MATCH_BY_ID.get(id);
        return match && match.odds && match.odds[key];
    });
}

function picksTotal(picks) {
    return picks.reduce((total, [id, key]) => total * pickOdd(id, key), 1).toFixed(2);
}

function togglePick(id, key) {

    if (couponPicks.get(id) === key)
        couponPicks.delete(id);
    else
        couponPicks.set(id, key);

    couponChanged();
}

function couponChanged() {

    writeJSON(COUPON_KEY, Array.from(couponPicks));

    document.querySelectorAll('.odd.pickable').forEach(box => {
        box.classList.toggle('picked', couponPicks.get(box.dataset.match) === box.dataset.key);
    });

    renderCouponBall();
    renderCoupons();
}

function renderCouponBall() {

    const ball = document.getElementById('couponBall');
    const picks = validPicks(Array.from(couponPicks));

    ball.classList.toggle('show', picks.length > 0);

    if (!picks.length)
        return;

    ball.querySelector('.cb-count').textContent = picks.length + ' maç';
    ball.querySelector('.cb-total').textContent = picksTotal(picks);
}

/* Kupondaki bir satır: maç, seçim, oran (yeni kuponda çıkarma düğmesi) */
function couponPickRow([id, key], removable) {

    const match = MATCH_BY_ID.get(id);

    const row = document.createElement('div');
    row.className = 'coupon-pick' + (removable ? ' removable' : '');

    const info = document.createElement('div');
    info.innerHTML = '<small></small><span class="cp-teams"></span>';
    info.querySelector('small').textContent =
        match.league.name + ' · ' + formatDate(match.date) + ' ' + formatTime(match.date);
    info.querySelector('.cp-teams').textContent = match.home.name + ' - ' + match.away.name;

    const choice = document.createElement('span');
    choice.className = 'cp-choice';
    choice.textContent = PICK_NAMES[key];

    const odd = document.createElement('span');
    odd.className = 'cp-odd';
    odd.textContent = match.odds[key];

    row.appendChild(info);
    row.appendChild(choice);
    row.appendChild(odd);

    if (removable) {
        const remove = document.createElement('button');
        remove.className = 'cp-remove';
        remove.setAttribute('aria-label', 'Kupondan çıkar');
        remove.textContent = '✕';
        remove.addEventListener('click', () => {
            couponPicks.delete(id);
            couponChanged();
        });
        row.appendChild(remove);
    }

    return row;
}

function couponTotalRow(picks) {
    const total = document.createElement('div');
    total.className = 'coupon-total';
    total.innerHTML = '<span>Toplam oran</span><span></span>';
    total.lastChild.textContent = picksTotal(picks);
    return total;
}

function saveCoupon() {

    const picks = Array.from(couponPicks);

    if (!picks.length)
        return;

    savedCoupons.unshift({ id: Date.now(), date: Date.now(), picks: picks });
    writeJSON(COUPONS_KEY, savedCoupons);

    couponPicks.clear();
    couponChanged();
}

function renderCoupons() {

    const box = document.getElementById('myCoupons');
    box.textContent = '';

    const picks = validPicks(Array.from(couponPicks));

    /* Yeni kupon (henüz kaydedilmemiş) */
    if (picks.length) {

        const card = document.createElement('div');
        card.className = 'coupon-card new';

        const head = document.createElement('div');
        head.className = 'coupon-head';
        head.innerHTML = '<span>Yeni kupon</span><span></span>';
        head.lastChild.textContent = picks.length + ' maç';
        card.appendChild(head);

        picks.forEach(pick => card.appendChild(couponPickRow(pick, true)));
        card.appendChild(couponTotalRow(picks));

        /* Temizle | Kuponu kaydet */
        const actions = document.createElement('div');
        actions.className = 'coupon-actions';

        const clear = document.createElement('button');
        clear.className = 'coupon-clear';
        clear.textContent = 'Temizle';
        clear.addEventListener('click', () => {
            couponPicks.clear();
            couponChanged();
        });

        const save = document.createElement('button');
        save.className = 'coupon-save';
        save.textContent = 'Kuponu kaydet';
        save.addEventListener('click', saveCoupon);

        actions.appendChild(clear);
        actions.appendChild(save);
        card.appendChild(actions);

        box.appendChild(card);
    }

    /* Kaydedilen kuponlar */
    const list = savedCoupons
        .map(c => ({ ...c, picks: validPicks(c.picks) }))
        .filter(c => c.picks.length);

    if (list.length) {

        const title = document.createElement('div');
        title.className = 'coupon-section';
        title.textContent = 'KAYDEDİLEN KUPONLAR';
        box.appendChild(title);

        list.forEach(coupon => {

            const card = document.createElement('div');
            card.className = 'coupon-card';

            const head = document.createElement('div');
            head.className = 'coupon-head';
            head.innerHTML = '<span></span><button class="coupon-delete">Sil</button>';
            head.firstChild.textContent = formatDate(new Date(coupon.date)) + ' · ' + coupon.picks.length + ' maç';
            head.lastChild.addEventListener('click', () => {
                savedCoupons = savedCoupons.filter(c => c.id !== coupon.id);
                writeJSON(COUPONS_KEY, savedCoupons);
                renderCoupons();
            });
            card.appendChild(head);

            coupon.picks.forEach(pick => card.appendChild(couponPickRow(pick, false)));
            card.appendChild(couponTotalRow(coupon.picks));

            box.appendChild(card);
        });
    }

    if (!picks.length && !list.length) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = 'Kuponun yok. Oranlar\'da bir orana basınca kupon oluşur.';
        box.appendChild(empty);
    }
}

/*
 * Oranlar: oranı gelmiş, bitmemiş maçlar, 1 / X / 2 ile.
 * Araç satırı: Popüler, Canlı, Ligler, Zaman; arama altta.
 *   Popüler : en çok yorum alan maçlar
 *   Zaman   : ligler ayrılmadan saat sırasıyla
 *   ikisi de kapalı: lig lig, hafta hafta
 */
const oddsState = { popular: true, liveOnly: false, timeOrder: false, leagues: new Set() };
const oddsSearchInput = document.getElementById('oddsSearchInput');

const oddsToolbar = buildTools(document.getElementById('oddsTools'), oddsState, {
    popular: true,
    input: oddsSearchInput,
    render: () => renderOdds()
});

function renderOdds() {

    const box = document.getElementById('oddsList');
    box.textContent = '';

    const withOdds = MATCHES.filter(m => m.odds && m.status !== 'done');

    const list = filterMatches(withOdds, oddsToolbar).sort((a, b) => a.date - b.date);

    if (!list.length) {
        const query = oddsSearchInput.value.trim();
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            !withOdds.length ? 'Tahmini oranlar yakında burada olacak.' :
            query ? '"' + query + '" için maç bulunamadı.' :
            oddsState.liveOnly ? 'Şu an oynanan maç yok.' : 'Maç yok.';
        box.appendChild(empty);
        return;
    }

    const card = m => box.appendChild(oddsCard(m));

    if (oddsState.popular) {
        list.slice().sort((a, b) => (b.comments || 0) - (a.comments || 0)).slice(0, 20).forEach(card);
        return;
    }

    if (oddsState.timeOrder) {
        list.forEach(card);
        return;
    }

    LEAGUES.forEach(league => {

        const own = list.filter(m => m.league === league);
        const rounds = Array.from(new Set(own.map(roundText)));

        rounds.forEach(round => {
            box.appendChild(weekTitle(
                [league.name, round].filter(Boolean).join(' · ').toLocaleUpperCase('tr') + ' ORANLARI'
            ));
            own.filter(m => roundText(m) === round).forEach(card);
        });
    });
}

/* Analizdeki liglerin bayrakları (kodla çizilmiş); Avrupa kupaları için Avrupa bayrağı */
const AN_FLAGS = (() => {

    const h3 = (a, b, c) => svg('<rect width="30" height="20" fill="' + c + '"/><rect width="30" height="13.34" fill="' + b + '"/><rect width="30" height="6.67" fill="' + a + '"/>');
