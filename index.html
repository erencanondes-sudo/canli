<style>

* {
    box-sizing: border-box;

    /* Dokunulan yerde telefonun mavi vurgusu çıkmasın */
    -webkit-tap-highlight-color: transparent;
}

/*
 * İÇERİK GENİŞLİĞİ
 * Ana sayfadaki kartlar ve maç sayfası aynı genişliği kullanır.
 */
:root {
    --content-width: 640px;
    --side-gap: max(16px, calc((100% - var(--content-width)) / 2));
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f5f7;
    color: #222;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

/* -----------------------------
   ANA SAYFA
----------------------------- */

#homePage {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;
}

#homeMain {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;

    /*
     * Kaydırma çubuğunun yeri hep ayrılır: içerik kısa ya da uzun
     * olsun genişlik değişmez, üstteki alan büyüyüp küçülmez.
     */
    scrollbar-gutter: stable;

    /* Yukarı aşağı kaydırma tarayıcıda, sağa sola kaydırma bizde. */
    touch-action: pan-y;

    /* Alttaki boşluk: son kart alttaki düğmenin arkasında kalmasın. */
    padding: 12px var(--side-gap) 180px;
}

/*
 * ÜSTTEKİ BAŞLIK ALANI
 * İnşaat uygulamasındaki resmin yerinde; resim yerine kodla
 * çizilmiş bir saha (hiçbir şey indirilmez).
 */
#homeBanner,
.banner {
    position: relative;
    aspect-ratio: 3.4 / 1;
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    color: white;
    background:
        radial-gradient(circle at 50% 50%, transparent 17%, rgba(255,255,255,.35) 17.4%, transparent 18%),
        linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,.35) 49.8%, rgba(255,255,255,.35) 50.2%, transparent 50.2%),
        repeating-linear-gradient(90deg, #2f7d43 0 10%, #2a7340 10% 20%);
}

/* Koyu perde: yazı okunsun */
#homeBanner::after,
.banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 30, 20, .05), rgba(10, 30, 20, .55));
}

.banner-text {
    position: absolute;
    left: 1em;
    bottom: .9em;
    z-index: 1;
}

.banner-title {
    font-size: 1.7em;
    font-weight: 800;
    letter-spacing: -.01em;
}

.banner-sub {
    margin-top: .15em;
    font-size: .9em;
    font-weight: 600;
    opacity: .9;
}

#homeTitleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

/*
 * ÜST DÜĞMELER: Canlı Skor / Forum / Analiz / Oranlar
 * Satırın genişliğine yayılırlar; yazı boyutu ekranla orantılı.
 */
#homeModeBox {
    display: flex;
    flex: 1;
    gap: .35em;
    min-width: 0;
    margin-right: .35em;
    font-size: min(16px, 3.4vw);
}

#homeModeBox button {
    flex: 1 1 auto;
    min-width: 0;
    padding: .55em .3em;
    border: 1px solid #d5d8de;
    border-radius: 10px;
    background: white;
    font-size: inherit;
    font-weight: 800;
    color: #444;
    white-space: nowrap;
}

#homeModeBox button.active {
    border-color: #1a73e8;
    background: #eef4ff;
    color: #1a73e8;
}

/*
 * GÜN SEÇİMİ (sadece Canlı Skor sayfasında)
 * Sekmelerin altında yana kaydırılan gün düğmeleri.
 */
/* Forum sıralama satırı */
#forumSort {
    display: flex;
    gap: .4em;
    margin: 0 0 10px;
    font-size: 13px;
}

#forumSort button {
    padding: .45em 1em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

#forumSort button.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

#dayRow {
    display: flex;
    align-items: center;
    gap: .5em;
    margin: 0 0 8px;
}

#dayBox {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    gap: .4em;
    overflow-x: auto;
    scrollbar-width: none;
    font-size: 12px;
}

#dayBox::-webkit-scrollbar {
    display: none;
}

/* İki satır: üstte gün (Cmt), altta tarih (17.10) */
#dayBox button {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    min-width: 3.6em;
    padding: .3em .6em;
    border: 1px solid #d5d8de;
    border-radius: .9em;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

#dayBox button.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/* "Canlı" ya da arama açıkken gün seçimi kullanılmaz: soluk görünür */
#liveTools.no-day #dayBox {
    opacity: .45;
}

/* Gün düğmelerinin iki yanındaki oklar: önceki / sonraki gün */
.day-arrow {
    flex: none;
    width: 1em;
    height: 1.4em;
    padding: 0;
    background: none;
    color: #1d2340;
    font-size: 22px;
    line-height: 1;
}

.day-arrow:disabled {
    opacity: .25;
}

/* Sağdaki takvim düğmesi */
#calendarBtn {
    position: relative;
    flex: none;
    width: 2.6em;
    height: 2.6em;
    padding: 0;
    border: 1px solid #d5d8de;
    border-radius: 50%;
    background: white;
    color: #1d2340;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
}

#calendarBtn svg {
    width: 1.35em;
    height: 1.35em;
}

/* Tarayıcının tarih seçicisi düğmenin altında, görünmez durur */
#calendarInput {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
}

/* İkinci satır: Canlı | Ligler | Arama */
#toolRow {
    display: flex;
    align-items: center;
    gap: .3em;
    margin: 0 0 10px;

    /* Dar ekranda yazılar biraz küçülür, dört öğe tek satıra sığar */
    font-size: min(12.5px, 3.3vw);
}

#liveOnlyBtn,
#leagueFilterBtn,
#timeOrderBtn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .4em;
    height: 2.5em;
    padding: 0 .75em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    font-size: inherit;
    font-weight: 700;
    color: #555a66;
    white-space: nowrap;
}

/* Canlı düğmesindeki kırmızı nokta */
#liveOnlyBtn::before {
    content: '';
    width: .5em;
    height: .5em;
    border-radius: 50%;
    background: #d93025;
}

#timeOrderBtn.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

#liveOnlyBtn.active {
    border-color: #d93025;
    background: #d93025;
    color: white;
}

#liveOnlyBtn.active::before {
    background: white;
    animation: blink 1.2s ease-in-out infinite;
}

#leagueFilterBtn.active {
    border-color: #1d2340;
    background: #1d2340;
    color: white;
}

/* Canlı ve Ligler, Zaman düğmesinden kalan yeri alıp biraz geniştir */
#liveOnlyBtn,
#leagueFilterBtn {
    padding: 0 1.25em;
}

#leagueFilterBtn .caret {
    font-size: .85em;
}

/* Zaman: uzun aşağı ok */
#timeOrderBtn .time-arrow {
    width: .5em;
    height: 1.05em;
    margin-left: .2em;
}

/* Ligler menüsü: işaret kutulu liste */
#leagueFilterBox {
    position: relative;
    flex: none;
}

#leagueMenu {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + .35em);
    z-index: 6;
    min-width: 13em;
    padding: .3em 0;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,.22);
}

#leagueMenu.open {
    display: block;
}

#leagueMenu label {
    display: flex;
    align-items: center;
    gap: .6em;
    padding: .65em .9em;
    font-size: 14px;
    font-weight: 600;
    color: #1d2340;
    white-space: nowrap;
    cursor: pointer;
}

#leagueMenu label + label {
    border-top: 1px solid #f0f1f4;
}

#leagueMenu input {
    width: 1.1em;
    height: 1.1em;
    margin: 0;
    accent-color: #1d2340;
}

#leagueMenu small {
    margin-left: auto;
    font-weight: 600;
    color: #8a8f9c;
}

/* Arama kutusu: satırın kalanını doldurur */
#forumSearchBox {
    margin: 0 0 10px;
}

#searchBox {
    flex: 1 1 6em;
    gap: .25em;
    padding: 0 .55em;
}

/* Dar ekranda büyüteç gizlenir; "Arama yap" yazısı sığsın */
@media (max-width: 380px) {
    #searchBox svg {
        display: none;
    }

    #searchBox {
        padding: 0 .4em;
    }

    #toolRow {
        gap: .25em;
    }
}

/*
 * Canlı Skor satırındaki arama: büyüteç ve yazı kutunun ortasında.
 * Kutu yazı kadar geniştir; yazdıkça büyür (en fazla kutu kadar).
 */
#searchBox {
    justify-content: center;
}

/* Büyüteç yer kaplamış sayılmaz: "Arama yap" yazısı kutunun ortasına yakın durur */
#searchBox svg {
    margin-left: -.6em;
}

#searchBox input {
    flex: 0 1 auto;
    width: auto;
    font-size: 1em;
    field-sizing: content;
}

.search-box {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: .35em;
    height: 2.5em;
    padding: 0 .7em;
    border: 1px solid #d5d8de;
    border-radius: 999px;
    background: white;
    color: #8a8f9c;
}

.search-box:focus-within {
    border-color: #1a73e8;
}

.search-box svg {
    flex: none;
    width: 1.2em;
    height: 1.2em;
}

.search-box input {
    flex: 1;
    min-width: 0;
    border: 0;

/* Sabit tohumlu rastgele sayı üreticisi (her açılışta aynı veri) */
function seededRandom(seed) {
    return function () {
        seed |= 0;
        seed = seed + 0x6D2B79F5 | 0;
        let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const rand = seededRandom(20262027);

function randInt(min, max) {
    return min + Math.floor(rand() * (max - min + 1));
}

/* Ortalaması lambda olan rastgele gol sayısı */
function poisson(lambda) {
    const limit = Math.exp(-lambda);
    let k = 0;
    let p = 1;

    do {
        k++;
        p *= rand();
    } while (p > limit);

    return k - 1;
}

const PLAYED_WEEKS = 6;
const CURRENT_WEEK = 7;

/*

/* Kazanma / beraberlik / kaybetme olasılığından basit oranlar */
function makeOdds(home, away) {

    const diff = (home.power + 4 - away.power) / 25;

    let pHome = 0.45 + diff * 0.5;
    let pAway = 0.30 - diff * 0.45;

    pHome = Math.min(0.85, Math.max(0.08, pHome));
    pAway = Math.min(0.80, Math.max(0.06, pAway));

    let pDraw = Math.max(0.12, 1 - pHome - pAway);

    const sum = pHome + pDraw + pAway;
    const margin = 1.07;

    const odd = p => Math.max(1.05, (1 / (p / sum * margin))).toFixed(2);

    const over = 0.5 + (home.power + away.power - 150) / 120;

    return {
        home: odd(pHome),
        draw: odd(pDraw),
        away: odd(pAway),
        over: odd(Math.min(0.8, Math.max(0.3, over))),
        under: odd(Math.min(0.7, Math.max(0.2, 1 - over)))
    };
}

/* Bir maçın olayları: goller (dakikalarıyla) ve sarı / kırmızı kartlar */
function makeEvents(homeGoals, awayGoals, maxMinute) {

    const events = [];

    const add = (side, type, count) => {
        for (let i = 0; i < count; i++)
            events.push({ side: side, type: type, minute: randInt(2, maxMinute) });
    };

    add('home', 'goal', homeGoals);
    add('away', 'goal', awayGoals);
    add('home', 'yellow', randInt(0, 3));
    add('away', 'yellow', randInt(0, 3));

    if (rand() < 0.08)
        add(rand() < 0.5 ? 'home' : 'away', 'red', 1);

    return events.sort((a, b) => a.minute - b.minute);
}

/* Maç istatistikleri (gollerle uyumlu) */
function makeStats(home, away, homeGoals, awayGoals, ratio) {

    const possession = Math.round(
        Math.min(72, Math.max(28, 50 + (home.power - away.power) * 0.8 + randInt(-6, 6)))
    );

    const side = (goals, strength) => {
        const shots = Math.round((randInt(6, 12) + strength / 12) * ratio);
        const onTarget = Math.max(goals, Math.round(shots * (0.3 + rand() * 0.2)));
        return {
            shots: Math.max(shots, onTarget),
            onTarget: onTarget,
            corners: Math.round(randInt(2, 8) * ratio),
            fouls: Math.round(randInt(7, 14) * ratio)
        };
    };

    return {
        possession: [possession, 100 - possession],
        home: side(homeGoals, home.power),
        away: side(awayGoals, away.power)
    };
}

/* Fikstür: "daire yöntemi" ile her hafta herkes bir maç yapar. */
function makeMatches(league) {

    const TEAMS = league.teams;
    const ids = TEAMS.map((team, index) => index);
    const matches = [];

    for (let week = 1; week <= CURRENT_WEEK; week++) {

        for (let i = 0; i < ids.length / 2; i++) {

            let a = ids[i];
            let b = ids[ids.length - 1 - i];

            /* Ev sahipliği haftadan haftaya değişsin */
            if ((week + i) % 2 === 0)
                [a, b] = [b, a];

            const home = TEAMS[a];
            const away = TEAMS[b];

            const [dayOffset, time] = league.kickoffs[i];
            const date = new Date(league.weekDates[week - 1] + 'T' + time + ':00+03:00');
            date.setDate(date.getDate() + dayOffset);

            const match = {
                id: league.id + '-' + week + '-' + (i + 1),
                league: league,
                week: week,
                date: date,
                home: home,
                away: away,
                odds: makeOdds(home, away),
                comments: randInt(1, 40),
                likes: randInt(1, 60),
                dislikes: randInt(0, 25)
            };

            const liveMinute = week === CURRENT_WEEK ? league.live[i] : undefined;
            const doneToday = week === CURRENT_WEEK && league.todayDone.includes(i);
            const laterToday = week === CURRENT_WEEK && league.todayLater.includes(i);

            /* Bugün biraz sonra başlayacak (gün bitmeden) */
            if (laterToday) {
                const start = new Date(Date.now() + 45 * 60000);
                start.setMinutes(Math.ceil(start.getMinutes() / 5) * 5, 0, 0);
                const endOfDay = new Date();
                endOfDay.setHours(23, 55, 0, 0);
                match.date = start > endOfDay ? endOfDay : start;
            }

            if (week <= PLAYED_WEEKS || liveMinute || doneToday) {

                const minute = liveMinute || 90;
                const ratio = minute / 90;

                const homeGoals = poisson((1.35 + (home.power - away.power) / 30) * ratio);
                const awayGoals = poisson((1.05 + (away.power - home.power) / 30) * ratio);

                match.status = liveMinute ? 'live' : 'done';

                /* Canlı maç "şu an" oynanıyor: başlama saati dakikası kadar önce */
                if (liveMinute) {
                    match.date = new Date(Date.now() - (liveMinute + 15) * 60000);
                    match.date.setSeconds(0, 0);
                }

                /* Bugün erken oynanmış: yaklaşık 3 saat önce başlamış */
                if (doneToday) {
                    match.date = new Date(Date.now() - 3 * 3600000);
                    match.date.setMinutes(Math.floor(match.date.getMinutes() / 15) * 15, 0, 0);

                    if (dayKey(match.date) !== dayKey(new Date())) {
                        match.date = new Date();
                        match.date.setHours(0, 30, 0, 0);
                    }
                }
                match.minute = minute;
                match.score = [homeGoals, awayGoals];
                match.events = makeEvents(homeGoals, awayGoals, minute);
                match.stats = makeStats(home, away, homeGoals, awayGoals, ratio);

            } else {

                match.status = 'upcoming';
            }

            matches.push(match);
        }

        /* İlk takım sabit kalır, diğerleri bir sıra döner. */
        ids.splice(1, 0, ids.pop());
    }

    return matches;
}

const MATCHES = LEAGUES.flatMap(makeMatches);
const MATCH_BY_ID = new Map(MATCHES.map(match => [match.id, match]));


/* =================================================

   -------------------------------------------------

================================================= */

const SAVED_KEY = 'canliSkorKayitli';

function loadSaved() {
    try {
        return new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'));
    } catch (error) {
        return new Set();
    }
}

const savedIds = loadSaved();

function isSaved(id) {
    return savedIds.has(id);
}

function toggleSaved(id) {

    if (savedIds.has(id))
        savedIds.delete(id);
    else
        savedIds.add(id);

    try {
        localStorage.setItem(SAVED_KEY, JSON.stringify(Array.from(savedIds)));
    } catch (error) {}

    /* Aynı maçın bütün zilleri yerinde güncellenir (liste baştan çizilmez) */
    document.querySelectorAll('.score-bell[data-id="' + id + '"]').forEach(bell => {
        bell.classList.toggle('on', savedIds.has(id));
    });

    /* Kayıtlı Maçlarım sayfası açıksa satır hemen kalksın; değilse yenilensin */
    if (document.body.dataset.tab !== 'empty' || savedIds.has(id))
        renderSaved();
    else
        renderSavedLater();

    return savedIds.has(id);
}

/* Kayıtlı sayfasında zil kapatılınca satır animasyondan sonra kalkar */
let savedTimer = null;

function renderSavedLater() {
    clearTimeout(savedTimer);
    savedTimer = setTimeout(renderSaved, 250);
}

================================================= */

const DAYS = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
const MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];

function formatDate(date) {
    return DAYS[date.getDay()] + ' ' + date.getDate() + ' ' + MONTHS[date.getMonth()];
}

function formatTime(date) {
    return String(date.getHours()).padStart(2, '0') + ':' +
        String(date.getMinutes()).padStart(2, '0');
}

function crest(team) {
    const el = document.createElement('span');
    el.className = 'crest';
    el.style.background = team.bg;
    el.style.color = team.fg;
    el.textContent = team.short;
    return el;
}

/* "CANLI 63'" / "MS" / "17:00" */
function statusText(match) {
    if (match.status === 'live') return "CANLI " + match.minute + "'";
    if (match.status === 'done') return 'MS';
    return formatTime(match.date);
}

function matchCard(match, options = {}) {

    const card = document.createElement('button');
    card.className = 'match-card';

    /* Üst satır: hafta ve tarih solda, durum sağda */
    const head = document.createElement('div');
    head.className = 'match-head';

    const when = document.createElement('span');
    when.textContent = match.league.name + ' · ' + match.week + '. Hafta · ' + formatDate(match.date);

    const status = document.createElement('span');
    status.className = 'match-status ' + match.status;
    status.textContent = statusText(match);

    head.appendChild(when);
    head.appendChild(status);
    card.appendChild(head);

    /* İki takım ve skorları */
    [['home', 0], ['away', 1]].forEach(([side, index]) => {

        const row = document.createElement('div');
        row.className = 'team-row';

        if (match.score && match.status === 'done' &&
            match.score[index] < match.score[1 - index]) {
            row.classList.add('lost');
        }

        const name = document.createElement('span');
        name.className = 'team-name';
        name.textContent = match[side].name;

        const score = document.createElement('span');
        score.className = 'team-score';
        score.textContent = match.score ? match.score[index] : '';

        row.appendChild(crest(match[side]));
        row.appendChild(name);
        row.appendChild(score);
        card.appendChild(row);
    });

    /* Oranlar sayfasında 1 / X / 2 */
    if (options.odds)
        card.appendChild(oddsRow(match, ['1', 'X', '2'], ['home', 'draw', 'away']));

    /* Alt satır: yorum | beğeni, beğenmeme (şimdilik sahte, çalışmaz).
       Oranlar sayfasında yoktur. */
    if (options.odds) {
        card.addEventListener('click', () => openDetail(match.id));
        return card;
    }

    const stats = document.createElement('div');
    stats.className = 'match-stats';

    [
        ['comment', match.comments + ' yorum'],
        ['like', match.likes],
        ['dislike', match.dislikes]
    ].forEach(([kind, value]) => {
        const stat = document.createElement('span');
        stat.className = 'stat ' + kind;
        stat.innerHTML = ICONS[kind];
        stat.appendChild(document.createTextNode(String(value)));
        stats.appendChild(stat);
    });

    card.appendChild(stats);

    card.addEventListener('click', () => openDetail(match.id));

    return card;
}

function oddsRow(match, labels, keys) {

    const row = document.createElement('div');
    row.className = 'odds-row';

    labels.forEach((label, i) => {
        const box = document.createElement('div');
        box.className = 'odd';
        box.innerHTML = '<span></span><b></b>';
        box.querySelector('span').textContent = label;
        box.querySelector('b').textContent = match.odds[keys[i]];
        row.appendChild(box);
    });

    if (labels.length === 2)
        row.style.gridTemplateColumns = 'repeat(2, 1fr)';

    return row;
}

function weekTitle(text) {
    const el = document.createElement('div');
    el.className = 'week-title';
    el.textContent = text;
    return el;
}

/* Günün anahtarı: "2026-10-17" (telefonun saatine göre) */
function dayKey(date) {
    return date.getFullYear() + '-' +
        String(date.getMonth() + 1).padStart(2, '0') + '-' +
        String(date.getDate()).padStart(2, '0');
}

const TODAY = dayKey(new Date());

/* Düğmedeki yazı: Dün / Bugün / Yarın ya da "Cmt 17 Eki" */
function dayLabel(key) {

    const date = new Date(key + 'T12:00:00');
    const diff = Math.round((date - new Date(TODAY + 'T12:00:00')) / 86400000);

    if (diff === 0) return 'Bugün';
    if (diff === -1) return 'Dün';
    if (diff === 1) return 'Yarın';

    return formatDate(date);
}

let selectedDay = TODAY;

/* Düğmelerdeki günler, sırayla (oklar için) */
let dayKeys = [];

/* Gün düğmeleri: maç olan günler + bugün */
function renderDays() {

    const box = document.getElementById('dayBox');
    box.textContent = '';

    const keys = new Set(MATCHES.map(m => dayKey(m.date)));
    keys.add(TODAY);

    /* Takvimden maçsız bir gün seçildiyse o da listede olsun */
    keys.add(selectedDay);

    Array.from(keys).sort().forEach(key => {

        const button = document.createElement('button');
        /* Üstte gün adı, altta gün.ay */
        const date = new Date(key + 'T12:00:00');

        const name = document.createElement('span');
        name.className = 'day-name';
        name.textContent = key === TODAY ? 'Bugün' : DAYS[date.getDay()];

        const dm = document.createElement('span');
        dm.className = 'day-date';
        dm.textContent = String(date.getDate()).padStart(2, '0') + '.' +
            String(date.getMonth() + 1).padStart(2, '0');

        button.appendChild(name);
        /* Bugünün düğmesinde yalnızca "Bugün" yazar, tarih yok */
        if (key !== TODAY) button.appendChild(dm);
        button.dataset.day = key;
        button.classList.toggle('active', key === selectedDay);

        button.addEventListener('click', () => selectDay(key));

        box.appendChild(button);
    });

    /* Oklar: ilk ve son günde pasif */
    const list = Array.from(keys).sort();
    const index = list.indexOf(selectedDay);

    document.getElementById('dayPrev').disabled = index <= 0;
    document.getElementById('dayNext').disabled = index >= list.length - 1;

    dayKeys = list;

    /* Seçili gün görünür olsun (ortada). */
    const active = box.querySelector('button.active');

    if (active)
        box.scrollLeft = active.offsetLeft - (box.clientWidth - active.offsetWidth) / 2;
}

/*
 * Bir gün seçilir: "Canlı" ve arama kapanır, liste o güne döner.
 * (Gün düğmeleri ve takvim kullanır.)
 */
function selectDay(key) {

    selectedDay = key;
    liveOnly = false;
    searchInput.value = '';

    renderDays();
    renderLive();
}

/* Oklar: listede bir önceki / sonraki güne geçer */
['dayPrev', 'dayNext'].forEach((id, i) => {
    document.getElementById(id).addEventListener('click', () => {

        const next = dayKeys[dayKeys.indexOf(selectedDay) + (i === 0 ? -1 : 1)];

        if (next)
            selectDay(next);
    });
});

/* Tek satırlık maç: durum | ev sahibi | skor | deplasman */
function scoreRow(match, showDate, showLeague) {

    /* Satırın içinde zil düğmesi olduğu için satır <button> değil */
    const row = document.createElement('div');
    row.className = 'score-row';
    row.setAttribute('role', 'button');
    row.tabIndex = 0;

    /* Arama sonuçlarında maçın tarihi de yazar */
    if (showDate || showLeague) {
        const date = document.createElement('span');
        date.className = 'score-date';
        date.textContent = [
            showLeague ? match.league.name : '',
            showDate ? dayLabel(dayKey(match.date)) + ' · ' + match.week + '. Hafta' : ''
        ].filter(Boolean).join(' · ');
        row.appendChild(date);
    }

    const status = document.createElement('span');
    status.className = 'score-status' + (match.status === 'live' ? ' live' : '');
    status.textContent =
        match.status === 'live' ? match.minute + "'" :
        match.status === 'done' ? 'MS' : formatTime(match.date);

    const team = (side, index) => {

        const el = document.createElement('span');
        el.className = 'score-team ' + side;

        /* Önde / kazanan takım kalın; diğerleri ve oynanmamış maç normal */
        if (match.score && match.score[index] > match.score[1 - index])
            el.classList.add('won');

        /*
         * Tek satıra sığsın diye arma yok, sadece ad. Uzun adlar
         * şimdilik kısaltılır (mid); gerçek veride düzenlenecek.
         */
        const name = document.createElement('span');
        name.textContent = match[side].mid || match[side].name;
        el.appendChild(name);

        return el;
    };

    const mid = document.createElement('span');
    mid.className = 'score-mid' + (match.status === 'live' ? ' live' : '');
    mid.textContent = match.score ? match.score[0] + ' - ' + match.score[1] : '-';

    row.appendChild(status);
    row.appendChild(team('home', 0));
    row.appendChild(mid);
    row.appendChild(team('away', 1));

    /* Zil: maçı kaydeder / kayıttan çıkarır (sarı = kayıtlı) */
    const bell = document.createElement('button');
    bell.className = 'score-bell';
    bell.dataset.id = match.id;
    bell.setAttribute('aria-label', 'Maçı kaydet');
    bell.innerHTML = ICONS.bell;
    bell.classList.toggle('on', isSaved(match.id));

    bell.addEventListener('click', event => {

        event.stopPropagation();

        const added = toggleSaved(match.id);

        /* Eklenme animasyonu */
        if (added) {
            row.classList.remove('flash');
            row.getBoundingClientRect();
            row.classList.add('flash');
        }
    });

    row.appendChild(bell);

    row.addEventListener('click', () => openDetail(match.id));

    return row;
}

/*
 * CANLI SKOR SÜZGEÇLERİ
 * liveOnly       : "Canlı" açık; günden bağımsız, o an oynanan maçlar
 * leagueSelected : Ligler menüsünde işaretli ligler (boşsa hepsi)
 * arama          : takım adına göre; günden bağımsız, bütün maçlar
 */
let liveOnly = false;

/* "Zaman" açık: ligler ayrılmadan saat sırasıyla */
let timeOrder = false;
const leagueSelected = new Set();

const searchInput = document.getElementById('searchInput');
const liveTools = document.getElementById('liveTools');

/* Türkçe harflere duyarlı küçük harf */
function lower(text) {
    return text.toLocaleLowerCase('tr');
}

/* Canlı Skor: lig lig, tek satır */
function renderLive() {

    const box = document.getElementById('liveList');
    box.textContent = '';

    const query = lower(searchInput.value.trim());
    const searching = query.length > 0;

    liveTools.classList.toggle('no-day', liveOnly || searching);
    document.getElementById('liveOnlyBtn').classList.toggle('active', liveOnly);

    document.getElementById('timeOrderBtn').classList.toggle('active', timeOrder);

    let any = false;

    /* Zamana göre: ligler ayrılmaz, tek kutuda saat sırasıyla */
    const groups = timeOrder ? [null] : LEAGUES;

    groups.forEach(league => {

        if (league && leagueSelected.size && !leagueSelected.has(league.id))
            return;

        let list = MATCHES.filter(m => timeOrder || m.league === league);

        if (liveOnly)
            list = list.filter(m => m.status === 'live');

        if (searching) {
            list = list.filter(m =>
                lower(m.home.name).includes(query) || lower(m.away.name).includes(query)
            );
        }

        if (timeOrder && leagueSelected.size)
            list = list.filter(m => leagueSelected.has(m.league.id));

        if (!liveOnly && !searching)
            list = list.filter(m => dayKey(m.date) === selectedDay);

        /* Aramada en yeni maç üstte, diğerlerinde saat sırasıyla */
        list.sort((a, b) => searching ? b.date - a.date : a.date - b.date);

        if (!list.length)
            return;

        any = true;

        const block = document.createElement('div');
        block.className = 'league-block';

        /* Zamana göre: başlık yok, her satırın üstünde ligi yazar */
        if (!league) {
            list.forEach(m => block.appendChild(scoreRow(m, searching, true)));
            box.appendChild(block);
            return;
        }

        const head = document.createElement('div');
        head.className = 'league-head';
        head.innerHTML = league.flag + '<span></span>';
        head.querySelector('span').textContent = league.country + ' · ';
        head.appendChild(document.createTextNode(
            league.name + (searching ? '' : ' · ' + list[0].week + '. Hafta')
        ));

        block.appendChild(head);
        list.forEach(m => block.appendChild(scoreRow(m, searching)));
        box.appendChild(block);
    });

    if (!any) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent =
            searching ? '"' + searchInput.value.trim() + '" için maç bulunamadı.' :
            liveOnly ? 'Şu an oynanan maç yok.' : 'Bu gün maç yok.';
        box.appendChild(empty);
    }
}

/* "Canlı": aç / kapat */
document.getElementById('liveOnlyBtn').addEventListener('click', () => {

    liveOnly = !liveOnly;

    if (liveOnly)
        searchInput.value = '';

    renderLive();
});

/* "Zamana göre": aç / kapat */
document.getElementById('timeOrderBtn').addEventListener('click', () => {
    timeOrder = !timeOrder;
    renderLive();
});

/* Arama: yazdıkça süzülür */
searchInput.addEventListener('input', () => {

    if (searchInput.value.trim())
        liveOnly = false;

    renderLive();
});

/* Ligler menüsü */
const leagueMenu = document.getElementById('leagueMenu');
const leagueFilterBtn = document.getElementById('leagueFilterBtn');

LEAGUES.forEach(league => {

    const row = document.createElement('label');
    const input = document.createElement('input');
    const name = document.createElement('span');
    const country = document.createElement('small');

    input.type = 'checkbox';
    name.textContent = league.name;
    country.textContent = league.country;

    input.addEventListener('change', () => {

        if (input.checked)
            leagueSelected.add(league.id);
        else
            leagueSelected.delete(league.id);

        leagueFilterBtn.firstChild.textContent =
            leagueSelected.size ? 'Ligler (' + leagueSelected.size + ') ' : 'Ligler ';
        leagueFilterBtn.classList.toggle('active', leagueSelected.size > 0);

        renderLive();
    });

    row.appendChild(input);
    row.appendChild(name);
    row.appendChild(country);
    leagueMenu.appendChild(row);
});

function hideLeagueMenu() {
    leagueMenu.classList.remove('open');
}

function closeLeagueMenu() {
    hideLeagueMenu();
    layerClosed('leagueMenu');
}

leagueFilterBtn.addEventListener('click', () => {

    if (leagueMenu.classList.contains('open')) {
        closeLeagueMenu();
        return;
    }

    leagueMenu.classList.add('open');
    layerOpened('leagueMenu');
});

/* Menünün dışına dokununca menü kapanır (dokunulan yer çalışmaz). */
let leagueSwallow = false;

document.addEventListener('pointerdown', event => {

    leagueSwallow =
        leagueMenu.classList.contains('open') &&
        !event.target.closest('#leagueFilterBox');

    if (leagueSwallow) {
        event.preventDefault();
        event.stopPropagation();
        closeLeagueMenu();
    }

}, true);

document.addEventListener('click', event => {

    if (!leagueSwallow)
        return;

    leagueSwallow = false;
    event.preventDefault();
    event.stopPropagation();

}, true);

document.getElementById('calendarBtn').addEventListener('click', () => {

/*
 * KAYITLI MAÇLARIM (mavi top sayfası)
 * Zili sarı olan maçlar, lig lig; en yakın tarihli üstte.
 */
function renderSaved() {

    const box = document.getElementById('mySaved');
    box.textContent = '';

    let any = false;

    LEAGUES.forEach(league => {

        const list = MATCHES
            .filter(m => m.league === league && savedIds.has(m.id))
            .sort((a, b) => a.date - b.date);

        if (!list.length)
            return;

        any = true;

        const block = document.createElement('div');
        block.className = 'league-block';

        const head = document.createElement('div');
        head.className = 'league-head';
        head.innerHTML = league.flag + '<span></span>';
        head.querySelector('span').textContent = league.country + ' · ';
        head.appendChild(document.createTextNode(league.name));

        block.appendChild(head);
        list.forEach(m => block.appendChild(scoreRow(m, true)));

    if (!any) {

    }

const MY_ORDER = ['saved', 'coupons'];
const myMain = document.getElementById('myMain');
const myTrack = document.getElementById('myTrack');

let myPage = 'saved';
let myTrackTimer = null;
let mySwipe = null;

function setMyPage(name) {

    myPage = name;

    document.querySelectorAll('#myTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.my === name);
    });

    myTrack.querySelectorAll('.my-page').forEach(page => {
        page.classList.toggle('current', page.dataset.my === name);
    });

    myTrack.classList.add('both');
    myTrack.style.setProperty('--page', MY_ORDER.indexOf(name));

    clearTimeout(myTrackTimer);
    myTrackTimer = setTimeout(() => {
        if (!mySwipe)
            myTrack.classList.remove('both');
    }, 320);
}

document.querySelectorAll('#myTabs button').forEach(button => {
    button.addEventListener('click', () => setMyPage(button.dataset.my));
});

/* Parmakla yana kaydırma (ana sayfadakiyle aynı his) */
myMain.addEventListener('touchstart', event => {

    mySwipe = event.touches.length === 1 ? {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    } : null;

}, { passive: true });

myMain.addEventListener('touchmove', event => {

    if (!mySwipe)
        return;

    const dx = event.touches[0].clientX - mySwipe.x;
    const dy = event.touches[0].clientY - mySwipe.y;

    if (mySwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        mySwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (mySwipe.horizontal) {
            myMain.classList.add('swiping');
            myTrack.classList.add('both');
        }
    }

    if (!mySwipe.horizontal)
        return;

    mySwipe.dx = dx;

    const index = MY_ORDER.indexOf(myPage);
    const atEdge = (index === 0 && dx > 0) || (index === MY_ORDER.length - 1 && dx < 0);

    myTrack.style.setProperty('--swipe-x', (atEdge ? dx * 0.25 : dx) + 'px');

}, { passive: true });

function endMySwipe() {

    if (!mySwipe)
        return;

    const swipe = mySwipe;

    mySwipe = null;
    myMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = myMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = MY_ORDER[MY_ORDER.indexOf(myPage) + (swipe.dx < 0 ? 1 : -1)];

    myTrack.style.setProperty('--swipe-x', '0px');
    setMyPage(enough && next ? next : myPage);
}

myMain.addEventListener('touchend', endMySwipe, { passive: true });
myMain.addEventListener('touchcancel', endMySwipe, { passive: true });

/*
 * FORUM
 * Maçlar ayrıntılı kartlarla (yorum, beğeni...). Üstteki satırdan sıralanır:
 *   popular : en çok yorum alan maçlar (oynanmış ya da canlı)
 *   league  : lig lig, hafta hafta (önce canlı maçlar)
 *   time    : en yeni maç üstte (önce canlı, sonra oynanacak, sonra oynanmış)
 */
let forumSort = 'popular';

function renderForum() {

    const box = document.getElementById('forumList');
    box.textContent = '';

    document.querySelectorAll('#forumSort button').forEach(button => {
        button.classList.toggle('active', button.dataset.sort === forumSort);
    });

    /* Arama: takım adına göre */
    const query = lower(forumSearchInput.value.trim());
    const all = query
        ? MATCHES.filter(m => lower(m.home.name).includes(query) || lower(m.away.name).includes(query))
        : MATCHES;

    if (!all.length) {
        const empty = document.createElement('p');
        empty.className = 'home-empty';
        empty.textContent = '"' + forumSearchInput.value.trim() + '" için maç bulunamadı.';
        box.appendChild(empty);
        return;
    }

    if (forumSort === 'popular') {

        all
            .slice()
            .sort((a, b) => b.comments - a.comments)
            .slice(0, 20)
            .forEach(m => box.appendChild(matchCard(m)));

        return;
    }

    if (forumSort === 'time') {

        const order = { live: 0, upcoming: 1, done: 2 };

        all
            .slice()
            .sort((a, b) =>
                order[a.status] - order[b.status] ||
                (a.status === 'upcoming' ? a.date - b.date : b.date - a.date)
            )
            .forEach(m => box.appendChild(matchCard(m)));

        return;
    }

    const live = all.filter(m => m.status === 'live');

    live.forEach(m => box.appendChild(matchCard(m)));

    LEAGUES.forEach(league => {

        for (let week = CURRENT_WEEK; week >= 1; week--) {

            const list = all.filter(m =>
                m.league === league && m.week === week && m.status !== 'live'
            );

            if (!list.length)
                continue;

            box.appendChild(weekTitle(
                league.name.toLocaleUpperCase('tr') + ' · ' + week + '. HAFTA' +
                (week === CURRENT_WEEK ? ' · OYNANACAK' : '')
            ));

            list.forEach(m => box.appendChild(matchCard(m)));
        }
    });
}

forumSearchInput.addEventListener('input', renderForum);

document.querySelectorAll('#forumSort button').forEach(button => {
    button.addEventListener('click', () => {
        forumSort = button.dataset.sort;
        renderForum();
    });
});

/* Oranlar: her ligin bu haftaki maçları, 1 / X / 2 ile */
function renderOdds() {

    const box = document.getElementById('oddsList');
    box.textContent = '';

    LEAGUES.forEach(league => {

        box.appendChild(weekTitle(
            league.name.toLocaleUpperCase('tr') + ' · ' + CURRENT_WEEK + '. HAFTA ORANLARI'
        ));

        MATCHES
            .filter(m => m.league === league && m.week === CURRENT_WEEK)
            .forEach(m => box.appendChild(matchCard(m, { odds: true })));
    });
}

/* =================================================
   GERİ TUŞU
   -------------------------------------------------
   Açılan her katman (sayfa, menü...) geçmişe bir kayıt
   ekler; geri tuşu en son açılanı kapatır.
================================================= */

const openLayers = [];
let ignoredPops = 0;
let waitingLayers = [];

const LAYER_HIDERS = {
    empty: () => setTab('home'),
    leagueMenu: hideLeagueMenu,
    homeMode: () => setHomeModeView('live'),
    homeMenu: () => homeMenu.classList.remove('open'),
    detail: hideDetail
};

function layerOpened(name, url) {

    if (ignoredPops > 0) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        waitingLayers.push({ name: name, url: url });
        return;
    }

    try {

        if (openLayers.includes(name)) {
            if (url)
                history.replaceState({ depth: openLayers.length }, '', url);
            return;
        }

        openLayers.push(name);
        history.pushState({ depth: openLayers.length }, '', url || location.href);

    } catch (error) {}
}

function layerClosed(name) {

    if (waitingLayers.some(item => item.name === name)) {
        waitingLayers = waitingLayers.filter(item => item.name !== name);
        return;
    }

    const index = openLayers.indexOf(name);

    if (index < 0)
        return;

    openLayers.splice(index, 1);

    ignoredPops++;
    history.back();
}

window.addEventListener('popstate', event => {

    if (ignoredPops > 0) {

        ignoredPops--;

        if (ignoredPops === 0) {
            const waiting = waitingLayers;
            waitingLayers = [];
            waiting.forEach(item => layerOpened(item.name, item.url));
        }

        return;
    }

    const depth = (event.state && event.state.depth) || 0;

    if (depth > openLayers.length) {
        ignoredPops++;
        history.go(openLayers.length - depth);
        return;
    }

    while (openLayers.length > depth)
        LAYER_HIDERS[openLayers.pop()]();
});

   SEKMELER (ana sayfa / boş sayfa) VE MAVİ TOP
================================================= */

const acKapa = document.getElementById('acKapa');

const emptyLayer = document.getElementById('emptyLayer');
let settleTimer = null;

/* Penceredeki resmin alt kenarı, pencerenin üstünden kaç piksel aşağıda? */
function markClearTop() {
    const banner = emptyLayer.querySelector('.banner');
    const main = document.getElementById('myMain');
    const bottom = banner.offsetTop + banner.offsetHeight - main.scrollTop;
    emptyLayer.style.setProperty('--clear-top', Math.max(0, bottom) + 'px');
    emptyLayer.style.setProperty('--side', banner.getBoundingClientRect().left -
        emptyLayer.getBoundingClientRect().left + 'px');
}

function setTab(name) {

    /* Kayma başlamadan şeffaf üst ayarlanır; yerine oturunca gri olur. */
    clearTimeout(settleTimer);
    markClearTop();
    emptyLayer.classList.remove('settled');

    if (name === 'empty')
        settleTimer = setTimeout(() => emptyLayer.classList.add('settled'), 340);

    document.body.dataset.tab = name;
    acKapa.setAttribute('aria-label', name === 'empty' ? 'Ana sayfaya dön' : 'Sayfayı aç');
}

function showTab(name) {

    setTab(name);

    if (name === 'empty')
        layerOpened('empty');
    else
        layerClosed('empty');
}

acKapa.addEventListener('click', () => {
    showTab(document.body.dataset.tab === 'empty' ? 'home' : 'empty');
});


/* =================================================
   ANA SAYFANIN DÖRT SAYFASI
================================================= */

const HOME_ORDER = ['live', 'forum', 'analysis', 'odds'];

const homeMain = document.getElementById('homeMain');
const homeTrack = document.getElementById('homeTrack');
const homeModeBox = document.getElementById('homeModeBox');

let homeMode = 'live';
let homeTrackTimer = null;

/* Görünümü değiştirir (geri tuşuyla dönerken de kullanılır). */
function setHomeModeView(mode) {

    const index = HOME_ORDER.indexOf(mode);

    homeMode = mode;

    /* Gün seçimi, canlı, ligler ve arama sadece Canlı Skor'da */
    liveTools.style.display = mode === 'live' ? '' : 'none';

    homeModeBox.querySelectorAll('button').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
    });

    homeTrack.querySelectorAll('.home-page').forEach(page => {
        page.classList.toggle('current', page.dataset.page === mode);
    });

    /* Kayarken iki sayfa da görünsün; bitince diğerleri gizlenir. */
    homeTrack.classList.add('both');
    homeTrack.style.setProperty('--page', index);

    clearTimeout(homeTrackTimer);
    homeTrackTimer = setTimeout(() => {
        if (!homeSwipe)
            homeTrack.classList.remove('both');
    }, 320);
}

/*
 * "Canlı Skor" ana sayfadır. Başka bir sayfa açıkken geri
 * tuşu önce "Canlı Skor"a döner.
 */
function setHomeMode(mode) {

    setHomeModeView(mode);
    homeMain.scrollTop = Math.min(homeMain.scrollTop, homeTrack.offsetTop - 12);

    if (mode === 'live')
        layerClosed('homeMode');
    else
        layerOpened('homeMode');
}

homeModeBox.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => setHomeMode(button.dataset.mode));
});

/* Yana kaydırma (inşaat uygulamasındakiyle aynı his) */
const TAB_SWIPE_RATIO = 0.12;
const TAB_FLICK_RATIO = 0.04;

let homeSwipe = null;

function setHomeSwipeX(px) {
    homeTrack.style.setProperty('--swipe-x', px + 'px');
}

homeMain.addEventListener('touchstart', event => {

    /* Gün düğmeleri kendi içinde yana kayar; sayfa değişmez. */
    if (event.touches.length !== 1 || event.target.closest('#liveTools, #forumSort, #forumSearchBox')) {
        homeSwipe = null;
        return;
    }

    homeSwipe = {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    };

}, { passive: true });

homeMain.addEventListener('touchmove', event => {

    if (!homeSwipe)
        return;

    const dx = event.touches[0].clientX - homeSwipe.x;
    const dy = event.touches[0].clientY - homeSwipe.y;

    if (homeSwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        homeSwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (homeSwipe.horizontal) {
            homeMain.classList.add('swiping');
            homeTrack.classList.add('both');
        }
    }

    if (!homeSwipe.horizontal)
        return;

    homeSwipe.dx = dx;

    const index = HOME_ORDER.indexOf(homeMode);
    const atEdge = (index === 0 && dx > 0) || (index === HOME_ORDER.length - 1 && dx < 0);

    setHomeSwipeX(atEdge ? dx * 0.25 : dx);

}, { passive: true });

function endHomeSwipe() {

    if (!homeSwipe)
        return;

    const swipe = homeSwipe;

    homeSwipe = null;
    homeMain.classList.remove('swiping');

    if (!swipe.horizontal)
        return;

    const width = homeMain.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = HOME_ORDER[HOME_ORDER.indexOf(homeMode) + (swipe.dx < 0 ? 1 : -1)];

    setHomeSwipeX(0);

    if (enough && next)
        setHomeMode(next);
    else
        setHomeModeView(homeMode);
}

homeMain.addEventListener('touchend', endHomeSwipe, { passive: true });
homeMain.addEventListener('touchcancel', endHomeSwipe, { passive: true });

   SAĞ ÜST MENÜ
================================================= */

const homeMenu = document.getElementById('homeMenu');
const menuBtn = document.getElementById('menuBtn');

function closeHomeMenu() {
    homeMenu.classList.remove('open');
    layerClosed('homeMenu');
}

menuBtn.addEventListener('click', event => {

    event.stopPropagation();

    if (homeMenu.classList.contains('open')) {
        closeHomeMenu();
        return;
    }

    /* Menü, düğmenin hemen altında açılır. */
    const box = menuBtn.getBoundingClientRect();
    homeMenu.style.top = (box.bottom + 2) + 'px';

    homeMenu.classList.add('open');
    layerOpened('homeMenu');
});

homeMenu.querySelectorAll('button[data-go]').forEach(button => {
    button.addEventListener('click', () => {
        closeHomeMenu();
        setHomeMode(button.dataset.go);
    });
});

document.getElementById('menuClose').addEventListener('click', closeHomeMenu);

/* Menü açıkken başka bir yere dokunulursa sadece menü kapanır. */
let menuSwallow = false;

document.addEventListener('pointerdown', event => {

    menuSwallow =
        homeMenu.classList.contains('open') &&
        !event.target.closest('#homeMenu, #menuBtn');

    if (menuSwallow) {
        event.preventDefault();
        event.stopPropagation();
        closeHomeMenu();
    }

}, true);

document.addEventListener('click', event => {

    if (!menuSwallow)
        return;

    menuSwallow = false;
    event.preventDefault();
    event.stopPropagation();

}, true);

homeMain.addEventListener('scroll', () => {
    if (homeMenu.classList.contains('open'))
        closeHomeMenu();
});


/* =================================================
   MAÇ SAYFASI
================================================= */

const detailSheet = document.getElementById('detailSheet');
const detailTrack = document.getElementById('detailTrack');
const detailBody = document.getElementById('detailBody');
const detailPanel = document.getElementById('detailPanel');
const detailHead = document.getElementById('detailHead');
const scoreBoard = document.getElementById('scoreBoard');

const DETAIL_TABS = ['summary', 'stats', 'odds', 'comments'];
const LINK_PREFIX = '#mac=';

let detailId = null;
let detailTab = 'summary';

function sbTeam(el, team) {
    el.textContent = '';
    el.appendChild(crest(team));
    const name = document.createElement('span');
    name.textContent = team.name;
    el.appendChild(name);
}

function renderSummary(match) {

    const box = document.getElementById('summaryBox');
    box.textContent = '';

    if (!match.events) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'Maç ' + formatDate(match.date) + ' ' + formatTime(match.date) +
            ' saatinde başlayacak.';
        box.appendChild(p);
        return;
    }

    let halfShown = false;

    const events = match.events.slice();

    if (events.some(e => e.minute <= 45)) {
        const first = document.createElement('div');
        first.className = 'half-line';
        first.textContent = 'İLK YARI';
        box.appendChild(first);
    }

    if (!events.length) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'Henüz önemli bir olay yok.';
        box.appendChild(p);
    }

    events.forEach(event => {

        if (!halfShown && event.minute > 45) {
            halfShown = true;
            const line = document.createElement('div');
            line.className = 'half-line';
            line.textContent = 'İKİNCİ YARI';
            box.appendChild(line);
        }

        const row = document.createElement('div');
        row.className = 'event';

        const home = document.createElement('div');
        home.className = 'home';
        const minute = document.createElement('div');
        minute.className = 'minute';
        minute.textContent = event.minute + "'";
        const away = document.createElement('div');

        const label = document.createElement('span');
        label.className = 'event-label';

        if (event.type === 'goal') {
            label.textContent = '⚽ Gol';
        } else {
            const icon = document.createElement('span');
            icon.className = 'card-icon' + (event.type === 'red' ? ' red' : '');
            label.appendChild(icon);
            label.appendChild(document.createTextNode(
                event.type === 'red' ? 'Kırmızı kart' : 'Sarı kart'
            ));
        }

        (event.side === 'home' ? home : away).appendChild(label);

        row.appendChild(home);
        row.appendChild(minute);
        row.appendChild(away);
        box.appendChild(row);
    });

    if (match.status === 'done') {
        const end = document.createElement('div');
        end.className = 'half-line';
        end.textContent = 'MAÇ SONU · ' + match.score[0] + ' - ' + match.score[1];
        box.appendChild(end);
    }
}

function renderStats(match) {

    const box = document.getElementById('statsBox');
    box.textContent = '';

    if (!match.stats) {
        const p = document.createElement('p');
        p.className = 'tab-empty';
        p.textContent = 'İstatistikler maç başlayınca görünecek.';
        box.appendChild(p);
        return;
    }

    const s = match.stats;

    const cards = side => match.events.filter(e => e.side === side && e.type !== 'goal').length;

    [
        ['Topla oynama', s.possession[0] + '%', s.possession[1] + '%', s.possession[0], s.possession[1]],
        ['Şut', s.home.shots, s.away.shots],
        ['İsabetli şut', s.home.onTarget, s.away.onTarget],
        ['Korner', s.home.corners, s.away.corners],
        ['Faul', s.home.fouls, s.away.fouls],
        ['Kart', cards('home'), cards('away')]
    ].forEach(([label, h, a, hv, av]) => {

        hv = hv === undefined ? h : hv;
        av = av === undefined ? a : av;

        const total = (hv + av) || 1;

        const line = document.createElement('div');
        line.className = 'stat-line';

        line.innerHTML =
            '<div class="stat-top"><span></span><span></span><span></span></div>' +
            '<div class="stat-bars"><div class="h"></div><div class="a"></div></div>';

        const spans = line.querySelectorAll('.stat-top span');
        spans[0].textContent = h;
        spans[1].textContent = label;
        spans[2].textContent = a;

        const bars = line.querySelectorAll('.stat-bars div');
        bars[0].style.flex = String(Math.max(hv, 0.001) / total);
        bars[1].style.flex = String(Math.max(av, 0.001) / total);

        box.appendChild(line);
    });
}

function renderDetailOdds(match) {

    const box = document.getElementById('oddsBox');
    box.textContent = '';

    const block = (title, labels, keys) => {
        const wrap = document.createElement('div');
        wrap.className = 'odds-block';
        const t = document.createElement('p');
        t.className = 'odds-title';
        t.textContent = title;
        wrap.appendChild(t);
        wrap.appendChild(oddsRow(match, labels, keys));
        box.appendChild(wrap);
    };

    block('MAÇ SONUCU', ['1', 'X', '2'], ['home', 'draw', 'away']);
    block('2,5 GOL ALT / ÜST', ['Alt', 'Üst'], ['under', 'over']);

    const note = document.createElement('p');
    note.className = 'odds-note';
    note.textContent = 'Oranlar örnektir; gerçek değildir.';
    box.appendChild(note);
}

function openDetail(id) {

    const match = MATCH_BY_ID.get(id);

    if (!match)
        return;

    detailId = id;

    document.getElementById('sbLeague').textContent =
        match.league.name + ' · ' + match.week + '. Hafta · ' + formatDate(match.date);

    sbTeam(document.getElementById('sbHome'), match.home);
    sbTeam(document.getElementById('sbAway'), match.away);

    document.getElementById('sbScoreText').textContent =
        match.score ? match.score[0] + ' - ' + match.score[1] : formatTime(match.date);

    const status = document.getElementById('sbStatus');
    status.textContent =
        match.status === 'live' ? "CANLI · " + match.minute + "'" :
        match.status === 'done' ? 'MAÇ SONU' : 'OYNANACAK';
    status.className = match.status === 'live' ? 'live' : '';

    renderSummary(match);
    renderStats(match);
    renderDetailOdds(match);

    /* Bölüm her açılışta aşağıda, ilk sekmede başlar. */
    detailLift = 0;
    detailPanel.style.setProperty('--lift', '0px');

    detailTrack.classList.add('dragging');
    setDetailTab('summary');
    detailTrack.getBoundingClientRect();
    detailTrack.classList.remove('dragging');

    detailSheet.classList.add('open');

    layerOpened('detail', LINK_PREFIX + encodeURIComponent(id));
}

function hideDetail() {
    detailSheet.classList.remove('open');
    detailId = null;
}

function closeDetail() {
    hideDetail();
    layerClosed('detail');
}

document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);

/* Sekmeler */
function setDetailTab(name, keepScroll) {

    detailTab = name;

    detailSheet.querySelectorAll('#detailTabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.tab === name);
    });

    placeDetailTrack(0);

    const page = detailSheet.querySelector('.tab-page[data-page="' + name + '"]');

    if (page && !keepScroll)
        page.scrollTop = 0;
}

function placeDetailTrack(dragPx) {
    const index = DETAIL_TABS.indexOf(detailTab);
    detailTrack.style.transform =
        'translateX(calc(' + (-index * 25) + '% + ' + dragPx + 'px))';
}

detailSheet.querySelectorAll('#detailTabs button').forEach(button => {
    button.addEventListener('click', () => setDetailTab(button.dataset.tab));
});

/* Sekmeler arası parmakla kaydırma */
let tabSwipe = null;

detailBody.addEventListener('touchstart', event => {

    tabSwipe = event.touches.length === 1 ? {
        x: event.touches[0].clientX,
        y: event.touches[0].clientY,
        time: Date.now(),
        dx: 0,
        horizontal: null
    } : null;

}, { passive: true });

detailBody.addEventListener('touchmove', event => {

    if (!tabSwipe)
        return;

    const dx = event.touches[0].clientX - tabSwipe.x;
    const dy = event.touches[0].clientY - tabSwipe.y;

    if (tabSwipe.horizontal === null) {

        if (Math.abs(dx) < 6 && Math.abs(dy) < 6)
            return;

        tabSwipe.horizontal = Math.abs(dx) > Math.abs(dy);

        if (tabSwipe.horizontal)
            detailTrack.classList.add('dragging');
    }

    if (!tabSwipe.horizontal)
        return;

    const index = DETAIL_TABS.indexOf(detailTab);
    const atEdge = (index === 0 && dx > 0) || (index === DETAIL_TABS.length - 1 && dx < 0);

    tabSwipe.dx = dx;
    placeDetailTrack(atEdge ? dx * 0.25 : dx);

}, { passive: true });

function endTabSwipe() {

    if (!tabSwipe)
        return;

    const swipe = tabSwipe;

    tabSwipe = null;
    detailTrack.classList.remove('dragging');

    if (!swipe.horizontal)
        return;

    const width = detailBody.clientWidth || 1;
    const distance = Math.abs(swipe.dx);
    const speed = distance / Math.max(1, Date.now() - swipe.time);

    const enough =
        distance > width * TAB_SWIPE_RATIO ||
        (distance > width * TAB_FLICK_RATIO && speed > 0.3);

    const next = DETAIL_TABS.indexOf(detailTab) + (swipe.dx < 0 ? 1 : -1);

    if (enough && next >= 0 && next < DETAIL_TABS.length)
        setDetailTab(DETAIL_TABS[next], true);
    else
        placeDetailTrack(0);
}

detailBody.addEventListener('touchend', endTabSwipe, { passive: true });
detailBody.addEventListener('touchcancel', endTabSwipe, { passive: true });

/* Bölümü yukarı çekme: skorun hemen altına kadar */
let detailLift = 0;
let liftDrag = null;
let liftDragged = false;

function maxDetailLift() {
    const board = scoreBoard.getBoundingClientRect();
    const score = document.getElementById('sbScore').getBoundingClientRect();
    return Math.max(0, board.bottom - (score.bottom + 10));
}

function setDetailLift(value) {
    detailLift = Math.max(0, Math.min(maxDetailLift(), value));
    detailPanel.style.setProperty('--lift', detailLift + 'px');
}

detailHead.addEventListener('pointerdown', event => {
    liftDrag = { y: event.clientY, lift: detailLift, moved: false };
    liftDragged = false;
});

detailHead.addEventListener('pointermove', event => {

    if (!liftDrag)
        return;

    const dy = liftDrag.y - event.clientY;

    if (!liftDrag.moved) {

        if (Math.abs(dy) < 8)
            return;

        liftDrag.moved = true;
        liftDragged = true;

        try {
            detailHead.setPointerCapture(event.pointerId);
        } catch (e) {}
    }

    setDetailLift(liftDrag.lift + dy);
});

['pointerup', 'pointercancel'].forEach(name => {
    detailHead.addEventListener(name, () => { liftDrag = null; });
});

detailSheet.addEventListener('dragstart', event => event.preventDefault());

/* Sürükleme bittiğinde altındaki sekme tıklanmış sayılmasın. */
detailHead.addEventListener('click', event => {
    if (liftDragged) {
        liftDragged = false;
        event.stopPropagation();
        event.preventDefault();
    }
}, true);

window.addEventListener('resize', () => {
    if (detailId)
        setDetailLift(detailLift);
});

document.addEventListener('keydown', event => {
    if (detailId && event.key === 'Escape')
        closeDetail();
});

/* Paylaşılan bağlantıyla açılış: #mac=... */
(function openLinkedMatch() {

    if (!location.hash.startsWith(LINK_PREFIX))
        return;

    const id = decodeURIComponent(location.hash.slice(LINK_PREFIX.length));

    try {
        history.replaceState(null, '', location.href.split('#')[0]);
    } catch (error) {}

    if (MATCH_BY_ID.has(id))
        openDetail(id);
})();
